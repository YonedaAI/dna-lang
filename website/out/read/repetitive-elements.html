    &lt;h1 style=&quot;margin-top:0&quot;&gt;Repetitive Elements as Self-Modifying Code — DNA-Lang, Part V&lt;/h1&gt;
    &lt;div class=&quot;paper-meta-row&quot;&gt;
      &lt;span&gt;Matthew Long&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;span&gt;YonedaAI Research Collective&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;span&gt;Chicago, IL&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;a href=&quot;../papers/repetitive-elements.pdf&quot;&gt;PDF&lt;/a&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;h1 data-number=&quot;1&quot; id=&quot;sec:intro&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1&lt;/span&gt; Introduction&lt;/h1&gt;
&lt;p&gt;The human genome comprises approximately 3.2 billion base pairs, yet fewer than 2% encode proteins. The remaining landscape is dominated by repetitive elements: DNA transposons, retrotransposons (both autonomous LINEs and non-autonomous SINEs), satellite DNA, and endogenous retroviruses (ERVs). Together, these constitute over 45% of the genome &lt;span class=&quot;citation&quot; data-cites=&quot;lander2001 debarros2008&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;For decades, these elements were labelled “selfish DNA” or “junk DNA,” understood merely as genomic parasites that replicate at the host’s expense &lt;span class=&quot;citation&quot; data-cites=&quot;orgel1980 doolittle1980&quot;&gt;&lt;/span&gt;. This view has undergone a profound revision. Transposable elements (TEs) serve as reservoirs of regulatory innovation &lt;span class=&quot;citation&quot; data-cites=&quot;feschotte2008&quot;&gt;&lt;/span&gt;, drive genome restructuring &lt;span class=&quot;citation&quot; data-cites=&quot;kazazian2004&quot;&gt;&lt;/span&gt;, and have been repeatedly &lt;em&gt;domesticated&lt;/em&gt; for host function—most dramatically in the case of V(D)J recombination, the engine of adaptive immunity &lt;span class=&quot;citation&quot; data-cites=&quot;agrawal1998&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;In the DNA-Lang framework, we interpret the genome as a programming language whose source code is simultaneously its own runtime. Repetitive elements, in this view, are not inert detritus but a &lt;em&gt;self-modifying code system&lt;/em&gt;—instructions that rewrite the very program they inhabit. This places genomes alongside the classical self-modifying architectures studied in computer science, from von Neumann’s stored-program concept to Lisp macros and JIT compilers.&lt;/p&gt;
&lt;div id=&quot;def:selfmod&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 1&lt;/strong&gt; (Self-Modifying Genome).  &lt;em&gt;A &lt;em&gt;self-modifying genome&lt;/em&gt; is a triple &lt;span class=&quot;math inline&quot;&gt;(\mathcal{G}, \mathsf{TE}, \tau)&lt;/span&gt; where:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{G}&lt;/span&gt; is a finite sequence over the alphabet &lt;span class=&quot;math inline&quot;&gt;\{A, T, G, C\}&lt;/span&gt;,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{TE}\subseteq \mathcal{G}&lt;/span&gt; is the set of transposable element loci,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\tau : \mathsf{TE}&amp;times; \mathcal{G}\to \mathcal{G}&lt;/span&gt; is the transposition function satisfying &lt;span class=&quot;math inline&quot;&gt;|\tau(t,g)| &amp;ge; |g|&lt;/span&gt; for retrotransposons (copy semantics) and &lt;span class=&quot;math inline&quot;&gt;|\tau(t,g)| = |g|&lt;/span&gt; for DNA transposons (move semantics).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;p&gt;The contributions of this paper are:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;A formal type system for repetitive elements, the &lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}\langle\mathsf{SelfModifying}\rangle&lt;/span&gt; type, capturing transposition mode, activity state, and host impact (&lt;a href=&quot;#sec:repeat-type&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:repeat-type&quot;&gt;4&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Proof that transposition defines an endofunctor on the genome category (&lt;a href=&quot;#sec:endofunctor&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:endofunctor&quot;&gt;5&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Formalization of LINE/SINE dependency as a dependent type relationship (&lt;a href=&quot;#sec:sines&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:sines&quot;&gt;7&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A Gödelian impossibility result on transposon self-prediction (&lt;a href=&quot;#sec:goedel&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:goedel&quot;&gt;11&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A complete Haskell implementation (&lt;a href=&quot;#sec:implementation&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:implementation&quot;&gt;12&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;1.1&quot; id=&quot;relationship-to-the-dna-lang-series&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1.1&lt;/span&gt; Relationship to the DNA-Lang Series&lt;/h2&gt;
&lt;p&gt;This paper is the fifth in a modular series of seven:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Regulatory Sequences as Higher-Order Functions&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Coding Sequences as Executable Functions&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Non-Coding RNA as Type-Level Programming&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Epigenetic Marks as Compiler Pragmas&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Repetitive Elements as Self-Modifying Code&lt;/em&gt; (this paper)&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Developmental Programs as Build Systems&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Structural DNA as Memory Architecture&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Each paper in the modular framework builds upon previous ones through hierarchical composition. Repetitive elements interact with regulatory sequences (Paper 1) by providing novel promoters upon insertion, with coding sequences (Paper 2) through exon shuffling and gene duplication, with non-coding RNA (Paper 3) as SINEs generate functional RNA transcripts, and with epigenetic marks (Paper 4) as chromatin state controls TE activity.&lt;/p&gt;
&lt;h1 data-number=&quot;2&quot; id=&quot;sec:cut-paste&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2&lt;/span&gt; DNA Transposons as Cut-and-Paste&lt;/h1&gt;
&lt;p&gt;DNA transposons, also known as Class II transposable elements, mobilize via a &lt;em&gt;cut-and-paste&lt;/em&gt; mechanism. The transposase enzyme recognizes terminal inverted repeats (TIRs) flanking the element, excises it from the donor site, and reinserts it at a target site. This is analogous to &lt;em&gt;move semantics&lt;/em&gt; in programming languages: the element exists at exactly one location at any time.&lt;/p&gt;
&lt;div id=&quot;def:cut-paste&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 2&lt;/strong&gt; (Cut-and-Paste Transposition).  &lt;em&gt;Let &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}= \alpha &amp;middot; t &amp;middot; \beta&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;t \in \mathsf{TE}&lt;/span&gt; is a DNA transposon flanked by sequences &lt;span class=&quot;math inline&quot;&gt;\alpha&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;\beta&lt;/span&gt;. A cut-and-paste transposition to target site &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;\beta = \beta_1 &amp;middot; \beta_2&lt;/span&gt; (with &lt;span class=&quot;math inline&quot;&gt;|\beta_1| = i&lt;/span&gt;) is: &lt;span class=&quot;math display&quot;&gt;\tau_{\mathrm{cut}}(t, \mathcal{G}) = \alpha &amp;middot; \beta_1 &amp;middot; t &amp;middot; \beta_2&lt;/span&gt; satisfying the &lt;em&gt;conservation law&lt;/em&gt;: &lt;span class=&quot;math inline&quot;&gt;|\tau_{\mathrm{cut}}(t, \mathcal{G})| = |\mathcal{G}|&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;This conservation law is the genomic analogue of linear type systems in programming languages, where resources must be used exactly once.&lt;/p&gt;
&lt;div id=&quot;thm:linear&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 3&lt;/strong&gt; (Linear Type Preservation).  &lt;em&gt;Cut-and-paste transposition preserves the linear type invariant. If &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}&lt;/span&gt; contains exactly &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt; copies of transposon &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;, then &lt;span class=&quot;math inline&quot;&gt;\tau_{\mathrm{cut}}(t, \mathcal{G})&lt;/span&gt; also contains exactly &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt; copies.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; By &lt;a href=&quot;#def:cut-paste&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;def:cut-paste&quot;&gt;2&lt;/a&gt;, &lt;span class=&quot;math inline&quot;&gt;\tau_{\mathrm{cut}}&lt;/span&gt; excises &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; from position &lt;span class=&quot;math inline&quot;&gt;|\alpha|&lt;/span&gt; and reinserts it at position &lt;span class=&quot;math inline&quot;&gt;|\alpha| + |\beta_1|&lt;/span&gt;. The multiset of subsequences is preserved since the operation is a permutation of the genome’s factorization. Hence the count of any subsequence, including &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;, is invariant. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.1&quot; id=&quot;terminal-inverted-repeats-as-delimiters&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.1&lt;/span&gt; Terminal Inverted Repeats as Delimiters&lt;/h2&gt;
&lt;p&gt;TIRs serve as the syntactic delimiters that the transposase recognizes. They form a palindromic boundary:&lt;/p&gt;
&lt;div id=&quot;def:tir&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 4&lt;/strong&gt; (Terminal Inverted Repeat).  &lt;em&gt;A &lt;em&gt;terminal inverted repeat&lt;/em&gt; for element &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; is a pair &lt;span class=&quot;math inline&quot;&gt;(l, r)&lt;/span&gt; of sequences satisfying &lt;span class=&quot;math inline&quot;&gt;r = \overline{l^R}&lt;/span&gt;, where &lt;span class=&quot;math inline&quot;&gt;\overline{(&amp;middot;)}&lt;/span&gt; denotes complement and &lt;span class=&quot;math inline&quot;&gt;(&amp;middot;)^R&lt;/span&gt; denotes reversal. The element is bounded as &lt;span class=&quot;math inline&quot;&gt;l &amp;middot; t_{\mathrm{body}} &amp;middot; r&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;This is precisely a &lt;em&gt;matched delimiter&lt;/em&gt; in the syntactic sense: the transposase parser recognizes the opening TIR, scans for the matching closing TIR, and the enclosed body is the transposon payload.&lt;/p&gt;
&lt;h2 data-number=&quot;2.2&quot; id=&quot;target-site-duplication&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.2&lt;/span&gt; Target Site Duplication&lt;/h2&gt;
&lt;p&gt;Upon insertion, the transposase creates a staggered cut at the target site, producing short direct repeats flanking the inserted element—the &lt;em&gt;target site duplication&lt;/em&gt; (TSD). This is the “footprint” left by transposition:&lt;/p&gt;
&lt;div id=&quot;prop:tsd&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 5&lt;/strong&gt; (TSD as Insertion Trace).  &lt;em&gt;Every cut-and-paste insertion at a target site &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; of length &lt;span class=&quot;math inline&quot;&gt;k&lt;/span&gt; produces a genome &lt;span class=&quot;math inline&quot;&gt;\alpha &amp;middot; s &amp;middot; \mathrm{TIR}_L &amp;middot; t_{\mathrm{body}} &amp;middot; \mathrm{TIR}_R
&amp;middot; s &amp;middot; \beta&lt;/span&gt;, where &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; is duplicated. The corrected conservation law is: &lt;span class=&quot;math display&quot;&gt;|\tau_{\mathrm{cut}}(t, \mathcal{G})| = |\mathcal{G}| + |s|&lt;/span&gt; accounting for the TSD.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.3&quot; id=&quot;the-transposase-as-an-interpreter&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.3&lt;/span&gt; The Transposase as an Interpreter&lt;/h2&gt;
&lt;p&gt;The transposase protein is the &lt;em&gt;interpreter&lt;/em&gt; of the transposon instruction. It reads the TIR delimiters, parses the transposon body, and executes the cut-and-paste operation. In the DNA-Lang type system:&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\mathsf{transposase} : \mathrm{TIR} \to \mathcal{G}\to (\mathcal{G}, \mathsf{InsertionSite})&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The transposase is itself encoded within many DNA transposons, making these elements &lt;em&gt;self-interpreting code&lt;/em&gt;: programs that contain their own interpreter.&lt;/p&gt;
&lt;h1 data-number=&quot;3&quot; id=&quot;sec:copy-paste&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3&lt;/span&gt; Retrotransposons as Copy-and-Paste&lt;/h1&gt;
&lt;p&gt;Class I elements, or retrotransposons, mobilize through an RNA intermediate: the element is transcribed to RNA, reverse-transcribed back to DNA, and the new copy is inserted at a target site. The original copy remains, yielding &lt;em&gt;copy semantics&lt;/em&gt;.&lt;/p&gt;
&lt;div id=&quot;def:copy-paste&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 6&lt;/strong&gt; (Copy-and-Paste Transposition).  &lt;em&gt;Let &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}= \alpha &amp;middot; t &amp;middot; \beta&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; is a retrotransposon. A copy-and-paste transposition to target site &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;\beta = \beta_1 &amp;middot; \beta_2&lt;/span&gt; is: &lt;span class=&quot;math display&quot;&gt;\tau_{\mathrm{copy}}(t, \mathcal{G}) = \alpha &amp;middot; t &amp;middot; \beta_1 &amp;middot; t&amp;#39; &amp;middot; \beta_2&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;t&amp;#39;&lt;/span&gt; is a (possibly mutated) copy of &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;. The &lt;em&gt;expansion law&lt;/em&gt;: &lt;span class=&quot;math inline&quot;&gt;|\tau_{\mathrm{copy}}(t, \mathcal{G})| = |\mathcal{G}| + |t&amp;#39;|&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:growth&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 7&lt;/strong&gt; (Monotonic Genome Growth).  &lt;em&gt;Under repeated copy-and-paste transposition, the genome size is monotonically non-decreasing: &lt;span class=&quot;math display&quot;&gt;|\mathcal{G}_0| &amp;le; |\mathcal{G}_1| &amp;le; |\mathcal{G}_2| &amp;le; &amp;middot;s&lt;/span&gt; Moreover, without deletion mechanisms, &lt;span class=&quot;math inline&quot;&gt;|\mathcal{G}_n| = |\mathcal{G}_0| + \sum_{i=0}^{n-1} |t_i&amp;#39;|&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; Immediate from &lt;a href=&quot;#def:copy-paste&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;def:copy-paste&quot;&gt;6&lt;/a&gt;: each copy-and-paste event adds &lt;span class=&quot;math inline&quot;&gt;|t&amp;#39;| &amp;gt; 0&lt;/span&gt; bases. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;This explains the empirical observation that retrotransposon-rich genomes tend to be large: the maize genome, for instance, has roughly doubled in size over the past 3 million years due to retrotransposon expansion &lt;span class=&quot;citation&quot; data-cites=&quot;sanmiguel1998&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;h2 data-number=&quot;3.1&quot; id=&quot;lines-long-interspersed-nuclear-elements&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.1&lt;/span&gt; LINEs: Long Interspersed Nuclear Elements&lt;/h2&gt;
&lt;p&gt;LINEs are autonomous retrotransposons encoding their own reverse transcriptase (RT) and endonuclease. The human L1 element, at approximately 6 kb, is the dominant LINE, with over 500&lt;span&gt;,&lt;/span&gt;000 copies comprising roughly 17% of the human genome.&lt;/p&gt;
&lt;div id=&quot;def:line&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 8&lt;/strong&gt; (LINE Structure).  &lt;em&gt;A LINE &lt;span class=&quot;math inline&quot;&gt;\ell&lt;/span&gt; has the structure: &lt;span class=&quot;math display&quot;&gt;\ell = \mathsf{5&amp;#39;UTR} &amp;middot; \mathsf{ORF1} &amp;middot; \mathsf{ORF2} &amp;middot; \mathsf{3&amp;#39;UTR} &amp;middot; \mathsf{polyA}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathsf{ORF1}&lt;/span&gt; encodes an RNA-binding protein and &lt;span class=&quot;math inline&quot;&gt;\mathsf{ORF2}&lt;/span&gt; encodes a bifunctional protein with endonuclease and reverse transcriptase domains.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The L1 retrotransposition cycle implements &lt;em&gt;target-primed reverse transcription&lt;/em&gt; (TPRT):&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Transcription: &lt;span class=&quot;math inline&quot;&gt;\ell_{\mathrm{DNA}} \xrightarrow{\mathrm{Pol\,II}} \ell_{\mathrm{RNA}}&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Translation: &lt;span class=&quot;math inline&quot;&gt;\ell_{\mathrm{RNA}} \xrightarrow{\mathrm{ribosome}} (\mathsf{ORF1p}, \mathsf{ORF2p})&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Target nicking: &lt;span class=&quot;math inline&quot;&gt;\mathsf{ORF2p}_{\mathrm{EN}} : \mathcal{G}\to (\mathcal{G}, \mathsf{Nick})&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Reverse transcription: &lt;span class=&quot;math inline&quot;&gt;\mathsf{ORF2p}_{\mathrm{RT}} : \ell_{\mathrm{RNA}} \to \ell_{\mathrm{cDNA}}&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Integration: &lt;span class=&quot;math inline&quot;&gt;\ell_{\mathrm{cDNA}} \xrightarrow{\mathrm{repair}} \mathcal{G}&amp;#39;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;3.2&quot; id=&quot;sines-short-interspersed-nuclear-elements&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.2&lt;/span&gt; SINEs: Short Interspersed Nuclear Elements&lt;/h2&gt;
&lt;p&gt;SINEs are non-autonomous: they do not encode their own transposition machinery but &lt;em&gt;parasitize&lt;/em&gt; the LINE machinery. The most abundant SINE in humans is the Alu element (approximately 300 bp), with over 1.1 million copies comprising roughly 11% of the genome.&lt;/p&gt;
&lt;div id=&quot;def:sine-dep&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 9&lt;/strong&gt; (SINE Dependency).  &lt;em&gt;A SINE &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; is a retrotransposon satisfying:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; does not encode reverse transcriptase or endonuclease,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; contains a Pol III internal promoter,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Transposition of &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; requires &lt;span class=&quot;math inline&quot;&gt;\exists \ell \in \mathsf{LINE}.\; \mathsf{active}(\ell)&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;p&gt;This dependency relationship will be formalized categorically in &lt;a href=&quot;#sec:sines&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;sec:sines&quot;&gt;7&lt;/a&gt;.&lt;/p&gt;
&lt;h1 data-number=&quot;4&quot; id=&quot;sec:repeat-type&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4&lt;/span&gt; The &lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}\langle\mathsf{SelfModifying}\rangle&lt;/span&gt; Type&lt;/h1&gt;
&lt;p&gt;We now introduce the central type of our framework.&lt;/p&gt;
&lt;div id=&quot;def:repeat-type&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 10&lt;/strong&gt; (&lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}\langle\mathsf{SelfModifying}\rangle&lt;/span&gt; Type).  &lt;em&gt;The type &lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}\langle S \rangle&lt;/span&gt; is a parameterized algebraic data type: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
\mathsf{Repeat}\langle S \rangle \;::=\;&amp;amp;\; \mathsf{DNATransposon}\{\\
  &amp;amp;\quad \mathsf{tirs} : \mathrm{TIR} &amp;times; \mathrm{TIR},\\
  &amp;amp;\quad \mathsf{transposase} : \mathrm{Gene},\\
  &amp;amp;\quad \mathsf{mode} : \mathsf{CutPaste},\\
  &amp;amp;\quad \mathsf{activity} : S \}\\
  \mid\;&amp;amp;\; \mathsf{Retrotransposon}\{\\
  &amp;amp;\quad \mathsf{class} : \mathsf{LINE}\mid \mathsf{SINE},\\
  &amp;amp;\quad \mathsf{rt} : \mathrm{Maybe}(\mathrm{ReverseTranscriptase}),\\
  &amp;amp;\quad \mathsf{mode} : \mathsf{CopyPaste},\\
  &amp;amp;\quad \mathsf{activity} : S \}\\
  \mid\;&amp;amp;\; \mathsf{SatelliteDNA}\{\\
  &amp;amp;\quad \mathsf{unit} : \mathrm{Sequence},\\
  &amp;amp;\quad \mathsf{copies} : \mathbb{N},\\
  &amp;amp;\quad \mathsf{location} : \mathsf{Centromere} \mid \mathsf{Telomere} \mid \mathsf{Pericentromeric} \}\\
  \mid\;&amp;amp;\; \mathsf{ERV}\{\\
  &amp;amp;\quad \mathsf{ltrs} : \mathrm{LTR} &amp;times; \mathrm{LTR},\\
  &amp;amp;\quad \mathsf{genes} : [\mathrm{Gene}],\\
  &amp;amp;\quad \mathsf{intact} : \mathrm{Bool},\\
  &amp;amp;\quad \mathsf{activity} : S \}
\end{align*}&lt;/span&gt; where the type parameter &lt;span class=&quot;math inline&quot;&gt;S&lt;/span&gt; tracks the activity state, drawn from the lattice: &lt;span class=&quot;math display&quot;&gt;\mathsf{Active} \sqsubset \mathsf{Suppressed} \sqsubset \mathsf{Fossilized} \sqsubset \mathsf{Domesticated}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;remark&quot;&gt;
&lt;p&gt;&lt;strong&gt;Remark 11&lt;/strong&gt;.  &lt;em&gt;The activity lattice reflects the evolutionary trajectory of transposable elements: active elements transpose freely; suppressed elements are silenced by host mechanisms (DNA methylation, piRNA); fossilized elements have accumulated inactivating mutations; domesticated elements have been co-opted for host function.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;def:impact&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 12&lt;/strong&gt; (Host Impact Functor).  &lt;em&gt;The &lt;em&gt;host impact&lt;/em&gt; of a repeat element is captured by the functor &lt;span class=&quot;math inline&quot;&gt;\mathsf{Impact} : \mathsf{Repeat}\to \mathsf{Effect}&lt;/span&gt; where: &lt;span class=&quot;math display&quot;&gt;\mathsf{Effect} ::= \mathsf{Neutral} \mid \mathsf{Deleterious}(\mathbb{R}^+)
  \mid \mathsf{Regulatory} \mid \mathsf{Structural} \mid \mathsf{Exapted}(\mathrm{Function})&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;5&quot; id=&quot;sec:endofunctor&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5&lt;/span&gt; Transposition as Endofunctor&lt;/h1&gt;
&lt;p&gt;We now establish the central categorical result: transposition defines an endofunctor on the genome category.&lt;/p&gt;
&lt;div id=&quot;def:genome-cat&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 13&lt;/strong&gt; (Genome Category).  &lt;em&gt;The &lt;em&gt;genome category&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}_\mathcal{G}&lt;/span&gt; has:&lt;/em&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Objects:&lt;/strong&gt; Genome states &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}_i&lt;/span&gt;, each a finite sequence over &lt;span class=&quot;math inline&quot;&gt;\{A,T,G,C\}&lt;/span&gt; with annotated loci.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Morphisms:&lt;/strong&gt; Genomic transformations &lt;span class=&quot;math inline&quot;&gt;f : \mathcal{G}_i \to \mathcal{G}_j&lt;/span&gt;, including point mutations, insertions, deletions, and rearrangements.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Composition:&lt;/strong&gt; Sequential application of transformations.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Identity:&lt;/strong&gt; The null transformation &lt;span class=&quot;math inline&quot;&gt;\mathrm{id}_\mathcal{G}&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:endofunctor&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 14&lt;/strong&gt; (Transposition Endofunctor).  &lt;em&gt;The transposition operation &lt;span class=&quot;math inline&quot;&gt;T : \mathcal{C}_\mathcal{G}\to \mathcal{C}_\mathcal{G}&lt;/span&gt; is an endofunctor, where:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;On objects: &lt;span class=&quot;math inline&quot;&gt;T(\mathcal{G}_i) = \tau(t, \mathcal{G}_i)&lt;/span&gt; for a fixed active element &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;On morphisms: &lt;span class=&quot;math inline&quot;&gt;T(f : \mathcal{G}_i \to \mathcal{G}_j) = f&amp;#39; : T(\mathcal{G}_i) \to T(\mathcal{G}_j)&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;f&amp;#39;&lt;/span&gt; applies &lt;span class=&quot;math inline&quot;&gt;f&lt;/span&gt; to all positions not occupied by the transposed element, and adjusts coordinates accordingly.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; We verify the functor laws.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Identity preservation:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;T(\mathrm{id}_{\mathcal{G}_i})&lt;/span&gt; must equal &lt;span class=&quot;math inline&quot;&gt;\mathrm{id}_{T(\mathcal{G}_i)}&lt;/span&gt;. The identity transformation changes no positions; after transposition of &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;, the identity on the resulting genome still changes no positions. Hence &lt;span class=&quot;math inline&quot;&gt;T(\mathrm{id}) = \mathrm{id}_{T(\mathcal{G})}&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Composition preservation:&lt;/strong&gt; We must show &lt;span class=&quot;math inline&quot;&gt;T(g \circ f) = T(g) \circ T(f)&lt;/span&gt;. Let &lt;span class=&quot;math inline&quot;&gt;f : \mathcal{G}_i \to \mathcal{G}_j&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;g : \mathcal{G}_j \to \mathcal{G}_k&lt;/span&gt;. The transposition of &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; commutes with mutations at non-overlapping positions. For the case where &lt;span class=&quot;math inline&quot;&gt;f&lt;/span&gt; or &lt;span class=&quot;math inline&quot;&gt;g&lt;/span&gt; affects the transposon locus, the coordinate adjustment in the definition of &lt;span class=&quot;math inline&quot;&gt;T&lt;/span&gt; on morphisms ensures that &lt;span class=&quot;math display&quot;&gt;T(g \circ f)(\mathcal{G}_i) = T(g)(T(f)(\mathcal{G}_i))&lt;/span&gt; by the associativity of sequence operations and the determinism of coordinate remapping. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;cor:iteration&quot; class=&quot;corollary&quot;&gt;
&lt;p&gt;&lt;strong&gt;Corollary 15&lt;/strong&gt; (Repeated Transposition as Iteration).  &lt;em&gt;For an active transposon &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;, the &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt;-fold transposition &lt;span class=&quot;math inline&quot;&gt;T^n = \underbrace{T \circ &amp;middot;s \circ T}_{n}&lt;/span&gt; is also an endofunctor, and the collection &lt;span class=&quot;math inline&quot;&gt;\{T^n \mid n \in \mathbb{N}\}&lt;/span&gt; forms a monoid in the endofunctor category &lt;span class=&quot;math inline&quot;&gt;\mathrm{End}(\mathcal{C}_\mathcal{G})&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The following diagram commutes for any genomic mutation &lt;span class=&quot;math inline&quot;&gt;f&lt;/span&gt;: &lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}
  \mathcal{G}_i \arrow[r, &amp;quot;f&amp;quot;] \arrow[d, &amp;quot;T&amp;quot;&amp;#39;] &amp;amp; \mathcal{G}_j \arrow[d, &amp;quot;T&amp;quot;] \\
  T(\mathcal{G}_i) \arrow[r, &amp;quot;T(f)&amp;quot;&amp;#39;] &amp;amp; T(\mathcal{G}_j)
\end{tikzcd}&lt;/span&gt;&lt;/p&gt;
&lt;div id=&quot;prop:nat-trans&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 16&lt;/strong&gt; (Natural Transformation of Transposons).  &lt;em&gt;Given two active transposons &lt;span class=&quot;math inline&quot;&gt;t_1, t_2 \in \mathsf{TE}&lt;/span&gt;, the interaction between their respective endofunctors &lt;span class=&quot;math inline&quot;&gt;T_1, T_2&lt;/span&gt; is a natural transformation &lt;span class=&quot;math inline&quot;&gt;\eta : T_1 &amp;rArr; T_2&lt;/span&gt; if and only if &lt;span class=&quot;math inline&quot;&gt;t_1&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;t_2&lt;/span&gt; share the same target site preference distribution.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;6&quot; id=&quot;sec:lines&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6&lt;/span&gt; LINEs as Autonomous Macros&lt;/h1&gt;
&lt;p&gt;We formalize LINEs as &lt;em&gt;autonomous macros&lt;/em&gt;—self-contained expansion units that carry their own expansion machinery.&lt;/p&gt;
&lt;div id=&quot;def:auto-macro&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 17&lt;/strong&gt; (Autonomous Macro).  &lt;em&gt;An &lt;em&gt;autonomous macro&lt;/em&gt; is a pair &lt;span class=&quot;math inline&quot;&gt;(t, \mathsf{expand}_t)&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; is a transposable element and &lt;span class=&quot;math inline&quot;&gt;\mathsf{expand}_t : t \to \mathcal{G}\to \mathcal{G}&lt;/span&gt; is the expansion function encoded within &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; itself. For LINEs: &lt;span class=&quot;math display&quot;&gt;\mathsf{expand}_\mathsf{LINE}= \lambda \ell.\; \lambda g.\;
    \mathsf{insert}(\mathsf{TPRT}(\mathsf{transcribe}(\ell)), g)&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The L1 element is the paradigmatic autonomous macro:&lt;/p&gt;
&lt;div id=&quot;prop:l1&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 18&lt;/strong&gt; (L1 Self-Sufficiency).  &lt;em&gt;The L1 LINE element is &lt;em&gt;self-sufficient&lt;/em&gt; in the sense that: &lt;span class=&quot;math display&quot;&gt;\forall g \in \mathcal{G}.\; \mathsf{expand}_{\mathrm{L1}}(\mathrm{L1}, g) \neq \bot&lt;/span&gt; provided the cellular transcription and translation machinery is available. That is, L1 requires only the host’s basic gene expression infrastructure, not any TE-specific factors.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;6.1&quot; id=&quot;l1-as-a-monad&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.1&lt;/span&gt; L1 as a Monad&lt;/h2&gt;
&lt;p&gt;The L1 retrotransposition cycle has monadic structure:&lt;/p&gt;
&lt;div id=&quot;thm:l1-monad&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 19&lt;/strong&gt; (L1 Monad).  &lt;em&gt;Define the type constructor &lt;span class=&quot;math inline&quot;&gt;L : \mathcal{G}\to \mathcal{G}&lt;/span&gt; by &lt;span class=&quot;math inline&quot;&gt;L(g) = g&lt;/span&gt; augmented with a fresh L1 insertion. Then &lt;span class=&quot;math inline&quot;&gt;(L, \eta, \mu)&lt;/span&gt; is a monad where:&lt;/em&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\eta_g : g \to L(g)&lt;/span&gt; is the insertion of a single L1 copy (unit),&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mu_g : L(L(g)) \to L(g)&lt;/span&gt; flattens nested transposition events (join).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; We verify the monad laws.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Left unit:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;\mu \circ L(\eta) = \mathrm{id}_L&lt;/span&gt;. Applying &lt;span class=&quot;math inline&quot;&gt;\eta&lt;/span&gt; inside &lt;span class=&quot;math inline&quot;&gt;L&lt;/span&gt; creates a nested insertion; &lt;span class=&quot;math inline&quot;&gt;\mu&lt;/span&gt; flattens it to a single insertion, recovering the original &lt;span class=&quot;math inline&quot;&gt;L(g)&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Right unit:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;\mu \circ \eta_L = \mathrm{id}_L&lt;/span&gt;. Wrapping &lt;span class=&quot;math inline&quot;&gt;L(g)&lt;/span&gt; in a new &lt;span class=&quot;math inline&quot;&gt;L&lt;/span&gt; layer and flattening returns &lt;span class=&quot;math inline&quot;&gt;L(g)&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Associativity:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;\mu \circ L(\mu) = \mu \circ \mu_L&lt;/span&gt;. Both sides flatten three levels of nesting to one. Since insertion positions are determined by the TPRT mechanism (which is position-independent at the categorical level), the order of flattening does not matter. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;6.2&quot; id=&quot;truncation-as-lossy-compression&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.2&lt;/span&gt; 5’ Truncation as Lossy Compression&lt;/h2&gt;
&lt;p&gt;Most L1 copies in the genome are 5’-truncated: the TPRT mechanism begins at the 3’ end, and premature termination leaves incomplete copies. Of the approximately 500&lt;span&gt;,&lt;/span&gt;000 L1 copies in the human genome, fewer than 100 are full-length and retrotransposition-competent.&lt;/p&gt;
&lt;div id=&quot;def:truncation&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 20&lt;/strong&gt; (5’ Truncation).  &lt;em&gt;The &lt;em&gt;truncation function&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;\mathsf{trunc}_k : \mathsf{LINE}\to \mathsf{LINE}&lt;/span&gt; removes the first &lt;span class=&quot;math inline&quot;&gt;k&lt;/span&gt; bases: &lt;span class=&quot;math display&quot;&gt;\mathsf{trunc}_k(\mathsf{5&amp;#39;UTR} &amp;middot; \mathsf{ORF1} &amp;middot; \mathsf{ORF2} &amp;middot; \mathsf{3&amp;#39;UTR} &amp;middot; \mathsf{polyA})
  = \mathsf{suffix}_k&lt;/span&gt; A truncated LINE with &lt;span class=&quot;math inline&quot;&gt;k &amp;gt; |\mathsf{5&amp;#39;UTR}| + |\mathsf{ORF1}|&lt;/span&gt; loses ORF1, rendering it non-autonomous.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;7&quot; id=&quot;sec:sines&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7&lt;/span&gt; SINEs as Dependent Macros&lt;/h1&gt;
&lt;p&gt;SINEs represent a fundamentally different computational pattern: they are &lt;em&gt;dependent macros&lt;/em&gt; that require external machinery for expansion.&lt;/p&gt;
&lt;div id=&quot;def:dep-macro&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 21&lt;/strong&gt; (Dependent Macro).  &lt;em&gt;A &lt;em&gt;dependent macro&lt;/em&gt; is a pair &lt;span class=&quot;math inline&quot;&gt;(s, \pi)&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; is a transposable element and &lt;span class=&quot;math inline&quot;&gt;\pi : \mathsf{LINE}\to \mathsf{ExpansionMachinery}&lt;/span&gt; is a projection that extracts the required machinery from an autonomous element. The expansion of &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; is: &lt;span class=&quot;math display&quot;&gt;\mathsf{expand}_\mathsf{SINE}: \mathsf{SINE}\to \Pi(\ell : \mathsf{LINE}).\; \mathsf{active}(\ell) \to \mathcal{G}\to \mathcal{G}&lt;/span&gt; This is a &lt;em&gt;dependent function type&lt;/em&gt;: the SINE’s expansion depends on the existence and activity of a LINE element.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:sine-dep&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 22&lt;/strong&gt; (SINE–LINE Dependency as Dependent Type).  &lt;em&gt;The relationship between SINEs and LINEs is captured by the dependent type: &lt;span class=&quot;math display&quot;&gt;\mathsf{SINETransposition} : \Sigma(\ell : \mathsf{LINE}).\; \mathsf{active}(\ell) &amp;times; (\mathsf{SINE}\to \mathcal{G}\to \mathcal{G})&lt;/span&gt; That is, a SINE transposition event is a &lt;em&gt;witness&lt;/em&gt; to the existence of an active LINE together with the transposition function.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; By &lt;a href=&quot;#def:sine-dep&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;def:sine-dep&quot;&gt;9&lt;/a&gt;, every SINE transposition requires active LINE machinery. The &lt;span class=&quot;math inline&quot;&gt;\Sigma&lt;/span&gt;-type packages this existential witness: to construct a &lt;span class=&quot;math inline&quot;&gt;\mathsf{SINETransposition}&lt;/span&gt;, one must provide a specific LINE &lt;span class=&quot;math inline&quot;&gt;\ell&lt;/span&gt;, a proof of &lt;span class=&quot;math inline&quot;&gt;\mathsf{active}(\ell)&lt;/span&gt;, and the resulting transposition function. This is precisely the elimination rule for dependent pairs. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;7.1&quot; id=&quot;alu-elements-the-most-successful-dependent-macro&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.1&lt;/span&gt; Alu Elements: The Most Successful Dependent Macro&lt;/h2&gt;
&lt;p&gt;Alu elements are dimeric SINEs derived from the 7SL RNA gene. With over 1.1 million copies, they are the most successful mobile element in the human genome by copy number.&lt;/p&gt;
&lt;div id=&quot;ex:alu&quot; class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 23&lt;/strong&gt; (Alu Dependency Chain).  &lt;em&gt;The Alu retrotransposition dependency chain is: &lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}[column sep=large]
  \mathsf{Alu}_{\mathrm{RNA}} \arrow[r, &amp;quot;\text{hijacks}&amp;quot;] &amp;amp;
  \mathsf{L1\;ORF2p} \arrow[r, &amp;quot;\text{TPRT}&amp;quot;] &amp;amp;
  \mathsf{Alu}_{\mathrm{cDNA}} \arrow[r, &amp;quot;\text{insert}&amp;quot;] &amp;amp;
  \mathcal{G}&amp;#39;
\end{tikzcd}&lt;/span&gt; Alu cannot perform any of these steps autonomously; it is a pure &lt;em&gt;client&lt;/em&gt; of L1 services.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;prop:alu-bound&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 24&lt;/strong&gt; (Alu Expansion Rate Bounded by L1 Activity).  &lt;em&gt;The rate of Alu transposition &lt;span class=&quot;math inline&quot;&gt;r_{\mathrm{Alu}}&lt;/span&gt; is bounded above by the L1 activity: &lt;span class=&quot;math display&quot;&gt;r_{\mathrm{Alu}} &amp;le; k &amp;middot; \sum_{\ell \in \mathsf{LINE}_{\mathrm{active}}} \mathsf{activity}(\ell)&lt;/span&gt; for some constant &lt;span class=&quot;math inline&quot;&gt;k &amp;gt; 0&lt;/span&gt; depending on Alu copy number and transcriptional efficiency.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;8&quot; id=&quot;sec:satellite&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;8&lt;/span&gt; Satellite DNA as Memory Alignment&lt;/h1&gt;
&lt;p&gt;Satellite DNA consists of tandemly repeated short sequences (2–200 bp units) found primarily at centromeres and telomeres. In the DNA-Lang framework, these serve as &lt;em&gt;memory alignment and padding primitives&lt;/em&gt;.&lt;/p&gt;
&lt;div id=&quot;def:tandem&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 25&lt;/strong&gt; (Tandem Repeat).  &lt;em&gt;A &lt;em&gt;tandem repeat&lt;/em&gt; is a sequence &lt;span class=&quot;math inline&quot;&gt;r^n = \underbrace{r &amp;middot; r &amp;middot;s r}_{n}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;r&lt;/span&gt; is the repeat unit and &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt; is the copy number. The total length is &lt;span class=&quot;math inline&quot;&gt;n &amp;middot; |r|&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;def:sat-classes&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 26&lt;/strong&gt; (Satellite Classes).  &lt;em&gt;Satellite DNA is classified by repeat unit length:&lt;/em&gt;&lt;/p&gt;
&lt;div class=&quot;center&quot;&gt;
&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;em&gt;&lt;strong&gt;Class&lt;/strong&gt;&lt;/em&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;em&gt;&lt;strong&gt;Unit Length&lt;/strong&gt;&lt;/em&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;em&gt;&lt;strong&gt;Location&lt;/strong&gt;&lt;/em&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;em&gt;&lt;strong&gt;CS Analogue&lt;/strong&gt;&lt;/em&gt;&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Satellite&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;100–200 bp&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Pericentromeric&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Page alignment&lt;/em&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Minisatellite&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;10–100 bp&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Subtelomeric&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Cache-line alignment&lt;/em&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Microsatellite&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;2–9 bp&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Dispersed&lt;/em&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;em&gt;Word alignment&lt;/em&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;8.1&quot; id=&quot;centromeric-satellites-as-struct-padding&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;8.1&lt;/span&gt; Centromeric Satellites as Struct Padding&lt;/h2&gt;
&lt;p&gt;The centromere, essential for chromosome segregation during cell division, is built upon vast arrays of alpha-satellite DNA (171 bp repeat units). This is analogous to &lt;em&gt;struct padding&lt;/em&gt; in C: the functional requirement (kinetochore assembly) demands a specific memory alignment that is achieved by repeating a unit until the required size is met.&lt;/p&gt;
&lt;div id=&quot;thm:centromere&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 27&lt;/strong&gt; (Centromeric Alignment).  &lt;em&gt;The centromeric satellite array of length &lt;span class=&quot;math inline&quot;&gt;L = n &amp;middot; 171&lt;/span&gt; bp ensures that:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The kinetochore binding region is aligned to a higher-order repeat (HOR) boundary of &lt;span class=&quot;math inline&quot;&gt;m &amp;middot; 171&lt;/span&gt; bp, where &lt;span class=&quot;math inline&quot;&gt;m&lt;/span&gt; is the HOR period.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The array length &lt;span class=&quot;math inline&quot;&gt;L&lt;/span&gt; exceeds a minimum threshold &lt;span class=&quot;math inline&quot;&gt;L_{\min}&lt;/span&gt; required for stable kinetochore assembly.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The CENP-B box motif occurs at regular intervals within the array, providing “alignment markers.”&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;8.2&quot; id=&quot;telomeric-repeats-as-sentinel-values&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;8.2&lt;/span&gt; Telomeric Repeats as Sentinel Values&lt;/h2&gt;
&lt;p&gt;Telomeres consist of TTAGGG repeats (in vertebrates) and serve as &lt;em&gt;sentinel values&lt;/em&gt; marking the ends of chromosomes. They prevent end-to-end fusion and degradation, analogous to null terminators in C strings or sentinel nodes in linked lists.&lt;/p&gt;
&lt;div id=&quot;prop:telomere&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 28&lt;/strong&gt; (Telomere as Sentinel).  &lt;em&gt;The telomeric repeat array &lt;span class=&quot;math inline&quot;&gt;(\mathrm{TTAGGG})^n&lt;/span&gt; functions as a sentinel by:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Preventing exonuclease degradation of coding sequence (buffer overflow protection),&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Signaling the physical end of the chromosome to the replication machinery,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Providing a substrate for telomerase-mediated length maintenance (garbage collection).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;9&quot; id=&quot;sec:ervs&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9&lt;/span&gt; Endogenous Retroviruses as Legacy Imports&lt;/h1&gt;
&lt;p&gt;Endogenous retroviruses (ERVs) are remnants of ancient retroviral infections that became fixed in the germline. They constitute approximately 8% of the human genome. In the DNA-Lang framework, these are &lt;em&gt;legacy library imports&lt;/em&gt;: foreign code packages that were integrated into the codebase long ago and remain structurally embedded even though most are no longer functional.&lt;/p&gt;
&lt;div id=&quot;def:erv&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 29&lt;/strong&gt; (Endogenous Retrovirus).  &lt;em&gt;An ERV &lt;span class=&quot;math inline&quot;&gt;e&lt;/span&gt; has the structure: &lt;span class=&quot;math display&quot;&gt;e = \mathrm{LTR}_5 &amp;middot; \mathsf{gag} &amp;middot; \mathsf{pol} &amp;middot; \mathsf{env} &amp;middot; \mathrm{LTR}_3&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathsf{gag}&lt;/span&gt; encodes capsid proteins, &lt;span class=&quot;math inline&quot;&gt;\mathsf{pol}&lt;/span&gt; encodes reverse transcriptase and integrase, and &lt;span class=&quot;math inline&quot;&gt;\mathsf{env}&lt;/span&gt; encodes envelope proteins. The flanking long terminal repeats (LTRs) contain promoter and enhancer sequences.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;prop:erv-decay&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 30&lt;/strong&gt; (ERV Decay).  &lt;em&gt;Over evolutionary time, ERVs undergo systematic degradation:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Accumulation of inactivating mutations in &lt;span class=&quot;math inline&quot;&gt;\mathsf{gag}&lt;/span&gt;, &lt;span class=&quot;math inline&quot;&gt;\mathsf{pol}&lt;/span&gt;, &lt;span class=&quot;math inline&quot;&gt;\mathsf{env}&lt;/span&gt;,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Deletion of internal sequence by recombination between flanking LTRs, leaving solo LTRs,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Epigenetic silencing via DNA methylation and heterochromatin.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;em&gt;The human genome contains approximately 203&lt;span&gt;,&lt;/span&gt;000 solo LTRs versus 9&lt;span&gt;,&lt;/span&gt;000 intact ERV loci—a ratio reflecting extensive recombinational deletion.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;9.1&quot; id=&quot;solo-ltrs-as-orphaned-headers&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9.1&lt;/span&gt; Solo LTRs as Orphaned Headers&lt;/h2&gt;
&lt;p&gt;When the internal genes of an ERV are deleted by homologous recombination between the two LTRs, a single “solo LTR” remains. This is the genomic equivalent of an &lt;em&gt;orphaned header file&lt;/em&gt;: the interface declaration persists (the LTR with its promoter/enhancer signals) even though the implementation (the viral genes) has been deleted.&lt;/p&gt;
&lt;div id=&quot;thm:solo-ltr&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 31&lt;/strong&gt; (Solo LTR Regulatory Potential).  &lt;em&gt;A solo LTR retains transcription factor binding sites from the original viral LTR and can function as:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;An alternative promoter for nearby host genes,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;An enhancer element acting at a distance,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;A source of novel regulatory sequence upon mutation.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;em&gt;The regulatory potential is a function &lt;span class=&quot;math inline&quot;&gt;\mathsf{RegPot} : \mathrm{LTR} \to \mathcal{P}(\mathrm{TF})&lt;/span&gt; mapping each solo LTR to the set of transcription factors it can bind.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;10&quot; id=&quot;sec:domestication&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10&lt;/span&gt; Transposon Domestication as Naturalization&lt;/h1&gt;
&lt;p&gt;The most remarkable fate of a transposable element is &lt;em&gt;domestication&lt;/em&gt;: the evolutionary process by which a parasitic element is co-opted for host function. In the DNA-Lang framework, this is &lt;em&gt;type naturalization&lt;/em&gt;—the conversion of foreign code into a native component.&lt;/p&gt;
&lt;div id=&quot;def:naturalization&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 32&lt;/strong&gt; (Type Naturalization).  &lt;em&gt;A &lt;em&gt;naturalization&lt;/em&gt; of a repeat element &lt;span class=&quot;math inline&quot;&gt;r \in \mathsf{Repeat}\langle\mathsf{Active}\rangle&lt;/span&gt; is a type-changing transformation: &lt;span class=&quot;math display&quot;&gt;\mathsf{naturalize} : \mathsf{Repeat}\langle\mathsf{Active}\rangle \to \mathsf{HostGene}&lt;/span&gt; satisfying:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Loss of mobility:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;\mathsf{canTranspose}(\mathsf{naturalize}(r)) = \mathsf{False}&lt;/span&gt;,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Gain of host function:&lt;/strong&gt; &lt;span class=&quot;math inline&quot;&gt;\exists f.\; \mathsf{hostFunction}(\mathsf{naturalize}(r)) = \mathsf{Just}(f)&lt;/span&gt;,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Selective constraint:&lt;/strong&gt; The naturalized element is under purifying selection (&lt;span class=&quot;math inline&quot;&gt;dN/dS &amp;lt; 1&lt;/span&gt;).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;10.1&quot; id=&quot;vdj-recombination-the-rag-transposase&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.1&lt;/span&gt; V(D)J Recombination: The RAG Transposase&lt;/h2&gt;
&lt;p&gt;The most celebrated case of transposon domestication is the RAG1/RAG2 recombinase system that drives V(D)J recombination in the adaptive immune system of jawed vertebrates &lt;span class=&quot;citation&quot; data-cites=&quot;agrawal1998 hiom1998&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;div id=&quot;thm:rag&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 33&lt;/strong&gt; (RAG as Domesticated Transposase).  &lt;em&gt;The RAG1 protein is a domesticated transposase satisfying:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;RAG1 contains a DDE catalytic triad characteristic of transposases,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;RAG1/RAG2 catalyze a cut-and-paste reaction on recombination signal sequences (RSSs) that are structurally analogous to TIRs,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The reaction mechanism (synapsis, cleavage, hairpin formation) recapitulates DNA transposition,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;RAG1/RAG2 can catalyze &lt;em&gt;in vitro&lt;/em&gt; transposition, demonstrating retained ancestral activity.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;em&gt;Therefore: &lt;span class=&quot;math display&quot;&gt;\mathsf{RAG} = \mathsf{naturalize}(\mathsf{Transib}_{\mathrm{transposase}})&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathsf{Transib}&lt;/span&gt; is the ancestral DNA transposon superfamily.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;10.2&quot; id=&quot;syncytins-domesticated-retroviral-envelope-proteins&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.2&lt;/span&gt; Syncytins: Domesticated Retroviral Envelope Proteins&lt;/h2&gt;
&lt;p&gt;The syncytin proteins, essential for placental development in mammals, are domesticated ERV envelope (&lt;span class=&quot;math inline&quot;&gt;\mathsf{env}&lt;/span&gt;) genes &lt;span class=&quot;citation&quot; data-cites=&quot;mi2000&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;div id=&quot;ex:syncytin&quot; class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 34&lt;/strong&gt; (Syncytin Naturalization).  &lt;em&gt;&lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}
  \mathsf{ERV}_{\mathsf{env}} \arrow[r, &amp;quot;\text{mutation}&amp;quot;] \arrow[d, &amp;quot;\text{purifying selection}&amp;quot;&amp;#39;] &amp;amp;
  \mathsf{env}_{\mathrm{defective}} \arrow[d, &amp;quot;\text{exaptation}&amp;quot;] \\
  \text{maintained in genome} &amp;amp;
  \mathsf{Syncytin} : \mathsf{CellFusion} \arrow[l, &amp;quot;\text{essential host gene}&amp;quot;&amp;#39;]
\end{tikzcd}&lt;/span&gt; The fusogenic activity originally used for viral entry has been repurposed for trophoblast fusion in placenta formation.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;prop:convergent&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 35&lt;/strong&gt; (Convergent Domestication).  &lt;em&gt;Syncytin domestication has occurred independently at least 10 times across mammalian lineages, demonstrating that: &lt;span class=&quot;math display&quot;&gt;\mathsf{naturalize} : \mathsf{ERV}_{\mathsf{env}} \to \mathsf{Syncytin}&lt;/span&gt; is a &lt;em&gt;convergent morphism&lt;/em&gt;—the same categorical arrow is discovered independently by different evolutionary lineages.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;11&quot; id=&quot;sec:goedel&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11&lt;/span&gt; The Self-Modification Paradox&lt;/h1&gt;
&lt;p&gt;We now establish a fundamental limitation on transposable elements, analogous to Gödel’s incompleteness theorems.&lt;/p&gt;
&lt;div id=&quot;thm:goedel&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 36&lt;/strong&gt; (Transposon Self-Prediction Impossibility).  &lt;em&gt;No transposable element can contain a subroutine that predicts its own next insertion site. Formally, there is no computable function &lt;span class=&quot;math display&quot;&gt;\mathsf{predict} : \mathsf{TE}&amp;times; \mathcal{G}\to \mathbb{N}&lt;/span&gt; encoded within &lt;span class=&quot;math inline&quot;&gt;\mathsf{TE}&lt;/span&gt; such that &lt;span class=&quot;math inline&quot;&gt;\mathsf{predict}(t, g) = i&lt;/span&gt; implies &lt;span class=&quot;math inline&quot;&gt;\tau(t, g)&lt;/span&gt; inserts &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; at position &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;g&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; By diagonalization. Suppose such a &lt;span class=&quot;math inline&quot;&gt;\mathsf{predict}&lt;/span&gt; exists and is encoded within the transposon &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt;. Define a modified transposon &lt;span class=&quot;math inline&quot;&gt;t^*&lt;/span&gt; that:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Computes &lt;span class=&quot;math inline&quot;&gt;i = \mathsf{predict}(t^*, g)&lt;/span&gt;,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Inserts itself at position &lt;span class=&quot;math inline&quot;&gt;i + 1&lt;/span&gt; instead.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Then &lt;span class=&quot;math inline&quot;&gt;\mathsf{predict}(t^*, g) = i&lt;/span&gt; but &lt;span class=&quot;math inline&quot;&gt;t^*&lt;/span&gt; inserts at &lt;span class=&quot;math inline&quot;&gt;i + 1&lt;/span&gt;, contradicting the correctness of &lt;span class=&quot;math inline&quot;&gt;\mathsf{predict}&lt;/span&gt;. If we modify &lt;span class=&quot;math inline&quot;&gt;\mathsf{predict}&lt;/span&gt; to account for &lt;span class=&quot;math inline&quot;&gt;t^*&lt;/span&gt;, we can construct &lt;span class=&quot;math inline&quot;&gt;t^{**}&lt;/span&gt;, and so on. This is a direct analogue of the Gödelian diagonal argument: the transposon cannot simultaneously be the predictor and the predicted.&lt;/p&gt;
&lt;p&gt;More precisely, the insertion site of a transposon depends on the entire genome state, which includes the transposon itself. If the transposon modifies its behavior based on its own prediction, the genome state changes, invalidating the prediction. This is a fixed-point obstruction: the function &lt;span class=&quot;math display&quot;&gt;F(i) = \text{``insertion site given that the transposon believes the site is } i\text{&amp;#39;&amp;#39;}&lt;/span&gt; has no fixed point in general, by an argument analogous to Lawvere’s fixed-point theorem applied contravariantly. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;cor:unpredictable&quot; class=&quot;corollary&quot;&gt;
&lt;p&gt;&lt;strong&gt;Corollary 37&lt;/strong&gt; (Fundamental Unpredictability of Genome Evolution).  &lt;em&gt;The long-term trajectory of a self-modifying genome is fundamentally unpredictable from within, even given complete knowledge of the current genome state and all active transposable elements.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;remark&quot;&gt;
&lt;p&gt;&lt;strong&gt;Remark 38&lt;/strong&gt;.  &lt;em&gt;This result does not preclude &lt;em&gt;statistical&lt;/em&gt; models of transposon insertion preferences (e.g., L1 preference for AT-rich regions). It states that no &lt;em&gt;deterministic, self-referential&lt;/em&gt; prediction is possible—a distinction parallel to the difference between thermodynamic ensembles (statistical, predictable) and individual molecular trajectories (chaotic, unpredictable).&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;11.1&quot; id=&quot;connection-to-halting-problem&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.1&lt;/span&gt; Connection to Halting Problem&lt;/h2&gt;
&lt;div id=&quot;prop:halting&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 39&lt;/strong&gt; (Transposon Halting).  &lt;em&gt;The question “Will transposon &lt;span class=&quot;math inline&quot;&gt;t&lt;/span&gt; eventually become fixed (cease transposing) in genome &lt;span class=&quot;math inline&quot;&gt;g&lt;/span&gt;?” is undecidable in general.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; We reduce the halting problem to transposon fixation. Given a Turing machine &lt;span class=&quot;math inline&quot;&gt;M&lt;/span&gt; with input &lt;span class=&quot;math inline&quot;&gt;x&lt;/span&gt;, encode &lt;span class=&quot;math inline&quot;&gt;M&lt;/span&gt;’s transition function as a transposase-like enzyme acting on a genome that encodes &lt;span class=&quot;math inline&quot;&gt;x&lt;/span&gt;. The transposon reaches a fixed position (ceases transposing) if and only if &lt;span class=&quot;math inline&quot;&gt;M&lt;/span&gt; halts on &lt;span class=&quot;math inline&quot;&gt;x&lt;/span&gt;. Since halting is undecidable, transposon fixation is undecidable. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;12&quot; id=&quot;sec:implementation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12&lt;/span&gt; Haskell Implementation&lt;/h1&gt;
&lt;p&gt;We provide a complete Haskell implementation of the framework described above. The implementation is organized into four modules:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;Repeat.hs&lt;/code&gt;: Core type definitions for the &lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}\langle S \rangle&lt;/span&gt; type.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;Transposon.hs&lt;/code&gt;: Cut-and-paste mechanics, insertion site selection, TIR recognition.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;SatelliteDNA.hs&lt;/code&gt;: Tandem repeat modeling, centromeric and telomeric satellites.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;DynamicGenome.hs&lt;/code&gt;: Genome-level transposition simulation, composition tracking.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;Main.hs&lt;/code&gt;: Demonstrations and examples.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;12.1&quot; id=&quot;core-types&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.1&lt;/span&gt; Core Types&lt;/h2&gt;
&lt;p&gt;The core &lt;span class=&quot;math inline&quot;&gt;\mathsf{Repeat}&lt;/span&gt; type is implemented as a Haskell algebraic data type parameterized by an activity state:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;data ActivityState = Active | Suppressed | Fossilized | Domesticated

data Repeat s where
  DNATransposon   :: { tirLeft      :: Sequence
                     , tirRight     :: Sequence
                     , transposase  :: Gene
                     , dtActivity   :: s } -&amp;gt; Repeat s
  Retrotransposon :: { rtClass      :: RTClass
                     , reverseTranscriptase :: Maybe Gene
                     , rtActivity   :: s } -&amp;gt; Repeat s
  SatelliteDNA    :: { repeatUnit   :: Sequence
                     , copyNumber   :: Int
                     , satLocation  :: SatelliteLocation } -&amp;gt; Repeat s
  ERV             :: { ltrLeft      :: Sequence
                     , ltrRight     :: Sequence
                     , viralGenes   :: [Gene]
                     , ervIntact    :: Bool
                     , ervActivity  :: s } -&amp;gt; Repeat s&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;12.2&quot; id=&quot;cut-and-paste-transposition&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.2&lt;/span&gt; Cut-and-Paste Transposition&lt;/h2&gt;
&lt;p&gt;The cut-and-paste operation is implemented as a pure function:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;cutAndPaste :: Int -&amp;gt; Int -&amp;gt; Genome -&amp;gt; Maybe Genome
cutAndPaste from to genome
  | from &amp;lt; 0 || from &amp;gt;= length genome = Nothing
  | to   &amp;lt; 0 || to   &amp;gt;= length genome = Nothing
  | otherwise = Just (excise from &amp;gt;&amp;gt; insert to)&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;12.3&quot; id=&quot;retrotransposition&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.3&lt;/span&gt; Retrotransposition&lt;/h2&gt;
&lt;p&gt;Copy-and-paste retrotransposition creates a new copy:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;copyAndPaste :: Int -&amp;gt; Int -&amp;gt; Int -&amp;gt; Genome -&amp;gt; Maybe Genome
copyAndPaste start len target genome =
  let element = take len (drop start genome)
  in Just (insertAt target element genome)&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;12.4&quot; id=&quot;domestication&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.4&lt;/span&gt; Domestication&lt;/h2&gt;
&lt;p&gt;Transposon domestication is modeled as a type-level state change:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;domesticate :: Repeat Active -&amp;gt; String -&amp;gt; Repeat Domesticated
domesticate (DNATransposon tl tr tp _) func =
  DNATransposon tl tr tp (Domesticated func)&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;12.5&quot; id=&quot;running-the-implementation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.5&lt;/span&gt; Running the Implementation&lt;/h2&gt;
&lt;p&gt;The implementation compiles with standard GHC:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;$ cd src/repetitive-elements
$ ghc -o main Main.hs
$ ./main&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Output demonstrates cut-and-paste transposition, copy-and-paste retrotransposition, satellite DNA modeling, ERV structure, and domestication events, with genome composition statistics at each step.&lt;/p&gt;
&lt;h1 data-number=&quot;13&quot; id=&quot;sec:discussion&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13&lt;/span&gt; Discussion and Conclusion&lt;/h1&gt;
&lt;h2 data-number=&quot;13.1&quot; id=&quot;summary-of-results&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.1&lt;/span&gt; Summary of Results&lt;/h2&gt;
&lt;p&gt;We have established a comprehensive type-theoretic framework for understanding repetitive elements as self-modifying code:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;DNA transposons&lt;/strong&gt; implement &lt;em&gt;move semantics&lt;/em&gt; via cut-and-paste, preserving a linear type invariant (&lt;a href=&quot;#thm:linear&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:linear&quot;&gt;3&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Retrotransposons&lt;/strong&gt; implement &lt;em&gt;copy semantics&lt;/em&gt;, driving monotonic genome growth (&lt;a href=&quot;#thm:growth&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:growth&quot;&gt;7&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;LINEs&lt;/strong&gt; are &lt;em&gt;autonomous macros&lt;/em&gt; with monadic structure (&lt;a href=&quot;#thm:l1-monad&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:l1-monad&quot;&gt;19&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;SINEs&lt;/strong&gt; are &lt;em&gt;dependent macros&lt;/em&gt; formalized via dependent types (&lt;a href=&quot;#thm:sine-dep&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:sine-dep&quot;&gt;22&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Satellite DNA&lt;/strong&gt; provides &lt;em&gt;memory alignment&lt;/em&gt; at centromeres and telomeres (&lt;a href=&quot;#thm:centromere&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:centromere&quot;&gt;27&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;ERVs&lt;/strong&gt; are &lt;em&gt;legacy imports&lt;/em&gt; that decay into solo LTRs with retained regulatory potential (&lt;a href=&quot;#thm:solo-ltr&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:solo-ltr&quot;&gt;31&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Domestication&lt;/strong&gt; is &lt;em&gt;type naturalization&lt;/em&gt;, exemplified by RAG (&lt;a href=&quot;#thm:rag&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:rag&quot;&gt;33&lt;/a&gt;) and syncytins (&lt;a href=&quot;#ex:syncytin&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;ex:syncytin&quot;&gt;34&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A &lt;strong&gt;Gödelian limitation&lt;/strong&gt; prevents transposon self-prediction (&lt;a href=&quot;#thm:goedel&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:goedel&quot;&gt;36&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Transposition&lt;/strong&gt; defines an &lt;em&gt;endofunctor&lt;/em&gt; on the genome category (&lt;a href=&quot;#thm:endofunctor&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:endofunctor&quot;&gt;14&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;13.2&quot; id=&quot;implications-for-genome-engineering&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.2&lt;/span&gt; Implications for Genome Engineering&lt;/h2&gt;
&lt;p&gt;Understanding repetitive elements as self-modifying code has practical implications. Transposon-based tools (Sleeping Beauty, piggyBac) are already used for insertional mutagenesis and gene therapy. Our framework provides a formal basis for reasoning about:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Insertion safety:&lt;/strong&gt; The endofunctor structure (&lt;a href=&quot;#thm:endofunctor&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:endofunctor&quot;&gt;14&lt;/a&gt;) gives a categorical framework for analyzing how insertions compose with existing genomic features.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Off-target effects:&lt;/strong&gt; The self-prediction impossibility (&lt;a href=&quot;#thm:goedel&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;thm:goedel&quot;&gt;36&lt;/a&gt;) formalizes the inherent unpredictability of insertion sites.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Domestication engineering:&lt;/strong&gt; The naturalization framework (&lt;a href=&quot;#def:naturalization&quot; data-reference-type=&quot;ref+label&quot; data-reference=&quot;def:naturalization&quot;&gt;32&lt;/a&gt;) suggests a principled approach to converting transposon-based tools into stable genomic components.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;13.3&quot; id=&quot;connections-to-the-modular-framework&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.3&lt;/span&gt; Connections to the Modular Framework&lt;/h2&gt;
&lt;p&gt;Within the DNA-Lang modular framework, repetitive elements interact with every other layer:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 1 (Regulatory Sequences):&lt;/strong&gt; Transposon insertions create novel regulatory elements; solo LTRs act as enhancers and promoters.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 2 (Coding Sequences):&lt;/strong&gt; Exon shuffling mediated by transposons creates new protein-coding genes.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 3 (Non-Coding RNA):&lt;/strong&gt; SINEs generate functional non-coding RNAs; Alu elements are a major source of A-to-I editing substrates.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 4 (Epigenetic Marks):&lt;/strong&gt; Epigenetic silencing (methylation, heterochromatin) is the primary host defense against active transposons.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 6 (Developmental Programs):&lt;/strong&gt; Transposon-derived enhancers drive tissue-specific gene expression during development.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Paper 7 (Structural DNA):&lt;/strong&gt; Satellite DNA at centromeres and telomeres provides the structural scaffold of chromosomes.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;13.4&quot; id=&quot;future-directions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.4&lt;/span&gt; Future Directions&lt;/h2&gt;
&lt;p&gt;Several directions remain for future work:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stochastic transposition:&lt;/strong&gt; Extending the endofunctor to a &lt;em&gt;probabilistic&lt;/em&gt; endofunctor incorporating target site preferences and epigenetic accessibility.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;TE ecosystem dynamics:&lt;/strong&gt; Modeling the competitive and cooperative interactions among different TE families as a categorical game.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Horizontal transfer:&lt;/strong&gt; Formalizing the “import” of new TEs from other species as inter-genome functors.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;CRISPR as TE defense:&lt;/strong&gt; Connecting prokaryotic CRISPR-Cas systems to the TE framework as a “type-checking firewall.”&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;13.5&quot; id=&quot;conclusion&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.5&lt;/span&gt; Conclusion&lt;/h2&gt;
&lt;p&gt;The view of repetitive elements as self-modifying code resolves the “junk DNA” paradox: these elements are not genomic waste but the genome’s metaprogramming layer. DNA transposons implement move semantics, retrotransposons implement copy semantics, satellite DNA provides structural alignment, ERVs are legacy imports, and domesticated elements demonstrate that even “parasitic” code can become essential infrastructure. The Gödelian self-prediction impossibility reveals a deep connection between genome evolution and the foundations of computation, suggesting that the creative unpredictability of evolution is not a bug but a fundamental feature of self-modifying systems.&lt;/p&gt;

:var(--text)}\n\n.theorem,.definition,.proposition,.lemma,.corollary,.invariant,.remark{\n  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n  border-radius:0 8px 8px 0;padding:1.2rem 1.5rem;margin:1.5rem 0\n}\n.theorem-title,.def-title{font-weight:700;color:var(--accent2);margin-bottom:.5rem;font-size:.9rem}\n\nfigure{margin:1.5rem 0;text-align:center}\nfigcaption{font-size:.82rem;color:var(--text-dim);margin-top:.5rem;font-style:italic}\nimg{max-width:100%;height:auto;border-radius:8px}\n\n.menu-toggle{display:none;position:fixed;top:1rem;left:1rem;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;color:var(--text);cursor:pointer;font-size:1.2rem}\n\n@media(max-width:900px){\n  .sidebar{transform:translateX(-100%)}\n  .sidebar.open{transform:translateX(0)}\n  .main-content{margin-left:0;padding:2rem 1.2rem}\n  .menu-toggle{display:block}\n}\n\n#TOC{display:none}\n.header-section-number{color:var(--accent);margin-right:.4rem;font-weight:600}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cbutton class=\"menu-toggle\" onclick=\"document.querySelector('.sidebar').classList.toggle('open')\"\u003e\u0026#9776;\u003c/button\u003e\n\u003cdiv class=\"page-wrapper\"\u003e\n\u003caside class=\"sidebar\" id=\"sidebar\"\u003e\n  \u003cdiv class=\"sidebar-header\"\u003e\n    \u003ca href=\"/\"\u003e\u0026larr; All Papers\u003c/a\u003e\n    \u003cdiv class=\"sidebar-title\"\u003eRepetitive Elements as Self-Modifying Code — DNA-Lang, Part V\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cnav class=\"toc-nav\" id=\"toc-nav\"\u003e\u003c/nav\u003e\n  \u003cdiv style=\"margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)\"\u003e\n    \u003ca href=\"../papers/repetitive-elements.pdf\" style=\"font-size:.8rem;color:var(--accent2);display:flex;align-items:center;gap:.4rem\"\u003ePDF Version \u0026darr;\u003c/a\u003e\n  \u003c/div\u003e\n\u003c/aside\u003e\n\u003cmain class=\"main-content\" id=\"content\"\u003e\n  \u003cdiv class=\"paper-header\"\u003e\n    \u003cspan class=\"paper-part\"\u003ePart V\u003c/span\u003e\n    \u003ch1 style=\"margin-top:0\"\u003eRepetitive Elements as Self-Modifying Code — DNA-Lang, Part V\u003c/h1\u003e\n    \u003cdiv class=\"paper-meta-row\"\u003e\n      \u003cspan\u003eMatthew Long\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003cspan\u003eYonedaAI Research Collective\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003cspan\u003eChicago, IL\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003ca href=\"../papers/repetitive-elements.pdf\"\u003ePDF\u003c/a\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003ch1 data-number=\"1\" id=\"sec:intro\"\u003e\u003cspan class=\"header-section-number\"\u003e1\u003c/span\u003e Introduction\u003c/h1\u003e\n\u003cp\u003eThe human genome comprises approximately 3.2 billion base pairs, yet fewer than 2% encode proteins. The remaining landscape is dominated by repetitive elements: DNA transposons, retrotransposons (both autonomous LINEs and non-autonomous SINEs), satellite DNA, and endogenous retroviruses (ERVs). Together, these constitute over 45% of the genome \u003cspan class=\"citation\" data-cites=\"lander2001 debarros2008\"\u003e\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003eFor decades, these elements were labelled “selfish DNA” or “junk DNA,” understood merely as genomic parasites that replicate at the host’s expense \u003cspan class=\"citation\" data-cites=\"orgel1980 doolittle1980\"\u003e\u003c/span\u003e. This view has undergone a profound revision. Transposable elements (TEs) serve as reservoirs of regulatory innovation \u003cspan class=\"citation\" data-cites=\"feschotte2008\"\u003e\u003c/span\u003e, drive genome restructuring \u003cspan class=\"citation\" data-cites=\"kazazian2004\"\u003e\u003c/span\u003e, and have been repeatedly \u003cem\u003edomesticated\u003c/em\u003e for host function—most dramatically in the case of V(D)J recombination, the engine of adaptive immunity \u003cspan class=\"citation\" data-cites=\"agrawal1998\"\u003e\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003eIn the DNA-Lang framework, we interpret the genome as a programming language whose source code is simultaneously its own runtime. Repetitive elements, in this view, are not inert detritus but a \u003cem\u003eself-modifying code system\u003c/em\u003e—instructions that rewrite the very program they inhabit. This places genomes alongside the classical self-modifying architectures studied in computer science, from von Neumann’s stored-program concept to Lisp macros and JIT compilers.\u003c/p\u003e\n\u003cdiv id=\"def:selfmod\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 1\u003c/strong\u003e (Self-Modifying Genome).  \u003cem\u003eA \u003cem\u003eself-modifying genome\u003c/em\u003e is a triple \u003cspan class=\"math inline\"\u003e(\\mathcal{G}, \\mathsf{TE}, \\tau)\u003c/span\u003e where:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\mathcal{G}\u003c/span\u003e is a finite sequence over the alphabet \u003cspan class=\"math inline\"\u003e\\{A, T, G, C\\}\u003c/span\u003e,\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{TE}\\subseteq \\mathcal{G}\u003c/span\u003e is the set of transposable element loci,\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\tau : \\mathsf{TE}\u0026times; \\mathcal{G}\\to \\mathcal{G}\u003c/span\u003e is the transposition function satisfying \u003cspan class=\"math inline\"\u003e|\\tau(t,g)| \u0026ge; |g|\u003c/span\u003e for retrotransposons (copy semantics) and \u003cspan class=\"math inline\"\u003e|\\tau(t,g)| = |g|\u003c/span\u003e for
