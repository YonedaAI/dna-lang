    &lt;h1 style=&quot;margin-top:0&quot;&gt;DNA-Lang: A Typed Orchestration Language — DNA-Lang, Synthesis&lt;/h1&gt;

&lt;div class=&quot;center&quot;&gt;
&lt;p&gt;&lt;span&gt;&lt;strong&gt;DNA-Lang: A Typed Orchestration Language&lt;br /&gt;
for Biological Programming&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;Matthew Long&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;The YonedaAI Collaboration&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;Chicago, IL&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;&lt;code&gt;matt@yoneda.ai&lt;/code&gt;&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;Paper VIII in the series: &lt;em&gt;DNA as a Programming Language&lt;/em&gt;&lt;/span&gt;&lt;br /&gt;
&lt;span&gt;March 31, 2026&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;onecolabstract&quot;&gt;
&lt;p&gt;We present &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt;, a statically typed orchestration language that unifies seven biological data types—corresponding to the fundamental computational abstractions of the genome—with biotech workflow types for CRISPR editing, AI-driven protein engineering, experimental design, and regulatory compliance. The language provides a complete type system with refinement types for biological constraints, a four-layer compiler architecture producing design, AI, experiment, and compliance artifacts, and typed interfaces to AI models and CRISPR backends. We give the formal syntax, typing rules, and compilation semantics, prove type safety and compilation correctness, and provide a reference implementation in Haskell. The PCSK9 knockout therapy serves as a worked example demonstrating the full pipeline from program specification through type checking to artifact generation. &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; is the first programming language that treats the complete arc of biological intent—from target identification through experimental validation—as a single, type-checked program.&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Keywords:&lt;/strong&gt; biological programming language, type system, CRISPR, gene editing, compiler, formal verification, biological computation, AI integration, provenance&lt;/p&gt;
&lt;h1 data-number=&quot;1&quot; id=&quot;sec:intro&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1&lt;/span&gt; Introduction&lt;/h1&gt;
&lt;p&gt;Modern biotechnology operates with an abundance of powerful but disconnected tools. The Synthetic Biology Open Language (SBOL) &lt;span class=&quot;citation&quot; data-cites=&quot;galdzicki2014sbol&quot;&gt;&lt;/span&gt; provides a standard for biological design exchange. CRISPR-Cas systems &lt;span class=&quot;citation&quot; data-cites=&quot;doudna2014crispr&quot;&gt;&lt;/span&gt; enable precise genome editing. AI models such as AlphaFold &lt;span class=&quot;citation&quot; data-cites=&quot;jumper2021alphafold&quot;&gt;&lt;/span&gt; predict protein structures with near-experimental accuracy. Laboratory information management systems (LIMS) track experimental execution. Yet no unified, typed programming language spans the full arc from biological intent to experimental validation.&lt;/p&gt;
&lt;p&gt;This gap has concrete consequences. A researcher designing a gene knockout must manually coordinate between sequence databases, guide RNA design tools, off-target prediction models, construct assembly protocols, cell line selection, assay design, and regulatory documentation. Each transition is untyped—a string passed from one tool to the next, with no compile-time guarantee that the output of one stage is a valid input to another.&lt;/p&gt;
&lt;p&gt;In Papers I–VII of this series, we established that the genome itself is organized around seven distinct computational abstractions:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Coding sequences&lt;/strong&gt; as executable functions (Paper I): the central dogma as compilation from source (DNA) through intermediate representation (mRNA) to executable (protein).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Regulatory sequences&lt;/strong&gt; as control flow (Paper II): promoters, enhancers, silencers, and insulators implementing conditional execution, loops, and branching.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Non-coding RNA&lt;/strong&gt; as signals and middleware (Paper III): miRNA, siRNA, and lncRNA providing inter-process communication, message passing, and coordination.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Structural DNA&lt;/strong&gt; as memory layout (Paper IV): telomeres, centromeres, and topologically associating domains organizing the genome’s address space.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Repetitive elements&lt;/strong&gt; as self-modifying code (Paper V): transposons, SINEs, and LINEs enabling runtime code rewriting and genomic plasticity.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Epigenetic marks&lt;/strong&gt; as runtime state (Paper VI): DNA methylation and histone modifications implementing mutable state that persists across cell divisions.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Developmental programs&lt;/strong&gt; as orchestration (Paper VII): Hox genes, morphogen gradients, and cell-fate networks composing the above into a coherent organism-level program.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; synthesizes these seven biological types into a complete programming language, augmented with biotech workflow types that connect biological design to laboratory execution. The result is a language in which:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Every biological entity has a precise type.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Every CRISPR editing operation is type-checked against its target.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Every AI model invocation declares its input/output types, confidence bounds, and provenance.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Every experimental step is traced from intent through execution to compliance documentation.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The compiler produces not one artifact but four: a design artifact (SBOL-compatible sequences and constructs), an AI artifact (model predictions with uncertainty), an experiment artifact (assay plans with controls), and a compliance artifact (provenance and regulatory documentation).&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;The remainder of this paper is organized as follows. &lt;a href=&quot;#sec:seven-types&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:seven-types&quot;&gt;2&lt;/a&gt; summarizes the seven biological types. &lt;a href=&quot;#sec:type-system&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:type-system&quot;&gt;3&lt;/a&gt; presents the unified type system. &lt;a href=&quot;#sec:syntax&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:syntax&quot;&gt;4&lt;/a&gt; gives the complete syntax. &lt;a href=&quot;#sec:type-checker&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:type-checker&quot;&gt;5&lt;/a&gt; specifies the type checker. &lt;a href=&quot;#sec:compiler&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:compiler&quot;&gt;6&lt;/a&gt; describes the four-layer compiler architecture. &lt;a href=&quot;#sec:artifacts&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:artifacts&quot;&gt;7&lt;/a&gt; details the four compiler artifacts. &lt;a href=&quot;#sec:ai-service&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:ai-service&quot;&gt;8&lt;/a&gt; formalizes AI as a typed service. &lt;a href=&quot;#sec:crispr-backend&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:crispr-backend&quot;&gt;9&lt;/a&gt; specifies the CRISPR backend. &lt;a href=&quot;#sec:integration&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:integration&quot;&gt;10&lt;/a&gt; describes integration points. &lt;a href=&quot;#sec:example&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:example&quot;&gt;11&lt;/a&gt; presents the PCSK9 worked example. &lt;a href=&quot;#sec:formal&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:formal&quot;&gt;12&lt;/a&gt; states formal properties. &lt;a href=&quot;#sec:implementation&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:implementation&quot;&gt;13&lt;/a&gt; describes the Haskell implementation. &lt;a href=&quot;#sec:discussion&quot; data-reference-type=&quot;ref+Label&quot; data-reference=&quot;sec:discussion&quot;&gt;14&lt;/a&gt; discusses implications and future work.&lt;/p&gt;
&lt;h1 data-number=&quot;2&quot; id=&quot;sec:seven-types&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2&lt;/span&gt; The Seven Biological Types&lt;/h1&gt;
&lt;p&gt;Each of the seven papers in this series identified a fundamental computational abstraction in the genome. &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; elevates each to a first-class type.&lt;/p&gt;
&lt;h2 data-number=&quot;2.1&quot; id=&quot;proteincodet-executable-functions-paper-i&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.1&lt;/span&gt; ProteinCodeT — Executable Functions (Paper I)&lt;/h2&gt;
&lt;p&gt;Coding sequences are the genome’s functions. The central dogma—DNA &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; mRNA &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; protein—is a compilation pipeline: source code (the gene) is transcribed into an intermediate representation (mRNA), which is translated into an executable (the folded protein). The type &lt;code&gt;ProteinCodeT&lt;/code&gt; parameterizes over the protein’s functional class &lt;span class=&quot;math inline&quot;&gt;T&lt;/span&gt; (enzyme, structural protein, transcription factor, etc.).&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 1&lt;/strong&gt; (ProteinCode).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;ProteinCode&lt;/code&gt;\langle T \rangle&lt;/span&gt; is a coding sequence that, when expressed, produces a protein of functional class &lt;span class=&quot;math inline&quot;&gt;T&lt;/span&gt;. The compilation pipeline is: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;ProteinCode&lt;/code&gt;\langle T \rangle \xrightarrow{\text{transcription}} &lt;code&gt;mRNA&lt;/code&gt;\langle T \rangle \xrightarrow{\text{translation}} T&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.2&quot; id=&quot;regulatorexpressionlevel-control-flow-paper-ii&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.2&lt;/span&gt; RegulatorExpressionLevel — Control Flow (Paper II)&lt;/h2&gt;
&lt;p&gt;Regulatory sequences implement the genome’s control flow. Promoters are function entry points. Enhancers are conditional jumps that activate expression when bound by specific transcription factors. Silencers are conditional blocks. Insulators are scope delimiters that prevent regulatory crosstalk.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 2&lt;/strong&gt; (Regulator).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Regulator&lt;/code&gt;\langle \text{ExpressionLevel} \rangle&lt;/span&gt; maps a set of transcription factor concentrations to an expression level: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;Regulator&lt;/code&gt;\langle E \rangle : \text{TFContext} \to E&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;E&lt;/span&gt; is a quantitative expression level in &lt;span class=&quot;math inline&quot;&gt;[0, E_{\max}]&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.3&quot; id=&quot;rnacontrolprocess-signals-and-middleware-paper-iii&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.3&lt;/span&gt; RNAControlProcess — Signals and Middleware (Paper III)&lt;/h2&gt;
&lt;p&gt;Non-coding RNAs serve as the genome’s signaling and middleware layer. MicroRNAs (miRNAs) act as message filters, silencing specific mRNAs post-transcriptionally. Small interfering RNAs (siRNAs) implement targeted message destruction. Long non-coding RNAs (lncRNAs) serve as scaffolds and coordinators, analogous to middleware buses.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 3&lt;/strong&gt; (RNAControl).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;RNAControl&lt;/code&gt;\langle P \rangle&lt;/span&gt; modulates process &lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt; through RNA-mediated regulation: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;RNAControl&lt;/code&gt;\langle P \rangle : P \to P&amp;#39;&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;P&amp;#39;&lt;/span&gt; is the post-regulation state of the process.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.4&quot; id=&quot;structuregenomelayout-memory-layout-paper-iv&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.4&lt;/span&gt; StructureGenomeLayout — Memory Layout (Paper IV)&lt;/h2&gt;
&lt;p&gt;Structural DNA elements organize the genome’s three-dimensional architecture. Telomeres protect chromosome ends (buffer overflow guards). Centromeres enable chromosome segregation (memory allocation). Topologically associating domains (TADs) partition the genome into regulatory neighborhoods (memory segments).&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 4&lt;/strong&gt; (Structure).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Structure&lt;/code&gt;\langle \text{GenomeLayout} \rangle&lt;/span&gt; defines a spatial organization of genomic regions: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;Structure&lt;/code&gt;\langle G \rangle : \text{LinearGenome} \to \text{3DGenome}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.5&quot; id=&quot;repeatselfmodifying-self-modifying-code-paper-v&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.5&lt;/span&gt; RepeatSelfModifying — Self-Modifying Code (Paper V)&lt;/h2&gt;
&lt;p&gt;Repetitive elements—transposons, SINEs, LINEs—are the genome’s self-modifying code. Transposons copy or move themselves within the genome, rewriting the program at runtime. This enables genomic plasticity, immune system diversity (V(D)J recombination), and evolutionary innovation.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 5&lt;/strong&gt; (Repeat).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Repeat&lt;/code&gt;\langle \text{SelfModifying} \rangle&lt;/span&gt; is a genomic element capable of altering the genome: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;Repeat&lt;/code&gt;\langle S \rangle : \text{Genome} \to \text{Genome}&amp;#39;&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\text{Genome}&amp;#39;&lt;/span&gt; differs from &lt;span class=&quot;math inline&quot;&gt;\text{Genome}&lt;/span&gt; by the insertion, deletion, or rearrangement mediated by the element.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.6&quot; id=&quot;stateaccessibility-runtime-state-paper-vi&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.6&lt;/span&gt; StateAccessibility — Runtime State (Paper VI)&lt;/h2&gt;
&lt;p&gt;Epigenetic marks—DNA methylation, histone modifications—constitute the genome’s mutable runtime state. Unlike the DNA sequence itself (the program text), epigenetic marks can be written and erased during execution (cell life). They determine which regions of the genome are accessible (open chromatin) or silenced (heterochromatin).&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 6&lt;/strong&gt; (State).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;State&lt;/code&gt;\langle \text{Accessibility} \rangle&lt;/span&gt; maps genomic loci to accessibility states: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;State&lt;/code&gt;\langle A \rangle : \text{Locus} \to A&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;A \in \{\text{Open}, \text{Poised}, \text{Repressed}, \text{Silent}\}&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.7&quot; id=&quot;programorganismdevelopment-orchestration-paper-vii&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.7&lt;/span&gt; ProgramOrganismDevelopment — Orchestration (Paper VII)&lt;/h2&gt;
&lt;p&gt;Developmental programs—Hox gene cascades, morphogen gradients, cell-fate decision networks—orchestrate all previous types into a coherent organism-level computation. They are the genome’s “main function,” composing functions, control flow, signals, memory layout, self-modification, and state into the emergent phenomenon of development.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 7&lt;/strong&gt; (Program).  &lt;em&gt;A value of type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Program&lt;/code&gt;\langle \text{OrganismDevelopment} \rangle&lt;/span&gt; is a composition of all six preceding types: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;Program&lt;/code&gt;\langle O \rangle = (&lt;code&gt;ProteinCode&lt;/code&gt;, &lt;code&gt;Regulator&lt;/code&gt;, &lt;code&gt;RNAControl&lt;/code&gt;, &lt;code&gt;Structure&lt;/code&gt;, &lt;code&gt;Repeat&lt;/code&gt;, &lt;code&gt;State&lt;/code&gt;) \to O&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;O&lt;/span&gt; is the developmental outcome (cell type, tissue, organ, organism).&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure id=&quot;fig:seven-types&quot; data-latex-placement=&quot;H&quot;&gt;

&lt;figcaption&gt;The seven biological types. &lt;code&gt;Program&lt;/code&gt; composes all six preceding types into organism-level orchestration.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h1 data-number=&quot;3&quot; id=&quot;sec:type-system&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3&lt;/span&gt; The Unified Type System&lt;/h1&gt;
&lt;p&gt;The &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; type system extends the seven biological types with biotech workflow types, refinement types, and a composite genome type.&lt;/p&gt;
&lt;h2 data-number=&quot;3.1&quot; id=&quot;core-types&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.1&lt;/span&gt; Core Types&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 8&lt;/strong&gt; (Core Type Universe).  &lt;em&gt;The set of &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; types &lt;span class=&quot;math inline&quot;&gt;\mathcal{T}&lt;/span&gt; is defined by the grammar: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
\tau ::=\; &amp;amp; &lt;code&gt;ProteinCode&lt;/code&gt; \mid &lt;code&gt;Regulator&lt;/code&gt; \mid &lt;code&gt;RNAControl&lt;/code&gt; \mid &lt;code&gt;Structure&lt;/code&gt; \mid &lt;code&gt;Repeat&lt;/code&gt; \mid &lt;code&gt;State&lt;/code&gt; \mid &lt;code&gt;Program&lt;/code&gt; \\
\mid\; &amp;amp; &lt;code&gt;Target&lt;/code&gt; \mid &lt;code&gt;Sequence&lt;/code&gt;\langle \kappa \rangle \mid &lt;code&gt;GuideRNA&lt;/code&gt; \mid &lt;code&gt;Edit&lt;/code&gt;\langle \epsilon \rangle \mid &lt;code&gt;Vector&lt;/code&gt; \mid &lt;code&gt;CellLine&lt;/code&gt; \\
\mid\; &amp;amp; &lt;code&gt;Assay&lt;/code&gt; \mid &lt;code&gt;Phenotype&lt;/code&gt; \mid &lt;code&gt;Candidate&lt;/code&gt; \mid &lt;code&gt;Risk&lt;/code&gt;\langle \rho \rangle \mid &lt;code&gt;Evidence&lt;/code&gt; \mid &lt;code&gt;Workflow&lt;/code&gt; \\
\mid\; &amp;amp; \{\tau \mid \phi\} \mid &lt;code&gt;Genome&lt;/code&gt; \mid [\tau] \mid (\tau_1, &amp;hellip;, \tau_n) \to \tau \\[4pt]
\kappa ::=\; &amp;amp; &lt;code&gt;DNA&lt;/code&gt; \mid &lt;code&gt;RNA&lt;/code&gt; \mid &lt;code&gt;Protein&lt;/code&gt; \\
\epsilon ::=\; &amp;amp; &lt;code&gt;Knockout&lt;/code&gt; \mid &lt;code&gt;BaseEdit&lt;/code&gt; \mid &lt;code&gt;PrimeEdit&lt;/code&gt; \mid &lt;code&gt;Insertion&lt;/code&gt; \\
\rho ::=\; &amp;amp; &lt;code&gt;OffTarget&lt;/code&gt; \mid &lt;code&gt;Toxicity&lt;/code&gt; \mid &lt;code&gt;Immunogenicity&lt;/code&gt;
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;3.2&quot; id=&quot;biotech-workflow-types&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.2&lt;/span&gt; Biotech Workflow Types&lt;/h2&gt;
&lt;p&gt;The workflow types model the stages of a biotech pipeline:&lt;/p&gt;
&lt;div id=&quot;tab:workflow-types&quot;&gt;

&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Analogy&lt;/strong&gt;&lt;/th&gt;

&lt;h2 data-number=&quot;3.3&quot; id=&quot;refinement-types&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.3&lt;/span&gt; Refinement Types&lt;/h2&gt;
&lt;p&gt;Refinement types attach biological constraints to base types. A refinement type &lt;span class=&quot;math inline&quot;&gt;\{\tau \mid \phi\}&lt;/span&gt; denotes values of type &lt;span class=&quot;math inline&quot;&gt;\tau&lt;/span&gt; satisfying predicate &lt;span class=&quot;math inline&quot;&gt;\phi&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 9&lt;/strong&gt; (Biological Constraints).  &lt;em&gt;The constraint language &lt;span class=&quot;math inline&quot;&gt;\phi&lt;/span&gt; is: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
\phi ::=\; &amp;amp; &lt;code&gt;length&lt;/code&gt; &amp;ge; n \mid &lt;code&gt;length&lt;/code&gt; &amp;le; n \\
\mid\; &amp;amp; l &amp;le; &lt;code&gt;GC&lt;/code&gt; &amp;le; h \mid &lt;code&gt;off\_targets&lt;/code&gt; = 0 \\
\mid\; &amp;amp; &lt;code&gt;specificity&lt;/code&gt; &amp;ge; s \mid &lt;code&gt;efficiency&lt;/code&gt; &amp;ge; e \\
\mid\; &amp;amp; &lt;code&gt;risk&lt;/code&gt;(\rho) &amp;le; v \mid &lt;code&gt;PAM&lt;/code&gt; = p \\
\mid\; &amp;amp; l &amp;le; &lt;code&gt;expression&lt;/code&gt; &amp;le; h \\
\mid\; &amp;amp; \phi_1 \wedge \phi_2 \mid \phi_1 \vee \phi_2 \mid \neg \phi \mid \top
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 10&lt;/strong&gt; (Refined GuideRNA).  &lt;em&gt;A guide RNA with specificity at least 0.9 and no off-targets: &lt;span class=&quot;math display&quot;&gt;&lt;code&gt;SafeGuide&lt;/code&gt; = \{&lt;code&gt;GuideRNA&lt;/code&gt; \mid &lt;code&gt;specificity&lt;/code&gt; &amp;ge; 0.9 \wedge &lt;code&gt;off\_targets&lt;/code&gt; = 0\}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;3.4&quot; id=&quot;the-genome-composite-type&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.4&lt;/span&gt; The Genome Composite Type&lt;/h2&gt;
&lt;p&gt;The &lt;code&gt;Genome&lt;/code&gt; type is the composite of all seven biological types:&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 11&lt;/strong&gt; (Genome).  &lt;em&gt;&lt;span class=&quot;math display&quot;&gt;&lt;code&gt;Genome&lt;/code&gt; = &lt;code&gt;ProteinCode&lt;/code&gt; &amp;times; &lt;code&gt;Regulator&lt;/code&gt; &amp;times; &lt;code&gt;RNAControl&lt;/code&gt; &amp;times; &lt;code&gt;Structure&lt;/code&gt; &amp;times; &lt;code&gt;Repeat&lt;/code&gt; &amp;times; &lt;code&gt;State&lt;/code&gt; &amp;times; &lt;code&gt;Program&lt;/code&gt;&lt;/span&gt; Every biological type is a subtype of &lt;code&gt;Genome&lt;/code&gt;: for each &lt;span class=&quot;math inline&quot;&gt;\tau \in \{&lt;code&gt;ProteinCode&lt;/code&gt;, &amp;hellip;, &lt;code&gt;Program&lt;/code&gt;\}&lt;/span&gt;, we have &lt;span class=&quot;math inline&quot;&gt;\tau &amp;lt;: &lt;code&gt;Genome&lt;/code&gt;&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;3.5&quot; id=&quot;subtyping&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.5&lt;/span&gt; Subtyping&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 12&lt;/strong&gt; (Subtyping Rules).  &lt;em&gt;The subtyping relation &lt;span class=&quot;math inline&quot;&gt;&amp;lt;:&lt;/span&gt; is the smallest reflexive and transitive relation satisfying:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\tau &amp;lt;: \tau&lt;/span&gt; (reflexivity)&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\{\tau \mid \phi\} &amp;lt;: \tau&lt;/span&gt; (refinement subsumption)&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\tau_{\text{bio}} &amp;lt;: &lt;code&gt;Genome&lt;/code&gt;&lt;/span&gt; for each biological type &lt;span class=&quot;math inline&quot;&gt;\tau_{\text{bio}}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;GuideRNA&lt;/code&gt; &amp;lt;: &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle&lt;/span&gt; (a guide is a DNA sequence)&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Candidate&lt;/code&gt; &amp;lt;: &lt;code&gt;Evidence&lt;/code&gt;&lt;/span&gt; (a candidate is evidence)&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;[\tau_1] &amp;lt;: [\tau_2]&lt;/span&gt; if &lt;span class=&quot;math inline&quot;&gt;\tau_1 &amp;lt;: \tau_2&lt;/span&gt; (list covariance)&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;4&quot; id=&quot;sec:syntax&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4&lt;/span&gt; DNA-Lang Syntax&lt;/h1&gt;
&lt;h2 data-number=&quot;4.1&quot; id=&quot;program-structure&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.1&lt;/span&gt; Program Structure&lt;/h2&gt;
&lt;p&gt;A &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; program consists of a named program block containing declarations and actions:&lt;/p&gt;
&lt;pre id=&quot;lst:structure&quot; style=&quot;dnalangstyle&quot; data-caption=&quot;General program structure.&quot; data-label=&quot;lst:structure&quot;&gt;&lt;code&gt;program &amp;lt;Name&amp;gt; {
    &amp;lt;declarations&amp;gt;
    &amp;lt;actions&amp;gt;
}&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Declarations introduce typed bindings. Actions perform side-effecting operations (running assays, collecting results, validating constraints).&lt;/p&gt;
&lt;h2 data-number=&quot;4.2&quot; id=&quot;declarations&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.2&lt;/span&gt; Declarations&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 13&lt;/strong&gt; (Declaration Forms).  &lt;em&gt;&lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; supports the following declaration forms: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
d ::=\; &amp;amp; &lt;strong&gt;&lt;code&gt;target&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;sequence&lt;/code&gt;&lt;/strong&gt;\; x : \kappa = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;guide&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;edit&lt;/code&gt;&lt;/strong&gt;\; x : \epsilon = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;vector&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;cell\_line&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;assay&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;model\_result&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;construct&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;candidate&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;let&lt;/code&gt;&lt;/strong&gt;\; x : \tau = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt;\; \phi
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;Each declaration introduces a binding &lt;span class=&quot;math inline&quot;&gt;x&lt;/span&gt; of the appropriate type into the type environment, with the exception of &lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt;, which asserts a constraint &lt;span class=&quot;math inline&quot;&gt;\phi&lt;/span&gt; that must hold at compile time.&lt;/p&gt;
&lt;h2 data-number=&quot;4.3&quot; id=&quot;expressions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.3&lt;/span&gt; Expressions&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 14&lt;/strong&gt; (Expression Forms).  &lt;em&gt;&lt;span class=&quot;math display&quot;&gt;\begin{align*}
e ::=\; &amp;amp; x \mid \text{``}s\text{&amp;#39;&amp;#39;} \mid n \mid f \mid &lt;code&gt;true&lt;/code&gt; \mid &lt;code&gt;false&lt;/code&gt; \\
\mid\; &amp;amp; [e_1, &amp;hellip;, e_n] \mid \{k_1 = e_1, &amp;hellip;, k_n = e_n\} \\
\mid\; &amp;amp; g(e_1, &amp;hellip;, e_n) \mid e.k \mid e_1 \oplus e_2 \mid e : \tau
\end{align*}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;x&lt;/span&gt; is a variable, &lt;span class=&quot;math inline&quot;&gt;s&lt;/span&gt; a string, &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt; an integer, &lt;span class=&quot;math inline&quot;&gt;f&lt;/span&gt; a float, &lt;span class=&quot;math inline&quot;&gt;g&lt;/span&gt; a function name, &lt;span class=&quot;math inline&quot;&gt;k&lt;/span&gt; a field name, &lt;span class=&quot;math inline&quot;&gt;\oplus&lt;/span&gt; a binary operator, and &lt;span class=&quot;math inline&quot;&gt;\tau&lt;/span&gt; a type annotation.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;4.4&quot; id=&quot;actions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.4&lt;/span&gt; Actions&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 15&lt;/strong&gt; (Action Forms).  &lt;em&gt;&lt;span class=&quot;math display&quot;&gt;\begin{align*}
a ::=\; &amp;amp; &lt;strong&gt;&lt;code&gt;run&lt;/code&gt;&lt;/strong&gt;\; g(e_1, &amp;hellip;, e_n) \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;collect&lt;/code&gt;&lt;/strong&gt;\; x = e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;validate&lt;/code&gt;&lt;/strong&gt;\; e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;log&lt;/code&gt;&lt;/strong&gt;\; e \\
\mid\; &amp;amp; &lt;strong&gt;&lt;code&gt;return&lt;/code&gt;&lt;/strong&gt;\; e
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;4.5&quot; id=&quot;full-grammar&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.5&lt;/span&gt; Full Grammar&lt;/h2&gt;
&lt;figure id=&quot;fig:grammar&quot; data-latex-placement=&quot;H&quot;&gt;
&lt;div class=&quot;minipage&quot;&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\begin{align*}
&lt;em&gt;program&lt;/em&gt; &amp;amp;::= &lt;strong&gt;&lt;code&gt;program&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;\{&lt;/code&gt;\; &lt;em&gt;item&lt;/em&gt;^*\; &lt;code&gt;\&lt;/code&gt;} \\
&lt;em&gt;item&lt;/em&gt; &amp;amp;::= &lt;em&gt;decl&lt;/em&gt; \mid &lt;em&gt;action&lt;/em&gt; \\
&lt;em&gt;decl&lt;/em&gt; &amp;amp;::= &lt;strong&gt;&lt;code&gt;target&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;=&lt;/code&gt;\; &lt;em&gt;expr&lt;/em&gt; \\
    &amp;amp;\mid\; &lt;strong&gt;&lt;code&gt;sequence&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;:&lt;/code&gt;\; &lt;em&gt;seqkind&lt;/em&gt;\; &lt;code&gt;=&lt;/code&gt;\; &lt;em&gt;expr&lt;/em&gt; \\
    &amp;amp;\mid\; &lt;strong&gt;&lt;code&gt;guide&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;=&lt;/code&gt;\; &lt;em&gt;expr&lt;/em&gt; \\
    &amp;amp;\mid\; &lt;strong&gt;&lt;code&gt;edit&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;:&lt;/code&gt;\; &lt;em&gt;editkind&lt;/em&gt;\; &lt;code&gt;=&lt;/code&gt;\; &lt;em&gt;expr&lt;/em&gt; \\
    &amp;amp;\mid\; &lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;constraint&lt;/em&gt; \\
    &amp;amp;\mid\; &amp;hellip; \\
&lt;em&gt;expr&lt;/em&gt; &amp;amp;::= &lt;em&gt;name&lt;/em&gt; \mid &lt;em&gt;literal&lt;/em&gt; \mid &lt;em&gt;name&lt;/em&gt;&lt;code&gt;(&lt;/code&gt;&lt;em&gt;expr&lt;/em&gt;^{*}&lt;code&gt;)&lt;/code&gt; \mid &lt;em&gt;expr&lt;/em&gt;&lt;code&gt;.&lt;/code&gt;&lt;em&gt;name&lt;/em&gt; \mid &lt;code&gt;[&lt;/code&gt;&lt;em&gt;expr&lt;/em&gt;^{*}&lt;code&gt;]&lt;/code&gt; \mid &lt;code&gt;\{&lt;/code&gt;&lt;em&gt;fields&lt;/em&gt;&lt;code&gt;\&lt;/code&gt;} \\
&lt;em&gt;action&lt;/em&gt; &amp;amp;::= &lt;strong&gt;&lt;code&gt;run&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;&lt;code&gt;(&lt;/code&gt;&lt;em&gt;expr&lt;/em&gt;^{*}&lt;code&gt;)&lt;/code&gt; \mid &lt;strong&gt;&lt;code&gt;collect&lt;/code&gt;&lt;/strong&gt;\; &lt;em&gt;name&lt;/em&gt;\; &lt;code&gt;=&lt;/code&gt;\; &lt;em&gt;expr&lt;/em&gt; \mid &amp;hellip; \\
&lt;em&gt;seqkind&lt;/em&gt; &amp;amp;::= &lt;code&gt;DNA&lt;/code&gt; \mid &lt;code&gt;RNA&lt;/code&gt; \mid &lt;code&gt;Protein&lt;/code&gt; \\
&lt;em&gt;editkind&lt;/em&gt; &amp;amp;::= &lt;code&gt;Knockout&lt;/code&gt; \mid &lt;code&gt;BaseEdit&lt;/code&gt; \mid &lt;code&gt;PrimeEdit&lt;/code&gt; \mid &lt;code&gt;Insertion&lt;/code&gt; \\
&lt;em&gt;constraint&lt;/em&gt; &amp;amp;::= &lt;code&gt;no\_off\_targets&lt;/code&gt; \mid &lt;code&gt;specificity&lt;/code&gt; &amp;ge; f \mid &lt;code&gt;efficiency&lt;/code&gt; &amp;ge; f \mid &amp;hellip;
\end{align*}&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figcaption&gt;Abbreviated grammar for &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h1 data-number=&quot;5&quot; id=&quot;sec:type-checker&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5&lt;/span&gt; The Type Checker&lt;/h1&gt;
&lt;h2 data-number=&quot;5.1&quot; id=&quot;typing-judgments&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.1&lt;/span&gt; Typing Judgments&lt;/h2&gt;
&lt;p&gt;The type checker maintains a type environment &lt;span class=&quot;math inline&quot;&gt;\Gamma : \text{Name} \to \mathcal{T}&lt;/span&gt; and checks each declaration and action in sequence.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 16&lt;/strong&gt; (Typing Judgment).  &lt;em&gt;The judgment &lt;span class=&quot;math inline&quot;&gt;\Gamma \vdash e : \tau&lt;/span&gt; means “in environment &lt;span class=&quot;math inline&quot;&gt;\Gamma&lt;/span&gt;, expression &lt;span class=&quot;math inline&quot;&gt;e&lt;/span&gt; has type &lt;span class=&quot;math inline&quot;&gt;\tau&lt;/span&gt;.”&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;5.2&quot; id=&quot;typing-rules-for-expressions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.2&lt;/span&gt; Typing Rules for Expressions&lt;/h2&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\begin{gather}
\frac{x : \tau \in \Gamma}{\Gamma \vdash x : \tau} \quad (Var)
\qquad
\frac{}{\Gamma \vdash \text{``}s\text{&amp;#39;&amp;#39;} : &lt;code&gt;String&lt;/code&gt;} \quad (Str)
\qquad
\frac{}{\Gamma \vdash n : &lt;code&gt;Int&lt;/code&gt;} \quad (Int)
\\[8pt]
\frac{g : (\tau_1, &amp;hellip;, \tau_n) \to \tau_r \quad \Gamma \vdash e_i : \tau_i&amp;#39; \quad \tau_i&amp;#39; &amp;lt;: \tau_i \;\forall i}{\Gamma \vdash g(e_1, &amp;hellip;, e_n) : \tau_r} \quad (App)
\\[8pt]
\frac{\Gamma \vdash e_1 : \tau \quad &amp;hellip; \quad \Gamma \vdash e_n : \tau}{\Gamma \vdash [e_1, &amp;hellip;, e_n] : [\tau]} \quad (List)
\qquad
\frac{\Gamma \vdash e : \tau \quad \tau &amp;lt;: \tau&amp;#39;}{\Gamma \vdash e : \tau&amp;#39;} \quad (Sub)
\end{gather}&lt;/span&gt;&lt;/p&gt;
&lt;h2 data-number=&quot;5.3&quot; id=&quot;typing-rules-for-declarations&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.3&lt;/span&gt; Typing Rules for Declarations&lt;/h2&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\begin{gather}
\frac{\Gamma \vdash e : \tau}{\Gamma \vdash (&lt;strong&gt;&lt;code&gt;target&lt;/code&gt;&lt;/strong&gt;\; x = e) &amp;rArr; \Gamma[x &amp;#8614; &lt;code&gt;Target&lt;/code&gt;]} \quad (Target)
\\[8pt]
\frac{\Gamma \vdash e : \tau \quad \tau &amp;lt;: &lt;code&gt;Sequence&lt;/code&gt;\langle\kappa\rangle}{\Gamma \vdash (&lt;strong&gt;&lt;code&gt;sequence&lt;/code&gt;&lt;/strong&gt;\; x : \kappa = e) &amp;rArr; \Gamma[x &amp;#8614; &lt;code&gt;Sequence&lt;/code&gt;\langle\kappa\rangle]} \quad (Seq)
\\[8pt]
\frac{\Gamma \vdash e : \tau \quad \tau &amp;lt;: &lt;code&gt;GuideRNA&lt;/code&gt;}{\Gamma \vdash (&lt;strong&gt;&lt;code&gt;guide&lt;/code&gt;&lt;/strong&gt;\; x = e) &amp;rArr; \Gamma[x &amp;#8614; &lt;code&gt;GuideRNA&lt;/code&gt;]} \quad (Guide)
\\[8pt]
\frac{\Gamma \vdash e : &lt;code&gt;Edit&lt;/code&gt;\langle\epsilon&amp;#39;\rangle \quad \epsilon&amp;#39; &amp;lt;: \epsilon}{\Gamma \vdash (&lt;strong&gt;&lt;code&gt;edit&lt;/code&gt;&lt;/strong&gt;\; x : \epsilon = e) &amp;rArr; \Gamma[x &amp;#8614; &lt;code&gt;Edit&lt;/code&gt;\langle\epsilon\rangle]} \quad (Edit)
\\[8pt]
\frac{\Gamma \vdash \phi \;\text{valid}}{\Gamma \vdash (&lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt;\; \phi) &amp;rArr; \Gamma} \quad (Require)
\end{gather}&lt;/span&gt;&lt;/p&gt;
&lt;h2 data-number=&quot;5.4&quot; id=&quot;refinement-type-checking&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.4&lt;/span&gt; Refinement Type Checking&lt;/h2&gt;
&lt;p&gt;When a &lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt; constraint is encountered, the type checker validates it against the constraint language. At compile time, this performs structural validation (non-negative lengths, valid GC ranges, etc.). At link time—when concrete sequences are available—refinement predicates are evaluated against the actual data.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 17&lt;/strong&gt; (Constraint Validity).  &lt;em&gt;A constraint &lt;span class=&quot;math inline&quot;&gt;\phi&lt;/span&gt; is &lt;em&gt;structurally valid&lt;/em&gt; if:&lt;/em&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;length&lt;/code&gt; &amp;ge; n&lt;/span&gt; with &lt;span class=&quot;math inline&quot;&gt;n &amp;ge; 0&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;l &amp;le; &lt;code&gt;GC&lt;/code&gt; &amp;le; h&lt;/span&gt; with &lt;span class=&quot;math inline&quot;&gt;0 &amp;le; l &amp;le; h &amp;le; 1&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;specificity&lt;/code&gt; &amp;ge; s&lt;/span&gt; with &lt;span class=&quot;math inline&quot;&gt;0 &amp;le; s &amp;le; 1&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;risk&lt;/code&gt;(\rho) &amp;le; v&lt;/span&gt; with &lt;span class=&quot;math inline&quot;&gt;v &amp;ge; 0&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\phi_1 \wedge \phi_2&lt;/span&gt; with both &lt;span class=&quot;math inline&quot;&gt;\phi_1&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;\phi_2&lt;/span&gt; valid&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\top&lt;/span&gt; is always valid&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;5.5&quot; id=&quot;type-inference&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.5&lt;/span&gt; Type Inference&lt;/h2&gt;
&lt;p&gt;&lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; uses bidirectional type checking. Declarations provide type annotations (the sequence kind &lt;span class=&quot;math inline&quot;&gt;\kappa&lt;/span&gt;, the edit kind &lt;span class=&quot;math inline&quot;&gt;\epsilon&lt;/span&gt;), and expressions are checked against these annotations. Function applications infer return types from the built-in function signature table.&lt;/p&gt;
&lt;h1 data-number=&quot;6&quot; id=&quot;sec:compiler&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6&lt;/span&gt; The Compiler Architecture — Four Layers&lt;/h1&gt;
&lt;p&gt;The &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; compiler is organized into four layers, each transforming the program closer to executable artifacts.&lt;/p&gt;
&lt;figure id=&quot;fig:compiler-layers&quot; data-latex-placement=&quot;H&quot;&gt;

&lt;figcaption&gt;The four-layer compiler architecture.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h2 data-number=&quot;6.1&quot; id=&quot;layer-1-irschema&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.1&lt;/span&gt; Layer 1: IR/Schema&lt;/h2&gt;
&lt;p&gt;The first layer lowers the parsed &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; AST into a typed intermediate representation (IR). Every node in the IR carries its type annotation, enabling downstream passes to perform type-directed transformations without re-running the type checker.&lt;/p&gt;
&lt;p&gt;The IR preserves the program’s declaration order, which matters because biological workflows are inherently sequential: a guide cannot be designed before its target is specified.&lt;/p&gt;
&lt;h2 data-number=&quot;6.2&quot; id=&quot;layer-2-dsl&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.2&lt;/span&gt; Layer 2: DSL&lt;/h2&gt;
&lt;p&gt;The second layer interprets the IR as a declarative specification in four domains:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Design&lt;/strong&gt;: target identification, sequence retrieval, guide design, construct assembly.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Edit&lt;/strong&gt;: CRISPR operation specification (knockout, base edit, prime edit, insertion).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Screen&lt;/strong&gt;: assay design, cell line selection, phenotype measurement.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Validate&lt;/strong&gt;: safety checks, off-target analysis, risk assessment.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;6.3&quot; id=&quot;layer-3-compilers&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.3&lt;/span&gt; Layer 3: Compilers&lt;/h2&gt;
&lt;p&gt;The third layer compiles the domain-specific representations to concrete external formats:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;SBOL 3.0&lt;/strong&gt;: biological design components, interactions, and modules.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Benchling API&lt;/strong&gt;: sequence entries, annotations, and assembly protocols.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;AlphaFold 3&lt;/strong&gt;: structure prediction requests with input sequences and parameters.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;LIMS/ELN&lt;/strong&gt;: experimental protocols, sample tracking, and instrument configurations.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;6.4&quot; id=&quot;layer-4-verification&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.4&lt;/span&gt; Layer 4: Verification&lt;/h2&gt;
&lt;p&gt;The fourth layer performs cross-cutting verification:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Off-target analysis&lt;/strong&gt;: genome-wide search for guide RNA binding sites.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Payload verification&lt;/strong&gt;: construct size, expression cassette integrity, codon optimization.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Manufacturability&lt;/strong&gt;: synthesis constraints, restriction site avoidance, GC content bounds.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Provenance&lt;/strong&gt;: complete trace from every output artifact back to its source declaration, through every model invocation and compilation step.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h1 data-number=&quot;7&quot; id=&quot;sec:artifacts&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7&lt;/span&gt; Four Compiler Artifacts&lt;/h1&gt;
&lt;p&gt;Compilation of a &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; program produces not one but four artifacts, each serving a distinct stakeholder.&lt;/p&gt;
&lt;h2 data-number=&quot;7.1&quot; id=&quot;design-artifact&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.1&lt;/span&gt; Design Artifact&lt;/h2&gt;
&lt;p&gt;The design artifact contains everything needed to physically realize the intended biological modification:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Target gene annotation and genomic coordinates&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Reference and modified sequences in GenBank and SBOL XML formats&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Guide RNA sequences with PAM sites and scoring metrics&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Construct maps with assembly instructions (Gibson, Golden Gate, etc.)&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Edit plans specifying the mechanism (NHEJ, HDR, base editing, prime editing)&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;7.2&quot; id=&quot;ai-artifact&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.2&lt;/span&gt; AI Artifact&lt;/h2&gt;
&lt;p&gt;The AI artifact documents every AI model invocation and its outputs:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Model identity and version (AlphaFold 3 release 2025-12, ESM-2 650M, etc.)&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Input hashes for reproducibility&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Predictions with calibrated confidence scores&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Uncertainty estimates (MC Dropout, Deep Ensemble)&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Ranking criteria and composite scores for guide selection&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;7.3&quot; id=&quot;experiment-artifact&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.3&lt;/span&gt; Experiment Artifact&lt;/h2&gt;
&lt;p&gt;The experiment artifact is a complete, executable experimental plan:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Assay protocols with step-by-step instructions&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Cell line specifications with authentication and passage requirements&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Controls: positive (known-functional guide), negative (scrambled guide), untransfected&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Statistical plan: sample size, replicates, tests, significance thresholds&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Acceptance criteria: minimum editing efficiency, maximum off-target rate&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Timeline with milestones (transfection, harvest, analysis, reporting)&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;7.4&quot; id=&quot;compliance-artifact&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.4&lt;/span&gt; Compliance Artifact&lt;/h2&gt;
&lt;p&gt;The compliance artifact provides regulatory and audit documentation:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Complete provenance chain from source code to every output&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Type environment snapshot at compilation&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;All constraint verifications with pass/fail status&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Model version registry with checksums&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Decision log recording every automated choice with rationale&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Regulatory classification and biosafety level&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Audit trail with timestamps and compiler version&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h1 data-number=&quot;8&quot; id=&quot;sec:ai-service&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;8&lt;/span&gt; AI as Typed Service&lt;/h1&gt;
&lt;p&gt;In &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt;, AI models are not opaque black boxes but typed services with declared interfaces. Each AI function has:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;A &lt;strong&gt;type signature&lt;/strong&gt;: input and output types.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A &lt;strong&gt;confidence bound&lt;/strong&gt;: calibrated probability that the prediction is correct within a specified tolerance.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A &lt;strong&gt;provenance record&lt;/strong&gt;: model identity, version, checkpoint hash, and input hash.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A &lt;strong&gt;validation protocol&lt;/strong&gt;: how to experimentally verify the prediction.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 18&lt;/strong&gt; (AI Service Signatures).  &lt;em&gt;The built-in AI services are: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
&lt;code&gt;predict\_structure&lt;/code&gt; &amp;amp;: &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;Protein&lt;/code&gt;\rangle \to &lt;code&gt;Structure&lt;/code&gt; \\
&lt;code&gt;rank\_guides&lt;/code&gt; &amp;amp;: &lt;code&gt;Target&lt;/code&gt; \to [&lt;code&gt;GuideRNA&lt;/code&gt;] \\
&lt;code&gt;predict\_off\_target&lt;/code&gt; &amp;amp;: &lt;code&gt;GuideRNA&lt;/code&gt; \to &lt;code&gt;Risk&lt;/code&gt;\langle&lt;code&gt;OffTarget&lt;/code&gt;\rangle \\
&lt;code&gt;propose\_variants&lt;/code&gt; &amp;amp;: &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;Protein&lt;/code&gt;\rangle \to [&lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;Protein&lt;/code&gt;\rangle]
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 19&lt;/strong&gt; (Typed AI Invocation).  &lt;em&gt;When the program calls &lt;code&gt;predict_structure(seq)&lt;/code&gt;, the type checker verifies that &lt;code&gt;seq&lt;/code&gt; has type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;Protein&lt;/code&gt;\rangle&lt;/span&gt;. The return type &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Structure&lt;/code&gt;&lt;/span&gt; is guaranteed. The AI artifact records the model version, input hash, pLDDT scores, and PAE matrix.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The key principle is that &lt;em&gt;AI uncertainty is a first-class citizen of the type system&lt;/em&gt;. A structure prediction does not simply return a PDB file; it returns a &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Structure&lt;/code&gt;&lt;/span&gt; value annotated with confidence metrics that downstream consumers can inspect and branch on.&lt;/p&gt;
&lt;div class=&quot;remark&quot;&gt;
&lt;p&gt;&lt;strong&gt;Remark 20&lt;/strong&gt;.  &lt;em&gt;The typed AI service approach addresses a critical gap in current biotech workflows: the tendency to treat AI predictions as ground truth. By requiring explicit confidence bounds and validation protocols, &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; forces researchers to acknowledge and plan for prediction uncertainty.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;9&quot; id=&quot;sec:crispr-backend&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9&lt;/span&gt; CRISPR as Backend&lt;/h1&gt;
&lt;p&gt;CRISPR-Cas systems serve as the primary execution backend for &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; programs. Each editing modality is a typed operation that compiles to concrete molecular components.&lt;/p&gt;
&lt;h2 data-number=&quot;9.1&quot; id=&quot;editing-operations&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9.1&lt;/span&gt; Editing Operations&lt;/h2&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 21&lt;/strong&gt; (CRISPR Operations).  &lt;em&gt;&lt;span class=&quot;math display&quot;&gt;\begin{align*}
&lt;code&gt;knockout&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Knockout&lt;/code&gt;\rangle \\
&lt;code&gt;base\_edit&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;, &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;BaseEdit&lt;/code&gt;\rangle \\
&lt;code&gt;prime\_edit&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;, &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;PrimeEdit&lt;/code&gt;\rangle \\
&lt;code&gt;insert\_payload&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;, &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Insertion&lt;/code&gt;\rangle
\end{align*}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;9.2&quot; id=&quot;compilation-to-molecular-components&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9.2&lt;/span&gt; Compilation to Molecular Components&lt;/h2&gt;
&lt;p&gt;Each CRISPR operation compiles to a set of molecular components:&lt;/p&gt;
&lt;div id=&quot;tab:crispr-compilation&quot;&gt;
&lt;table&gt;
&lt;caption&gt;CRISPR operations and their compiled molecular components.&lt;/caption&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Operation&lt;/strong&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Compiled Components&lt;/strong&gt;&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;knockout&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;SpCas9 protein or mRNA, guide RNA with scaffold, delivery vehicle (RNP, LNP, or AAV)&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;base_edit&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;ABE8e or CBE4 fusion protein, guide RNA, no donor template required&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;prime_edit&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;PE2 or PE3 nickase fusion, pegRNA with primer binding site and RT template, nicking guide&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;insert_payload&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;SpCas9, guide RNA, HDR donor template with homology arms (typically 500–1000bp each), delivery vehicle&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;9.3&quot; id=&quot;additional-crispr-modalities&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9.3&lt;/span&gt; Additional CRISPR Modalities&lt;/h2&gt;
&lt;p&gt;Beyond the four core editing operations, &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; supports CRISPRa (activation) and CRISPRi (repression) as typed operations:&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\begin{align*}
&lt;code&gt;activate&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Insertion&lt;/code&gt;\rangle \\
&lt;code&gt;repress&lt;/code&gt; &amp;amp;: (&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Knockout&lt;/code&gt;\rangle
\end{align*}&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;These compile to dCas9 fusion proteins (VP64, p65, Rta for activation; KRAB for repression) with the specified guide RNA.&lt;/p&gt;
&lt;h1 data-number=&quot;10&quot; id=&quot;sec:integration&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10&lt;/span&gt; Integration Points&lt;/h1&gt;
&lt;p&gt;&lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; is designed to integrate with existing biotech infrastructure rather than replace it.&lt;/p&gt;
&lt;h2 data-number=&quot;10.1&quot; id=&quot;sbol-synthetic-biology-open-language&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.1&lt;/span&gt; SBOL (Synthetic Biology Open Language)&lt;/h2&gt;
&lt;p&gt;The design artifact exports biological components, interactions, and modules in SBOL 3.0 format. Each &lt;code&gt;Sequence&lt;/code&gt; declaration maps to an SBOL &lt;code&gt;Component&lt;/code&gt;. Each &lt;code&gt;Edit&lt;/code&gt; maps to an SBOL &lt;code&gt;Interaction&lt;/code&gt;. The program’s declaration structure maps to an SBOL &lt;code&gt;Module&lt;/code&gt; hierarchy.&lt;/p&gt;
&lt;h2 data-number=&quot;10.2&quot; id=&quot;benchling&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.2&lt;/span&gt; Benchling&lt;/h2&gt;
&lt;p&gt;Benchling integration provides sequence management, annotation, and collaboration. The &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; compiler generates Benchling API calls to:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Create and annotate sequences&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Register constructs with assembly protocols&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Track guide RNA designs with scoring metrics&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Link experimental results to design specifications&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;10.3&quot; id=&quot;alphafold-3&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.3&lt;/span&gt; AlphaFold 3&lt;/h2&gt;
&lt;p&gt;Structure prediction requests are compiled into AlphaFold 3 API calls with:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Input sequences in the required format&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Multimer specifications for protein complexes&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Post-processing to extract pLDDT, PAE, and contact maps&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Caching of results keyed by input sequence hash&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;10.4&quot; id=&quot;limseln&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.4&lt;/span&gt; LIMS/ELN&lt;/h2&gt;
&lt;p&gt;Laboratory execution is managed through LIMS integration:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Experimental protocols generated from assay declarations&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Sample registration and tracking&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Instrument configuration and scheduling&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Result capture and automated quality control&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Notebook entries linked to program source and compilation artifacts&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h1 data-number=&quot;11&quot; id=&quot;sec:example&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11&lt;/span&gt; Worked Example: PCSK9 Knockout Therapy&lt;/h1&gt;
&lt;p&gt;We now trace the complete &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; pipeline for a PCSK9 knockout therapy program. PCSK9 (Proprotein Convertase Subtilisin/Kexin Type 9) is a validated target for lowering LDL cholesterol; Verve Therapeutics’ VERVE-101 demonstrated clinical proof-of-concept for in vivo base editing of PCSK9 in humans &lt;span class=&quot;citation&quot; data-cites=&quot;verve2023&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
&lt;h2 data-number=&quot;11.1&quot; id=&quot;the-program&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.1&lt;/span&gt; The Program&lt;/h2&gt;
&lt;pre id=&quot;lst:pcsk9&quot; style=&quot;dnalangstyle&quot; data-caption=&quot;PCSK9 knockout therapy program in DNA-Lang{}.&quot; data-label=&quot;lst:pcsk9&quot;&gt;&lt;code&gt;program PCSK9_KO {
    -- Target identification
    target pcsk9 = &amp;quot;PCSK9&amp;quot;
    sequence ref_seq : DNA = lookup_sequence(pcsk9)

    -- Guide RNA design
    guide top_guide = design_guide(pcsk9, ref_seq)

    -- Biological constraints
    require no_off_targets
    require specificity &amp;gt;= 0.90
    require efficiency &amp;gt;= 0.70

    -- CRISPR editing
    edit ko_edit : Knockout = knockout(pcsk9, top_guide)

    -- Experimental setup
    cell_line hepg2 = select_cell_line(&amp;quot;HepG2&amp;quot;)
    assay ngs_assay = design_assay(ko_edit, hepg2)

    -- Execution
    run validate_safety(ko_edit)
    run run_assay(ngs_assay, hepg2)
    collect results = generate_report(ngs_assay, ko_edit)
}&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;11.2&quot; id=&quot;type-checking-trace&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.2&lt;/span&gt; Type Checking Trace&lt;/h2&gt;
&lt;p&gt;The type checker processes each declaration in order, building the type environment:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\Gamma_0 = \emptyset&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;target&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;pcsk9 = &quot;PCSK9&quot;&lt;/code&gt;: The string literal has type &lt;code&gt;String&lt;/code&gt;. The &lt;span class=&quot;smallcaps&quot;&gt;Target&lt;/span&gt; rule extends: &lt;span class=&quot;math inline&quot;&gt;\Gamma_1 = \Gamma_0[&lt;code&gt;pcsk9&lt;/code&gt; &amp;#8614; &lt;code&gt;Target&lt;/code&gt;]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;sequence&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;ref_seq : DNA = lookup_sequence(pcsk9)&lt;/code&gt;: The function &lt;code&gt;lookup_sequence&lt;/code&gt; has signature &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;Target&lt;/code&gt; \to &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle&lt;/span&gt;. Since &lt;span class=&quot;math inline&quot;&gt;&lt;code&gt;pcsk9&lt;/code&gt; : &lt;code&gt;Target&lt;/code&gt; \in \Gamma_1&lt;/span&gt;, the application type-checks. &lt;span class=&quot;math inline&quot;&gt;\Gamma_2 = \Gamma_1[&lt;code&gt;ref\_seq&lt;/code&gt; &amp;#8614; &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;guide&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;top_guide = design_guide(pcsk9, ref_seq)&lt;/code&gt;: The function &lt;code&gt;design_guide&lt;/code&gt; has signature &lt;span class=&quot;math inline&quot;&gt;(&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;Sequence&lt;/code&gt;\langle&lt;code&gt;DNA&lt;/code&gt;\rangle) \to &lt;code&gt;GuideRNA&lt;/code&gt;&lt;/span&gt;. Both arguments match. &lt;span class=&quot;math inline&quot;&gt;\Gamma_3 = \Gamma_2[&lt;code&gt;top\_guide&lt;/code&gt; &amp;#8614; &lt;code&gt;GuideRNA&lt;/code&gt;]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;no_off_targets&lt;/code&gt;: Structurally valid. &lt;span class=&quot;math inline&quot;&gt;\Gamma_4 = \Gamma_3&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;specificity &amp;gt;= 0.90&lt;/code&gt;: &lt;span class=&quot;math inline&quot;&gt;0 &amp;le; 0.90 &amp;le; 1&lt;/span&gt;. Valid. &lt;span class=&quot;math inline&quot;&gt;\Gamma_5 = \Gamma_4&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;efficiency &amp;gt;= 0.70&lt;/code&gt;: &lt;span class=&quot;math inline&quot;&gt;0 &amp;le; 0.70 &amp;le; 1&lt;/span&gt;. Valid. &lt;span class=&quot;math inline&quot;&gt;\Gamma_6 = \Gamma_5&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;edit&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;ko_edit : Knockout = knockout(pcsk9, top_guide)&lt;/code&gt;: The function &lt;code&gt;knockout&lt;/code&gt; has signature &lt;span class=&quot;math inline&quot;&gt;(&lt;code&gt;Target&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;) \to &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Knockout&lt;/code&gt;\rangle&lt;/span&gt;. Both arguments match. The declared kind &lt;code&gt;Knockout&lt;/code&gt; matches the return kind. &lt;span class=&quot;math inline&quot;&gt;\Gamma_7 = \Gamma_6[&lt;code&gt;ko\_edit&lt;/code&gt; &amp;#8614; &lt;code&gt;Edit&lt;/code&gt;\langle&lt;code&gt;Knockout&lt;/code&gt;\rangle]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;cell_line&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;hepg2 = select_cell_line(&quot;HepG2&quot;)&lt;/code&gt;: &lt;span class=&quot;math inline&quot;&gt;\Gamma_8 = \Gamma_7[&lt;code&gt;hepg2&lt;/code&gt; &amp;#8614; &lt;code&gt;CellLine&lt;/code&gt;]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;&lt;code&gt;assay&lt;/code&gt;&lt;/strong&gt; &lt;code&gt;ngs_assay = design_assay(ko_edit, hepg2)&lt;/code&gt;: &lt;span class=&quot;math inline&quot;&gt;\Gamma_9 = \Gamma_8[&lt;code&gt;ngs\_assay&lt;/code&gt; &amp;#8614; &lt;code&gt;Assay&lt;/code&gt;]&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Actions are checked similarly, verifying that all referenced variables are in scope and have compatible types. The final type environment is:&lt;/p&gt;
&lt;div class=&quot;center&quot;&gt;
&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Binding&lt;/strong&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;pcsk9&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;Target&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;ref_seq&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;Sequence&lt;/code&gt;&lt;span class=&quot;math inline&quot;&gt;\langle&lt;/span&gt;&lt;code&gt;DNA&lt;/code&gt;&lt;span class=&quot;math inline&quot;&gt;\rangle&lt;/span&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;top_guide&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;GuideRNA&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;ko_edit&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;Edit&lt;/code&gt;&lt;span class=&quot;math inline&quot;&gt;\langle&lt;/span&gt;&lt;code&gt;Knockout&lt;/code&gt;&lt;span class=&quot;math inline&quot;&gt;\rangle&lt;/span&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;hepg2&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;CellLine&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;ngs_assay&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;Assay&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;results&lt;/code&gt;&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;&lt;code&gt;Evidence&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;11.3&quot; id=&quot;compilation-output&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3&lt;/span&gt; Compilation Output&lt;/h2&gt;
&lt;p&gt;The compiler produces four artifacts:&lt;/p&gt;
&lt;h4 data-number=&quot;11.3.0.1&quot; id=&quot;design-artifact.&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3.0.1&lt;/span&gt; Design Artifact.&lt;/h4&gt;
&lt;p&gt;Contains the PCSK9 genomic locus coordinates (chr1:55,505,221–55,530,525, GRCh38), the reference sequence retrieved from NCBI, the designed guide RNA with NGG PAM site and scoring metrics, and the construct map for SpCas9 + guide expression cassette delivery.&lt;/p&gt;
&lt;h4 data-number=&quot;11.3.0.2&quot; id=&quot;ai-artifact.&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3.0.2&lt;/span&gt; AI Artifact.&lt;/h4&gt;
&lt;p&gt;Records the CRISPOR v4.99 invocation for guide scoring (specificity 0.93, efficiency 0.87), DeepCRISPR cross-validation, and the composite ranking that selected the top guide. Confidence is calibrated at 0.92 via Platt scaling.&lt;/p&gt;
&lt;h4 data-number=&quot;11.3.0.3&quot; id=&quot;experiment-artifact.&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3.0.3&lt;/span&gt; Experiment Artifact.&lt;/h4&gt;
&lt;p&gt;Specifies HepG2 cells (ATCC HB-8065, passage &lt;span class=&quot;math inline&quot;&gt;&amp;le; 20&lt;/span&gt;, mycoplasma-free), Lonza 4D electroporation for delivery, NGS amplicon sequencing at 72h post-transfection with &lt;span class=&quot;math inline&quot;&gt;&amp;ge; 10{,}000&amp;times;&lt;/span&gt; coverage, three biological replicates, positive control (safe harbor guide), negative control (scrambled guide), acceptance criteria (editing &lt;span class=&quot;math inline&quot;&gt;&amp;ge; 70\%&lt;/span&gt;, off-target &lt;span class=&quot;math inline&quot;&gt;&amp;lt; 1\%&lt;/span&gt;).&lt;/p&gt;
&lt;h4 data-number=&quot;11.3.0.4&quot; id=&quot;compliance-artifact.&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3.0.4&lt;/span&gt; Compliance Artifact.&lt;/h4&gt;
&lt;p&gt;Records the &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; compiler version, source code hash, type environment snapshot, all constraint verifications (all passed), model versions (CRISPOR v4.99, DeepCRISPR), BSL-2 classification, and the complete decision log.&lt;/p&gt;
&lt;h1 data-number=&quot;12&quot; id=&quot;sec:formal&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12&lt;/span&gt; Formal Properties&lt;/h1&gt;
&lt;p&gt;We state the key formal properties of &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt;. Full proofs are deferred to the appendix in a companion technical report.&lt;/p&gt;
&lt;h2 data-number=&quot;12.1&quot; id=&quot;type-safety&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.1&lt;/span&gt; Type Safety&lt;/h2&gt;
&lt;div id=&quot;thm:progress&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 22&lt;/strong&gt; (Type Safety — Progress).  &lt;em&gt;If &lt;span class=&quot;math inline&quot;&gt;\Gamma \vdash p : &lt;code&gt;Program&lt;/code&gt;&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt; is a well-typed &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; program, then either &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt; has completed (all declarations processed and all actions executed) or there exists a step &lt;span class=&quot;math inline&quot;&gt;p \to p&amp;#39;&lt;/span&gt; such that &lt;span class=&quot;math inline&quot;&gt;p&amp;#39;&lt;/span&gt; is defined.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:preservation&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 23&lt;/strong&gt; (Type Safety — Preservation).  &lt;em&gt;If &lt;span class=&quot;math inline&quot;&gt;\Gamma \vdash p : &lt;code&gt;Program&lt;/code&gt;&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;p \to p&amp;#39;&lt;/span&gt;, then there exists &lt;span class=&quot;math inline&quot;&gt;\Gamma&amp;#39;&lt;/span&gt; extending &lt;span class=&quot;math inline&quot;&gt;\Gamma&lt;/span&gt; such that &lt;span class=&quot;math inline&quot;&gt;\Gamma&amp;#39; \vdash p&amp;#39; : &lt;code&gt;Program&lt;/code&gt;&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The combination of progress and preservation guarantees that a well-typed &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; program never reaches an undefined state during execution. In biological terms: a type-checked program will never attempt to use a knockout edit where a base edit is required, pass a protein sequence to a function expecting DNA, or invoke an assay without a valid cell line.&lt;/p&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof sketch.&lt;/em&gt; Progress follows by case analysis on the next item to process. Each declaration form has a defined typing rule that produces an extended environment, and each action form has a defined execution semantics. Preservation follows by showing that each typing rule preserves the invariant that &lt;span class=&quot;math inline&quot;&gt;\Gamma&amp;#39;&lt;/span&gt; extends &lt;span class=&quot;math inline&quot;&gt;\Gamma&lt;/span&gt; and that the remaining items are well-typed in &lt;span class=&quot;math inline&quot;&gt;\Gamma&amp;#39;&lt;/span&gt;. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;12.2&quot; id=&quot;compilation-correctness&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.2&lt;/span&gt; Compilation Correctness&lt;/h2&gt;
&lt;div id=&quot;thm:compilation&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 24&lt;/strong&gt; (Compilation Correctness).  &lt;em&gt;For a well-typed program &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;, the compilation function &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt; produces four artifacts &lt;span class=&quot;math inline&quot;&gt;(\mathcal{D}, \mathcal{A}, \mathcal{E}, \mathcal{P})&lt;/span&gt; such that:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{D}&lt;/span&gt; (Design) contains a valid SBOL 3.0 document for every &lt;code&gt;Sequence&lt;/code&gt;, &lt;code&gt;GuideRNA&lt;/code&gt;, and &lt;code&gt;Edit&lt;/code&gt; declaration in &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{A}&lt;/span&gt; (AI) contains a provenance record for every AI service invocation in &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{E}&lt;/span&gt; (Experiment) contains an assay protocol for every &lt;code&gt;Assay&lt;/code&gt; declaration and &lt;strong&gt;&lt;code&gt;run&lt;/code&gt;&lt;/strong&gt; action in &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{P}&lt;/span&gt; (Compliance) contains a constraint verification for every &lt;strong&gt;&lt;code&gt;require&lt;/code&gt;&lt;/strong&gt; declaration in &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof sketch.&lt;/em&gt; By structural induction on the program’s declaration and action lists. Each declaration form has a corresponding compilation rule in each of the four artifact generators, and the compilation rules collectively cover all declaration forms. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;12.3&quot; id=&quot;provenance-completeness&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.3&lt;/span&gt; Provenance Completeness&lt;/h2&gt;
&lt;div id=&quot;thm:provenance&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 25&lt;/strong&gt; (Provenance Completeness).  &lt;em&gt;For every entry &lt;span class=&quot;math inline&quot;&gt;e&lt;/span&gt; in any artifact produced by &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}(p)&lt;/span&gt;, there exists a finite chain &lt;span class=&quot;math display&quot;&gt;e = e_n \leftarrow e_{n-1} \leftarrow &amp;middot;s \leftarrow e_1 \leftarrow e_0&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;e_0&lt;/span&gt; is a declaration or action in the source program &lt;span class=&quot;math inline&quot;&gt;p&lt;/span&gt;, and each &lt;span class=&quot;math inline&quot;&gt;\leftarrow&lt;/span&gt; represents a compilation or AI invocation step recorded in the compliance artifact.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;This theorem guarantees that no artifact entry is “orphaned”—every output can be traced back to a specific line in the source program.&lt;/p&gt;
&lt;h1 data-number=&quot;13&quot; id=&quot;sec:implementation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13&lt;/span&gt; Haskell Implementation&lt;/h1&gt;
&lt;p&gt;We provide a reference implementation of &lt;span class=&quot;smallcaps&quot;&gt;DNA-Lang&lt;/span&gt; in Haskell, chosen for its strong type system, algebraic data types, and pattern matching—all of which mirror the structure of the language specification.&lt;/p&gt;
&lt;h2 data-number=&quot;13.1&quot; id=&quot;module-architecture&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.1&lt;/span&gt; Module Architecture&lt;/h2&gt;
