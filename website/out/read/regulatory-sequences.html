 href=\"#sec:regulator-type\" data-reference-type=\"ref+label\" data-reference=\"sec:regulator-type\"\u003e5\u003c/a\u003e): The parametric \u003cspan class=\"math inline\"\u003e\u003ccode\u003eRegulator\u003c/code\u003e\\ensuremath{\\langle}a\\ensuremath{\\rangle}\u003c/span\u003e type unifies regulatory elements with an expression level lattice \u003cspan class=\"math inline\"\u003e\u003ccode\u003eOff\u003c/code\u003e \\sqsubseteq \u003ccode\u003eBasal\u003c/code\u003e \\sqsubseteq \u003ccode\u003eInduced\u003c/code\u003e(d) \\sqsubseteq \u003ccode\u003eMax\u003c/code\u003e\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGRN categories\u003c/strong\u003e (\u003ca href=\"#sec:grn-categories\" data-reference-type=\"ref+label\" data-reference=\"sec:grn-categories\"\u003e6\u003c/a\u003e): Gene regulatory networks form categories whose morphisms are regulatory effects, enabling compositional reasoning about network topology.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFeedback as fixed points\u003c/strong\u003e (\u003ca href=\"#sec:feedback\" data-reference-type=\"ref+label\" data-reference=\"sec:feedback\"\u003e7\u003c/a\u003e): Positive feedback yields bistable switches; negative feedback yields homeostatic controllers. These connect to the fixed-point semantics of programming languages.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eRegulatory completeness\u003c/strong\u003e (\u003ca href=\"#sec:completeness\" data-reference-type=\"ref+label\" data-reference=\"sec:completeness\"\u003e8\u003c/a\u003e): The four regulatory primitives (promoter, enhancer, silencer, insulator) form a complete control algebra—any computable expression-level function can be realized by their composition.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBoolean gene circuits\u003c/strong\u003e (\u003ca href=\"#sec:boolean-circuits\" data-reference-type=\"ref+label\" data-reference=\"sec:boolean-circuits\"\u003e9\u003c/a\u003e): Toggle switches, repressilators, and feed-forward loops are biological implementations of digital logic elements.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 data-number=\"11.2\" id=\"relation-to-the-modular-framework\"\u003e\u003cspan class=\"header-section-number\"\u003e11.2\u003c/span\u003e Relation to the Modular Framework\u003c/h2\u003e\n\u003cp\u003eThis paper establishes the second layer of the DNA-Lang modular framework. The regulatory layer composes with the coding sequence layer (Paper 1) through a clear interface: coding sequences define the functions, and regulatory sequences control when, where, and at what level those functions are invoked.\u003c/p\u003e\n\u003cp\u003eThe modular composition principle predicts emergent properties at each level:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLayer 1\u003c/strong\u003e (coding sequences): Individual protein functions.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLayer 2\u003c/strong\u003e (regulatory sequences, this paper): Gene expression programs—the ability to execute different subsets of functions in different contexts.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLayers 3–7\u003c/strong\u003e: Epigenetic memory, RNA-mediated regulation, genome architecture, chromatin structure, and developmental programs will add further layers of control.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEach layer builds upon the previous ones, and the emergent computational power of the full system exceeds the sum of its parts.\u003c/p\u003e\n\u003ch2 data-number=\"11.3\" id=\"biological-implications\"\u003e\u003cspan class=\"header-section-number\"\u003e11.3\u003c/span\u003e Biological Implications\u003c/h2\u003e\n\u003cp\u003eThe framework provides several insights for systems biology:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eRegulatory mutations as type errors\u003c/strong\u003e: Mutations in regulatory sequences can be classified as type errors in the control flow program. A mutation that destroys a TATA box is analogous to corrupting a function’s entry point; a mutation that creates a spurious enhancer binding site is analogous to an unintended environment variable binding.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDisease as control flow bugs\u003c/strong\u003e: Many diseases, particularly cancers, arise from regulatory disruptions rather than coding mutations. Our framework provides a vocabulary for classifying these disruptions: enhancer hijacking (misrouted configuration), silencer failure (access control breach), insulator disruption (namespace leak).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSynthetic biology design\u003c/strong\u003e: The algebraic framework provides a principled approach to designing synthetic gene circuits. The Regulatory Completeness Theorem guarantees that any desired expression program can be implemented using the four basic regulatory elements.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 data-number=\"11.4\" id=\"limitations-and-future-work\"\u003e\u003cspan class=\"header-section-number\"\u003e11.4\u003c/span\u003e Limitations and Future Work\u003c/h2\u003e\n\u003cp\u003eSeveral limitations should be noted:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003eThe current model treats regulatory effects as deterministic, while biological gene expression is inherently stochastic. A future extension should incorporate probabilistic types.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe expression level lattice \u003cspan class=\"math inline\"\u003e\\mathcal{L}\u003c/span\u003e is a simplification of the continuous range of possible expression levels. A more refined model would use interval types or measure-theoretic expressions.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe categorical framework assumes that regulatory effects compose cleanly, but in practice, epistatic interactions can violate this assumption. Higher-categorical structures (2-categories) may be needed to capture these interactions.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eTemporal dynamics are treated only implicitly through feedback loops. A full treatment requires temporal types or process algebra integration, which we defer to Paper 7 (developmental programs).\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 data-number=\"11.5\" id=\"conclusion\"\u003e\u003cspan class=\"header-section-number\"\u003e11.5\u003c/span\u003e Conclusion\u003c/h2\u003e\n\u003cp\u003eWe have shown that the regulatory sequences of eukaryotic genomes—promoters, enhancers, silencers, and insulators—admit a precise formalization as control flow primitives in a type-theoretic framework. The resulting \u003cspan class=\"math inline\"\u003e\u003ccode\u003eRegulator\u003c/code\u003e\\ensuremath{\\langle}a\\ensuremath{\\rangle}\u003c/span\u003e type, equipped with an expression level lattice and composed within a categorical structure, provides both a mathematical foundation for reasoning about gene regulation and a practical framework for designing synthetic gene circuits.\u003c/p\u003e\n\u003cp\u003eThe Regulatory Completeness Theorem establishes that these four primitives suffice to implement any computable expression-level function, paralleling the result in programming language theory that a small set of control flow primitives suffices for Turing completeness.\u003c/p\u003e\n\u003cp\u003eAs the second paper in the DNA-Lang series, this work establishes the control flow layer that will be composed modularly with subsequent layers—epigenetic marks, non-coding RNA, repetitive elements, structural DNA, and developmental programs—to build a complete computational model of the genome.\u003c/p\u003e\n\u003cdiv class=\"thebibliography\"\u003e\n\u003cp\u003e\u003cspan\u003e99\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eGardner, T.S., Cantor, C.R., and Collins, J.J. (2000). Construction of a genetic toggle switch in \u003cem\u003eEscherichia coli\u003c/em\u003e. \u003cem\u003eNature\u003c/em\u003e, 403(6767):339–342.\u003c/p\u003e\n\u003cp\u003eElowitz, M.B. and Leibler, S. (2000). A synthetic oscillatory network of transcriptional regulators. \u003cem\u003eNature\u003c/em\u003e, 403(6767):335–338.\u003c/p\u003e\n\u003cp\u003eAlon, U. (2007). \u003cem\u003eAn Introduction to Systems Biology: Design Principles of Biological Circuits\u003c/em\u003e. Chapman \u0026amp; Hall/CRC.\u003c/p\u003e\n\u003cp\u003ePtashne, M. and Gann, A. (2002). \u003cem\u003eGenes \u0026amp; Signals\u003c/em\u003e. Cold Spring Harbor Laboratory Press.\u003c/p\u003e\n\u003cp\u003eDavidson, E.H. (2006). \u003cem\u003eThe Regulatory Genome: Gene Regulatory Networks in Development and Evolution\u003c/em\u003e. Academic Press.\u003c/p\u003e\n\u003cp\u003eBarendregt, H.P. (1984). \u003cem\u003eThe Lambda Calculus: Its Syntax and Semantics\u003c/em\u003e. North-Holland.\u003c/p\u003e\n\u003cp\u003ePierce, B.C. (2002). \u003cem\u003eTypes and Programming Languages\u003c/em\u003e. MIT Press.\u003c/p\u003e\n\u003cp\u003eMoggi, E. (1991). Notions of computation and monads. \u003cem\u003eInformation and Computation\u003c/em\u003e, 93(1):55–92.\u003c/p\u003e\n\u003cp\u003eBarr, M. and Wells, C. (1990). \u003cem\u003eCategory Theory for Computing Science\u003c/em\u003e. Prentice Hall.\u003c/p\u003e\n\u003cp\u003eShen-Orr, S.S., Milo, R., Mangan, S., and Alon, U. (2002). Network motifs in the transcriptional regulation network of \u003cem\u003eEscherichia coli\u003c/em\u003e. \u003cem\u003eNature Genetics\u003c/em\u003e, 31(1):64–68.\u003c/p\u003e\n\u003cp\u003eLevine, M. (2010). Transcriptional enhancers in animal development and evolution. \u003cem\u003eCurrent Biology\u003c/em\u003e, 20(17):R754–R763.\u003c/p\u003e\n\u003cp\
