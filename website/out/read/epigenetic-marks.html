uman genes.\u003c/p\u003e\n\u003cp\u003eThe enzymes governing DNA methylation form two functional classes:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriters (DNMTs)\u003c/strong\u003e: DNA methyltransferases that catalyze the transfer of a methyl group from S-adenosylmethionine (SAM) to cytosine. DNMT3A and DNMT3B establish \u003cem\u003ede novo\u003c/em\u003e methylation patterns, while DNMT1 maintains existing patterns during DNA replication.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eErasers (TETs)\u003c/strong\u003e: Ten-eleven translocation enzymes (TET1, TET2, TET3) that oxidize 5-methylcytosine (5mC) to 5-hydroxymethylcytosine (5hmC), 5-formylcytosine (5fC), and 5-carboxylcytosine (5caC), leading to passive or active demethylation.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe intermediate oxidation states produced by TET enzymes are not merely degradation intermediates but carry their own regulatory significance. 5hmC is enriched at active enhancers and gene bodies of actively transcribed genes, while 5fC and 5caC are recognized by base-excision repair (BER) machinery for replacement with unmodified cytosine \u003cspan class=\"citation\" data-cites=\"tahiliani2009\"\u003e\u003c/span\u003e. This cascade of oxidation states can be modeled as a refinement of the binary methylation flag into a graded type:\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003ccode\u003eMethState\u003c/code\u003e = \u003ccode\u003eC\u003c/code\u003e \\mid \u003ccode\u003e5mC\u003c/code\u003e \\mid \u003ccode\u003e5hmC\u003c/code\u003e \\mid \u003ccode\u003e5fC\u003c/code\u003e \\mid \u003ccode\u003e5caC\u003c/code\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eFor the purposes of our primary framework, we collapse this to the binary \u003cspan class=\"math inline\"\u003e\\mathbb{B} = \\{\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003eMethylated\u003c/code\u003e\\}\u003c/span\u003e, noting that the graded version can be recovered as a refinement.\u003c/p\u003e\n\u003ch2 data-number=\"2.2\" id=\"formal-model-cpg-sites-as-boolean-flags\"\u003e\u003cspan class=\"header-section-number\"\u003e2.2\u003c/span\u003e Formal Model: CpG Sites as Boolean Flags\u003c/h2\u003e\n\u003cdiv id=\"def:cpg-config\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 1\u003c/strong\u003e (CpG Configuration Space).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003e\\mathcal{C} = \\{c_1, c_2, \u0026hellip;, c_N\\}\u003c/span\u003e be the set of CpG sites in genome \u003cspan class=\"math inline\"\u003e\\mathcal{G}\u003c/span\u003e, where \u003cspan class=\"math inline\"\u003eN \\approx 2.8 \u0026times; 10^7\u003c/span\u003e. The \u003cem\u003emethylation configuration\u003c/em\u003e of a cell is a function \u003cspan class=\"math display\"\u003e\\mu : \\mathcal{C} \\to \\mathbb{B} \\quad \\text{where } \\mathbb{B} = \\{\u003ccode\u003e0\u003c/code\u003e, \u003ccode\u003e1\u003c/code\u003e\\} = \\{\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003eMethylated\u003c/code\u003e\\}\u003c/span\u003e The \u003cem\u003emethylation configuration space\u003c/em\u003e is the product \u003cspan class=\"math inline\"\u003e\\mathbb{B}^{\\mathcal{C}} \\cong \\{0,1\\}^N\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cp\u003eThis is precisely the structure of a \u003cem\u003efeature-flag configuration\u003c/em\u003e in software systems. Each CpG site is a binary toggle, and the cell’s methylation profile is a point in the Boolean hypercube \u003cspan class=\"math inline\"\u003e\\{0,1\\}^N\u003c/span\u003e.\u003c/p\u003e\n\u003cdiv id=\"def:cpg-island\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 2\u003c/strong\u003e (CpG Island).  \u003cem\u003eA \u003cem\u003eCpG island\u003c/em\u003e is a contiguous genomic interval \u003cspan class=\"math inline\"\u003eI = [a, b] \\subset \\mathbb{N}\u003c/span\u003e satisfying:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eLength: \u003cspan class=\"math inline\"\u003eb - a \u0026ge; 500\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eGC content: \u003cspan class=\"math inline\"\u003e\\frac{|\\{i \\in I : \\mathcal{G}(i) \\in \\{G, C\\}\\}|}{|I|} \u0026ge; 0.5\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eObserved/expected CpG ratio: \u003cspan class=\"math inline\"\u003e\\frac{|\\textrm{CpG in } I| \u0026middot; |I|}{|\\textrm{C in } I| \u0026middot; |\\textrm{G in } I|} \u0026ge; 0.6\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cem\u003eThe set of CpG sites within island \u003cspan class=\"math inline\"\u003eI\u003c/span\u003e is \u003cspan class=\"math inline\"\u003e\\mathcal{C}_I = \\mathcal{C} \\cap I\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:cgi-toggle\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 3\u003c/strong\u003e (CGI Methylation as Module Toggle).  \u003cem\u003eFor a CpG island \u003cspan class=\"math inline\"\u003eI\u003c/span\u003e at the promoter of gene \u003cspan class=\"math inline\"\u003eg\u003c/span\u003e, the aggregate methylation \u003cspan class=\"math display\"\u003e\\bar{\\mu}_I = \\frac{1}{|\\mathcal{C}_I|} \\sum_{c \\in \\mathcal{C}_I} \\mu(c)\u003c/span\u003e acts as a soft toggle on gene expression. There exists a sigmoidal function \u003cspan class=\"math inline\"\u003e\\sigma\u003c/span\u003e such that \u003cspan class=\"math display\"\u003e\u003ccode\u003eExpression\u003c/code\u003e(g) \\approx \\sigma\\!\\left(\\alpha - \\beta \u0026middot; \\bar{\\mu}_I\\right)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\alpha\u003c/span\u003e captures basal transcription factor availability and \u003cspan class=\"math inline\"\u003e\\beta \u0026gt; 0\u003c/span\u003e is the methylation sensitivity coefficient. In the binary limit, \u003cspan class=\"math inline\"\u003e\\bar{\\mu}_I \\to 1\u003c/span\u003e implies \u003cspan class=\"math inline\"\u003e\u003ccode\u003eExpression\u003c/code\u003e(g) \\to 0\u003c/span\u003e (gene silenced) and \u003cspan class=\"math inline\"\u003e\\bar{\\mu}_I \\to 0\u003c/span\u003e implies \u003cspan class=\"math inline\"\u003e\u003ccode\u003eExpression\u003c/code\u003e(g) \\to \\sigma(\\alpha)\u003c/span\u003e (gene active, subject to other regulation).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"remark\"\u003e\n\u003cp\u003e\u003cstrong\u003eRemark 4\u003c/strong\u003e.  \u003cem\u003eThe analogy to software configuration is tight: in a microservice architecture, a feature flag \u003ccode\u003eENABLE_MODULE_X = false\u003c/code\u003e prevents the corresponding code path from executing, regardless of whether the code is present in the deployed binary. Similarly, promoter methylation prevents transcription regardless of whether transcription factors are available—the methyl groups recruit MBD (methyl-CpG-binding domain) proteins that in turn recruit histone deacetylase complexes, creating a repressive chromatin environment.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"2.3\" id=\"the-dnmttet-toggle-system\"\u003e\u003cspan class=\"header-section-number\"\u003e2.3\u003c/span\u003e The DNMT/TET Toggle System\u003c/h2\u003e\n\u003cdiv id=\"def:toggle-ops\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 5\u003c/strong\u003e (Methylation Toggle Operators).  \u003cem\u003eDefine operators on the configuration space \u003cspan class=\"math inline\"\u003e\\mathbb{B}^{\\mathcal{C}}\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\begin{align}\n    \u003ccode\u003eDNMT\u003c/code\u003e_S \u0026amp;: \\mathbb{B}^{\\mathcal{C}} \\to \\mathbb{B}^{\\mathcal{C}}, \\quad (\u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu))(c) = \\begin{cases} \u003ccode\u003e1\u003c/code\u003e \u0026amp; \\text{if } c \\in S \\\\ \\mu(c) \u0026amp; \\text{otherwise} \\end{cases} \\\\[6pt]\n    \u003ccode\u003eTET\u003c/code\u003e_S \u0026amp;: \\mathbb{B}^{\\mathcal{C}} \\to \\mathbb{B}^{\\mathcal{C}}, \\quad (\u003ccode\u003eTET\u003c/code\u003e_S(\\mu))(c) = \\begin{cases} \u003ccode\u003e0\u003c/code\u003e \u0026amp; \\text{if } c \\in S \\\\ \\mu(c) \u0026amp; \\text{otherwise} \\end{cases}\n\\end{align}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003eS \\subseteq \\mathcal{C}\u003c/span\u003e is the target site set determined by enzyme recruitment.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:idempotent\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 6\u003c/strong\u003e (Idempotence and Involution).  \u003cem\u003eThe toggle operators satisfy:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\u003ccode\u003eDNMT\u003c/code\u003e_S \\circ \u003ccode\u003eDNMT\u003c/code\u003e_S = \u003ccode\u003eDNMT\u003c/code\u003e_S\u003c/span\u003e (idempotent: methylating already-methylated sites is a no-op)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S \\circ \u003ccode\u003eTET\u003c/code\u003e_S = \u003ccode\u003eTET\u003c/code\u003e_S\u003c/span\u003e (idempotent)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S \\circ \u003ccode\u003eDNMT\u003c/code\u003e_S |_{\\mu \\equiv 0} = \\mathrm{id}\u003c/span\u003e (demethylating freshly methylated unmethylated sites restores the original state)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\u003ccode\u003eDNMT\u003c/code\u003e_S \\circ \u003ccode\u003eTET\u003c/code\u003e_S |_{\\mu \\equiv 1} = \\mathrm{id}\u003c/span\u003e (symmetric case)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e (i) follows directly: for \u003cspan class=\"math inline\"\u003ec \\in S\u003c/span\u003e, \u003cspan class=\"math inline\"\u003e(\u003ccode\u003eDNMT\u003c/code\u003e_S(\u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu)))(c) = 1 = (\u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu))(c)\u003c/span\u003e; for \u003cspan class=\"math inline\"\u003ec \\notin S\u003c/span\u003e, both applications leave \u003cspan class=\"math inline\"\u003e\\mu(c)\u003c/span\u003e unchanged. (ii) is symmetric. (iii): starting from \u003cspan class=\"math inline\"\u003e\\mu \\equiv 0\u003c/span\u003e, \u003cspan class=\"math inline\"\u003e\u003ccode\u003eDNMT\u003c/code\u003e_S\u003c/span\u003e sets all sites in \u003cspan class=\"math inline\"\u003eS\u003c/span\u003e to 1, then \u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S\u003c/span\u003e resets them to 0, recovering \u003cspan class=\"math inline\"\u003e\\mu \\equiv 0\u003c/span\u003e. (iv) is symmetric. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:galois\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 7\u003c/strong\u003e (DNMT/TET Galois Connection).  \u003cem\u003eThe operators \u003cspan class=\"math inline\"\u003e\u003ccode\u003eDNMT\u003c/code\u003e_S\u003c/span\u003e and \u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S\u003c/span\u003e form a Galois connection on the poset \u003cspan class=\"math inline\"\u003e(\\mathbb{B}^{\\mathcal{C}}, \u0026le;)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mu_1 \u0026le; \\mu_2\u003c/span\u003e iff \u003cspan class=\"math inline\"\u003e\\mu_1(c) \u0026le; \\mu_2(c)\u003c/span\u003e for all \u003cspan class=\"math inline\"\u003ec\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S(\\mu) \u0026le; \\mu\u0026#39; \\iff \\mu \u0026le; \u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu\u0026#39;)\u003c/span\u003e for all \u003cspan class=\"math inline\"\u003e\\mu, \\mu\u0026#39; \\in \\mathbb{B}^{\\mathcal{C}}\u003c/span\u003e and \u003cspan class=\"math inline\"\u003eS \\subseteq \\mathcal{C}\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e For \u003cspan class=\"math inline\"\u003ec \\in S\u003c/span\u003e: \u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S(\\mu)(c) = 0 \u0026le; \\mu\u0026#39;(c)\u003c/span\u003e always holds, and \u003cspan class=\"math inline\"\u003e\\mu(c) \u0026le; 1 = \u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu\u0026#39;)(c)\u003c/span\u003e always holds. For \u003cspan class=\"math inline\"\u003ec \\notin S\u003c/span\u003e: \u003cspan class=\"math inline\"\u003e\u003ccode\u003eTET\u003c/code\u003e_S(\\mu)(c) = \\mu(c) \u0026le; \\mu\u0026#39;(c)\u003c/span\u003e iff \u003cspan class=\"math inline\"\u003e\\mu(c) \u0026le; \\mu\u0026#39;(c) = \u003ccode\u003eDNMT\u003c/code\u003e_S(\\mu\u0026#39;)(c)\u003c/span\u003e. Both directions reduce to \u003cspan class=\"math inline\"\u003e\\mu(c) \u0026le; \\mu\u0026#39;(c)\u003c/span\u003e for \u003cspan class=\"math inline\"\u003ec \\notin S\u003c/span\u003e, establishing the equivalence. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"3\" id=\"sec:histone\"\u003e\u003cspan class=\"header-section-number\"\u003e3\u003c/span\u003e Histone Modifications as Access Permissions\u003c/h1\u003e\n\u003ch2 data-number=\"3.1\" id=\"the-histone-code\"\u003e\u003cspan class=\"header-section-number\"\u003e3.1\u003c/span\u003e The Histone Code\u003c/h2\u003e\n\u003cp\u003eEukaryotic DNA is packaged into chromatin by wrapping approximately 147 bp around histone octamers (two copies each of H2A, H2B, H3, H4). The N-terminal tails of histones protrude from the nucleosome core and are subject to a rich repertoire of post-translational modifications. We focus on four marks with well-established functional consequences:\u003c/p\u003e\n\u003cdiv id=\"def:histone-perms\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 8\u003c/strong\u003e (Histone Permission Bits).  \u003cem\u003eWe define a correspondence between histone modifications and Unix-style permission semantics:\u003c/em\u003e\u003c/p\u003e\n\u003cdiv class=\"center\"\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eMark\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003ePermission\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eUnix Analogue\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eBiological Effect\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eH3K4me3\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eExecute\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003e\u003ccode\u003echmod +x\u003c/code\u003e\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eActive promoter; enables transcriptional initiation by recruiting TFIID via TAF3\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eH3K27me3\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eNo-read\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003e\u003ccode\u003echmod -r\u003c/code\u003e\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003ePolycomb repression; PRC1/2-mediated silencing of developmental genes\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eH3K9me3\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eKernel lock\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003e\u003ccode\u003ering 0 only\u003c/code\u003e\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eConstitutive heterochromatin; HP1-mediated compaction at centromeres, telomeres, transposons\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eH3K27ac\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003ePublic read\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003e\u003ccode\u003echmod 644\u003c/code\u003e\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eActive enhancer/promoter; recruits BRD4 and Mediator complex\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cp\u003eThe analogy is more than superficial. In Unix systems, file permissions determine which processes can read, write, or execute a file. In the nucleus, histone modifications determine which enzymes—RNA polymerase (read/transcribe), chromatin remodelers (write/modify), and transcription factors (execute/initiate)—can access a genomic region. The enforcement mechanisms are also parallel: Unix permissions are enforced by the kernel at the system-call boundary, while histone modifications are “enforced” by the steric and electrostatic properties of modified nucleosomes, which physically block or permit enzyme access.\u003c/p\u003e\n\u003ch2 data-number=\"3.2\" id=\"the-permission-lattice\"\u003e\u003cspan class=\"header-section-number\"\u003e3.2\u003c/span\u003e The Permission Lattice\u003c/h2\u003e\n\u003cdiv id=\"def:perm-lattice\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 9\u003c/strong\u003e (Chromatin Permission Lattice).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003e\\mathcal{P}\u003c/span\u003e be the lattice of chromatin accessibility states ordered by increasing permissiveness: \u003cspan class=\"math display\"\u003e\u003ccode\u003eKernelLock\u003c/code\u003e \\sqsubset \u003ccode\u003eNoRead\u003c/code\u003e \\sqsubset \u003ccode\u003eDefault\u003c/code\u003e \\sqsubset \u003ccode\u003eExecutable\u003c/code\u003e \\sqsubset \u003ccode\u003ePublic\u003c/code\u003e\u003c/span\u003e with meet \u003cspan class=\"math inline\"\u003e\\sqcap\u003c/span\u003e and join \u003cspan class=\"math inline\"\u003e\\sqcup\u003c/span\u003e defined by: \u003cspan class=\"math display\"\u003e\\begin{align}\n    p \\sqcap q \u0026amp;= \\min(p, q) \\quad \\text{(most restrictive)} \\\\\n    p \\sqcup q \u0026amp;= \\max(p, q) \\quad \\text{(most permissive)}\n\\end{align}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cp\u003eThe lattice structure captures the biological reality that multiple marks can co-occur on the same or nearby nucleosomes, and that the effective accessibility is determined by the interplay of activating and repressive modifications.\u003c/p\u003e\n\u003cdiv id=\"thm:perm-compose\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 10\u003c/strong\u003e (Permission Composition).  \u003cem\u003eFor a genomic region \u003cspan class=\"math inline\"\u003eR\u003c/span\u003e bearing histone marks \u003cspan class=\"math inline\"\u003eM = \\{m_1, \u0026hellip;, m_k\\}\u003c/span\u003e with associated permissions \u003cspan class=\"math inline\"\u003ep(m_1), \u0026hellip;, p(m_k) \\in \\mathcal{P}\u003c/span\u003e, the effective accessibility is: \u003cspan class=\"math display\"\u003e\\mathrm{acc}(R) = \\bigsqcap_{i=1}^{k} p(m_i)\u003c/span\u003e That is, the most restrictive mark dominates, analogous to the principle of least privilege in capability-based security.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e We argue by biological mechanism. H3K9me3 (KernelLock) induces HP1-mediated phase separation into heterochromatin compartments, physically sequestering DNA from the transcriptional machinery regardless of other marks. Similarly, H3K27me3-mediated PRC1 recruitment leads to chromatin compaction (via H2AK119ub1) that overrides local activating marks. The meet operation \u003cspan class=\"math inline\"\u003e\\sqcap\u003c/span\u003e correctly models this dominance hierarchy. Formally, if \u003cspan class=\"math inline\"\u003e\u003ccode\u003eKernelLock\u003c/code\u003e \\in \\{p(m_i)\\}\u003c/span\u003e, then \u003cspan class=\"math inline\"\u003e\\bigsqcap_i p(m_i) = \u003ccode\u003eKernelLock\u003c/code\u003e\u003c/span\u003e regardless of other marks, matching the biological observation that H3K9me3-marked regions are transcriptionally inert even when artificially targeted with activators. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"3.3\" id=\"permission-transitions-as-morphisms\"\u003e\u003cspan class=\"header-section-number\"\u003e3.3\u003c/span\u003e Permission Transitions as Morphisms\u003c/h2\u003e\n\u003cdiv id=\"def:modifier-morphisms\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 11\u003c/strong\u003e (Histone Modifier Morphisms).  \u003cem\u003eEach histone-modifying enzyme defines a morphism in the category \u003cspan class=\"math inline\"\u003e\\mathbf{Perm}\u003c/span\u003e whose objects are elements of \u003cspan class=\"math inline\"\u003e\\mathcal{P}\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\begin{align}\n    \u003ccode\u003eEZH2\u003c/code\u003e \u0026amp;: \u003ccode\u003eDefault\u003c/code\u003e \\to \u003ccode\u003eNoRead\u003c/code\u003e \\quad \u0026amp;\\text{(PRC2 writer: deposits H3K27me3)} \\\\\n    \u003ccode\u003eKDM6A\u003c/code\u003e \u0026amp;: \u003ccode\u003eNoRead\u003c/code\u003e \\to \u003ccode\u003eDefault\u003c/code\u003e \\quad \u0026amp;\\text{(Polycomb eraser: removes H3K27me3)} \\\\\n    \u003ccode\u003eSET1A\u003c/code\u003e \u0026amp;: \u003ccode\u003eDefault\u003c/code\u003e \\to \u003ccode\u003eExecutable\u003c/code\u003e \\quad \u0026amp;\\text{(deposits H3K4me3)} \\\\\n    \u003ccode\u003eSUV39H1\u003c/code\u003e \u0026amp;: \u003ccode\u003eDefault\u003c/code\u003e \\to \u003ccode\u003eKernelLock\u003c/code\u003e \\quad \u0026amp;\\text{(deposits H3K9me3)} \\\\\n    \u003ccode\u003ep300\u003c/code\u003e \u0026amp;: \u003ccode\u003eDefault\u003c/code\u003e \\to \u003ccode\u003ePublic\u003c/code\u003e \\quad \u0026amp;\\text{(deposits H3K27ac)}\n\\end{align}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cp\u003eThese morphisms are not freely composable: biological constraints dictate that certain transitions require intermediate states. For instance, transitioning from \u003cspan class=\"math inline\"\u003e\u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e (H3K27me3) to \u003cspan class=\"math inline\"\u003e\u003ccode\u003ePublic\u003c/code\u003e\u003c/span\u003e (H3K27ac) at the same lysine (K27) requires first erasing the methyl mark: \u003cspan class=\"math display\"\u003e\u003ccode\u003eNoRead\u003c/code\u003e \\xrightarrow{\u003ccode\u003eKDM6A\u003c/code\u003e} \u003ccode\u003eDefault\u003c/code\u003e \\xrightarrow{\u003ccode\u003ep300\u003c/code\u003e} \u003ccode\u003ePublic\u003c/code\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cfigure id=\"fig:perm-transitions\" data-latex-placement=\"H\"\u003e\n\n\u003cfigcaption\u003ePermission transition diagram. Arrows represent histone-modifying enzymes acting as state-transition morphisms in \u003cspan class=\"math inline\"\u003e\\mathbf{Perm}\u003c/span\u003e. The Default state is the hub through which most transitions route.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003ch2 data-number=\"3.4\" id=\"capability-based-security-model\"\u003e\u003cspan class=\"header-section-number\"\u003e3.4\u003c/span\u003e Capability-Based Security Model\u003c/h2\u003e\n\u003cdiv id=\"def:capability\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 12\u003c/strong\u003e (Chromatin Capability).  \u003cem\u003eA \u003cem\u003echromatin capability\u003c/em\u003e is a triple \u003cspan class=\"math inline\"\u003e(\\ell, p, e)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e is a genomic locus, \u003cspan class=\"math inline\"\u003ep \\in \\mathcal{P}\u003c/span\u003e is the permission level, and \u003cspan class=\"math inline\"\u003ee\u003c/span\u003e is the evidence (specific histone marks) granting the capability. Capabilities are \u003cem\u003eunforgeable\u003c/em\u003e: a locus cannot claim a permission level it does not possess, because the histone marks are physically present on the nucleosome and are read by specific protein domains.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:delegation\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 13\u003c/strong\u003e (Capability Delegation).  \u003cem\u003eHistone mark spreading implements capability delegation. When PRC2 deposits H3K27me3 at a locus, it can “spread” the mark to neighboring nucleosomes via its EED subunit (which reads existing H3K27me3 and stimulates further writing). This is analogous to capability delegation in object-capability security: a process holding a capability can create copies and pass them to adjacent processes, but cannot forge capabilities it does not hold.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"4\" id=\"sec:state-type\"\u003e\u003cspan class=\"header-section-number\"\u003e4\u003c/span\u003e The \u003cspan class=\"math inline\"\u003e\u003ccode\u003eState\u003c/code\u003e\\langle\\mathcal{A}\\rangle\u003c/span\u003e Type\u003c/h1\u003e\n\u003cp\u003eWe now define the central type of our framework, which integrates DNA methylation and histone modifications into a unified accessibility descriptor.\u003c/p\u003e\n\u003cdiv id=\"def:acc-lattice\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 14\u003c/strong\u003e (Accessibility Lattice).  \u003cem\u003eThe \u003cem\u003eaccessibility lattice\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e is the product lattice \u003cspan class=\"math display\"\u003e\\mathcal{A} = \\mathbb{B} \u0026times; \\mathcal{P} \u0026times; \\mathcal{N}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathbb{B} = \\{\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003eMethylated\u003c/code\u003e\\}\u003c/span\u003e is the methylation status, \u003cspan class=\"math inline\"\u003e\\mathcal{P}\u003c/span\u003e is the permission lattice (\u003ca href=\"#def:perm-lattice\" data-reference-type=\"ref+Label\" data-reference=\"def:perm-lattice\"\u003e9\u003c/a\u003e), and \u003cspan class=\"math inline\"\u003e\\mathcal{N} = \\{\u003ccode\u003ePositioned\u003c/code\u003e, \u003ccode\u003eFree\u003c/code\u003e, \u003ccode\u003eRemodeled\u003c/code\u003e\\}\u003c/span\u003e is the nucleosome occupancy state, ordered \u003cspan class=\"math inline\"\u003e\u003ccode\u003ePositioned\u003c/code\u003e \\sqsubset \u003ccode\u003eRemodeled\u003c/code\u003e \\sqsubset \u003ccode\u003eFree\u003c/code\u003e\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:state-type\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 15\u003c/strong\u003e (The \u003cspan class=\"math inline\"\u003e\u003ccode\u003eState\u003c/code\u003e\\langle\\mathcal{A}\\rangle\u003c/span\u003e Type).  \u003cem\u003eFor a genomic locus \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e, the \u003cem\u003eepigenetic state type\u003c/em\u003e is: \u003cspan class=\"math display\"\u003e\u003ccode\u003eState\u003c/code\u003e\\langle\\mathcal{A}\\rangle(\\ell) = \\sum_{a : \\mathcal{A}} \\mathrm{Evidence}(\\ell, a)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathrm{Evidence}(\\ell, a)\u003c/span\u003e is the type of biochemical evidence (ChIP-seq peaks, bisulfite sequencing data, ATAC-seq signal) that locus \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e inhabits accessibility state \u003cspan class=\"math inline\"\u003ea\u003c/span\u003e. This is a \u003cem\u003edependent pair\u003c/em\u003e: the state and its witness.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:state-decide\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 16\u003c/strong\u003e (State Decidability).  \u003cem\u003eFor any locus \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e and accessibility state \u003cspan class=\"math inline\"\u003ea \\in \\mathcal{A}\u003c/span\u003e, the proposition \u003cspan class=\"math inline\"\u003e\\mathrm{Evidence}(\\ell, a)\u003c/span\u003e is decidable given sufficient experimental data. Formally, for each experimental assay \u003cspan class=\"math inline\"\u003e\\mathcal{E}\u003c/span\u003e with signal \u003cspan class=\"math inline\"\u003es_{\\mathcal{E}}(\\ell) \\in \\mathbb{R}\u003c/span\u003e, there exist thresholds \u003cspan class=\"math inline\"\u003e\\theta_{\\mathcal{E}}^-\u003c/span\u003e and \u003cspan class=\"math inline\"\u003e\\theta_{\\mathcal{E}}^+\u003c/span\u003e such that: \u003cspan class=\"math display\"\u003e\\mathrm{Evidence}(\\ell, a) \\simeq \\prod_{\\mathcal{E} \\in \\mathrm{Assays}(a)} \\left(s_{\\mathcal{E}}(\\ell) \u0026gt; \\theta_{\\mathcal{E}}^+\\right) \u0026times; \\prod_{\\mathcal{E}\u0026#39; \\in \\mathrm{AntiAssays}(a)} \\left(s_{\\mathcal{E}\u0026#39;}(\\ell) \u0026lt; \\theta_{\\mathcal{E}\u0026#39;}^-\\right)\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 17\u003c/strong\u003e (Fully Active Promoter).  \u003cem\u003eA fully active promoter has state \u003cspan class=\"math display\"\u003ea_{\\mathrm{active}} = (\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003ePublic\u003c/code\u003e, \u003ccode\u003eFree\u003c/code\u003e) \\in \\mathcal{A}\u003c/span\u003e with evidence comprising: low bisulfite signal (unmethylated), H3K27ac ChIP-seq peak (Public), and high ATAC-seq signal (nucleosome-free).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 18\u003c/strong\u003e (Polycomb-Silenced Locus).  \u003cem\u003eA Polycomb-silenced developmental gene has state \u003cspan class=\"math display\"\u003ea_{\\mathrm{PcG}} = (\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003eNoRead\u003c/code\u003e, \u003ccode\u003ePositioned\u003c/code\u003e) \\in \\mathcal{A}\u003c/span\u003e Note the CpG island remains unmethylated—Polycomb silencing and DNA methylation are mechanistically distinct and often mutually exclusive at CGI promoters.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 19\u003c/strong\u003e (Constitutive Heterochromatin).  \u003cem\u003ePericentromeric repeats and retrotransposons have state \u003cspan class=\"math display\"\u003ea_{\\mathrm{het}} = (\u003ccode\u003eMethylated\u003c/code\u003e, \u003ccode\u003eKernelLock\u003c/code\u003e, \u003ccode\u003ePositioned\u003c/code\u003e) = \\bot_{\\mathcal{A}}\u003c/span\u003e This represents the maximally repressed state, equivalent to kernel-only memory pages that are both encrypted (methylated) and locked.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:state-ordering\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 20\u003c/strong\u003e (State Ordering).  \u003cem\u003eThe product ordering on \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e induces a partial order on \u003cspan class=\"math inline\"\u003e\u003ccode\u003eState\u003c/code\u003e\\langle\\mathcal{A}\\rangle\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\u003ccode\u003eState\u003c/code\u003e\\langle a_1 \\rangle \u0026le; \u003ccode\u003eState\u003c/code\u003e\\langle a_2 \\rangle \\iff a_1 \\sqsubseteq a_2 \\text{ componentwise}\u003c/span\u003e The bottom element is \u003cspan class=\"math inline\"\u003e\\bot = (\u003ccode\u003eMethylated\u003c/code\u003e, \u003ccode\u003eKernelLock\u003c/code\u003e, \u003ccode\u003ePositioned\u003c/code\u003e)\u003c/span\u003e (completely silenced constitutive heterochromatin) and the top element is \u003cspan class=\"math inline\"\u003e\\top = (\u003ccode\u003eUnmethylated\u003c/code\u003e, \u003ccode\u003ePublic\u003c/code\u003e, \u003ccode\u003eFree\u003c/code\u003e)\u003c/span\u003e (maximally accessible active chromatin).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:acc-transcription\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 21\u003c/strong\u003e (Accessibility Determines Transcription).  \u003cem\u003eThere exists a monotone function \u003cspan class=\"math inline\"\u003e\\tau : \\mathcal{A} \\to [0,1]\u003c/span\u003e such that the transcriptional output of gene \u003cspan class=\"math inline\"\u003eg\u003c/span\u003e at locus \u003cspan class=\"math inline\"\u003e\\ell(g)\u003c/span\u003e satisfies: \u003cspan class=\"math display\"\u003e\u003ccode\u003eExpression\u003c/code\u003e(g) = \\tau\\!\\left(\u003ccode\u003eState\u003c/code\u003e\\langle\\mathcal{A}\\rangle(\\ell(g))\\right) \u0026middot; \\mathrm{TF}(g) \u0026middot; \\kappa(g)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathrm{TF}(g) \\in [0,1]\u003c/span\u003e represents transcription factor availability and \u003cspan class=\"math inline\"\u003e\\kappa(g) \\in \\mathbb{R}_{\u0026gt;0}\u003c/span\u003e is a gene-specific rate constant. Monotonicity of \u003cspan class=\"math inline\"\u003e\\tau\u003c/span\u003e means that higher accessibility always permits higher expression, all else being equal.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e Monotonicity in each component follows from the biological mechanisms: (i) unmethylated promoters have higher TF binding affinity than methylated ones; (ii) more permissive histone marks correlate with increased RNA Pol II occupancy (verified by ChIP-seq in ENCODE data); (iii) nucleosome-free regions have higher TF accessibility (verified by ATAC-seq/DNase-seq). The product order on \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e preserves monotonicity componentwise. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"cor:expr-bounds\" class=\"corollary\"\u003e\n\u003cp\u003e\u003cstrong\u003eCorollary 22\u003c/strong\u003e (Expression Bounds).  \u003cem\u003eFor any gene \u003cspan class=\"math inline\"\u003eg\u003c/span\u003e: \u003cspan class=\"math display\"\u003e0 = \\tau(\\bot) \u0026middot; \\mathrm{TF}(g) \u0026middot; \\kappa(g) \u0026le; \u003ccode\u003eExpression\u003c/code\u003e(g) \u0026le; \\tau(\\top) \u0026middot; \\mathrm{TF}(g) \u0026middot; \\kappa(g) = \\mathrm{TF}(g) \u0026middot; \\kappa(g)\u003c/span\u003e The lower bound is achieved at constitutive heterochromatin; the upper bound is achieved at maximally accessible loci where transcription is limited only by TF availability and intrinsic gene properties.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"5\" id=\"sec:state-machine\"\u003e\u003cspan class=\"header-section-number\"\u003e5\u003c/span\u003e Epigenetic State Machine\u003c/h1\u003e\n\u003ch2 data-number=\"5.1\" id=\"writereraserreader-classification\"\u003e\u003cspan class=\"header-section-number\"\u003e5.1\u003c/span\u003e Writer/Eraser/Reader Classification\u003c/h2\u003e\n\u003cp\u003eEpigenetic enzymes fall into three functional categories that correspond precisely to operations in a state machine:\u003c/p\u003e\n\u003cdiv id=\"def:epi-sm\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 23\u003c/strong\u003e (Epigenetic State Machine).  \u003cem\u003eThe \u003cem\u003eepigenetic state machine\u003c/em\u003e is a labeled transition system \u003cspan class=\"math inline\"\u003e\\mathcal{M} = (\\mathcal{A}, \\Sigma, \\delta, a_0)\u003c/span\u003e where:\u003c/em\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e is the set of accessibility states (\u003ca href=\"#def:acc-lattice\" data-reference-type=\"ref+Label\" data-reference=\"def:acc-lattice\"\u003e14\u003c/a\u003e)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\Sigma = \\Sigma_W \\cup \\Sigma_E \\cup \\Sigma_R\u003c/span\u003e is the alphabet of enzymatic actions, partitioned into Writers, Erasers, and Readers\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\delta : \\mathcal{A} \u0026times; \\Sigma \\to \\mathcal{A}\u003c/span\u003e is the transition function\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003ea_0 \\in \\mathcal{A}\u003c/span\u003e is the initial state (determined by cell lineage)\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cp\u003eThe three enzyme classes correspond to distinct state-machine operations:\u003c/p\u003e\n\u003cdiv id=\"def:writers\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 24\u003c/strong\u003e (Writer Enzymes).  \u003cem\u003eA \u003cem\u003ewriter\u003c/em\u003e \u003cspan class=\"math inline\"\u003ew \\in \\Sigma_W\u003c/span\u003e is a transition that deposits a mark, moving the system toward a specific target state: \u003cspan class=\"math display\"\u003e\\delta(a, w) = a[m_w \u0026#8614; 1]\u003c/span\u003e where \u003cspan class=\"math inline\"\u003em_w\u003c/span\u003e is the specific modification deposited by \u003cspan class=\"math inline\"\u003ew\u003c/span\u003e. Writers include: DNMT3A/B (de novo methylation), EZH2 (H3K27me3), SUV39H1/2 (H3K9me3), MLL/SET1 complexes (H3K4me3), and p300/CBP (H3K27ac).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:erasers\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 25\u003c/strong\u003e (Eraser Enzymes).  \u003cem\u003eAn \u003cem\u003eeraser\u003c/em\u003e \u003cspan class=\"math inline\"\u003ee \\in \\Sigma_E\u003c/span\u003e is a transition that removes a mark: \u003cspan class=\"math display\"\u003e\\delta(a, e) = a[m_e \u0026#8614; 0]\u003c/span\u003e Erasers include: TET1/2/3 (demethylation), KDM6A/UTX (H3K27me3 removal), KDM4A-D (H3K9me3 removal), KDM5A-D (H3K4me3 removal), and HDAC1-11 (deacetylation).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:readers\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 26\u003c/strong\u003e (Reader Enzymes).  \u003cem\u003eA \u003cem\u003ereader\u003c/em\u003e \u003cspan class=\"math inline\"\u003er \\in \\Sigma_R\u003c/span\u003e does not change state but queries the current state and produces an output signal: \u003cspan class=\"math display\"\u003e\\delta(a, r) = a \\quad \\text{and} \\quad \\mathrm{output}(a, r) = f_r(a)\u003c/span\u003e Readers include: MBD proteins (read methylation), HP1/Chromobox (read H3K9me3), Polycomb CBX subunits (read H3K27me3), PHD fingers (read H3K4me3), and BRD4/Bromodomains (read acetylation).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cfigure id=\"fig:state-machine\" data-latex-placement=\"H\"\u003e\n\n\u003cfigcaption\u003eEpigenetic state machine with four principal states. Writers and erasers define transitions; readers produce self-loops that query but do not alter state.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003ch2 data-number=\"5.2\" id=\"transition-composability\"\u003e\u003cspan class=\"header-section-number\"\u003e5.2\u003c/span\u003e Transition Composability\u003c/h2\u003e\n\u003cdiv id=\"thm:enzyme-compose\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 27\u003c/strong\u003e (Enzyme Composition).  \u003cem\u003eThe set of epigenetic transitions \u003cspan class=\"math inline\"\u003e\\Sigma\u003c/span\u003e generates a free monoid \u003cspan class=\"math inline\"\u003e\\Sigma^*\u003c/span\u003e under composition. However, not all compositions are biologically realizable. The \u003cem\u003eaccessible transition monoid\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\mathcal{T} \\subseteq \\Sigma^*\u003c/span\u003e is the submonoid generated by biologically co-occurring enzyme complexes. Specifically:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eWriters and erasers for the same mark at the same residue do not co-occur: \u003cspan class=\"math inline\"\u003ew_{K27me3} \u0026middot; e_{K27me3}\u003c/span\u003e is not in \u003cspan class=\"math inline\"\u003e\\mathcal{T}\u003c/span\u003e as a single step (requires sequential recruitment).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eCertain writers are synergistic: \u003cspan class=\"math inline\"\u003ew_{K4me3} \u0026middot; w_{K27ac}\u003c/span\u003e can co-occur (both are associated with active chromatin).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eReader-writer coupling is common: the reader output can recruit a writer, giving \u003cspan class=\"math inline\"\u003er \u0026middot; w\u003c/span\u003e transitions (\u003cem\u003ee.g.\u003c/em\u003e, BRD4 reading H3K27ac recruits P-TEFb for transcriptional elongation).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003cdiv id=\"cor:reachability\" class=\"corollary\"\u003e\n\u003cp\u003e\u003cstrong\u003eCorollary 28\u003c/strong\u003e (Chromatin State Reachability).  \u003cem\u003eFrom any state \u003cspan class=\"math inline\"\u003ea \\in \\mathcal{A}\u003c/span\u003e, the set of reachable states \u003cspan class=\"math inline\"\u003e\\mathrm{Reach}(a) = \\{a\u0026#39; \\mid \\exists \\sigma \\in \\mathcal{T} : \\delta^*(a, \\sigma) = a\u0026#39;\\}\u003c/span\u003e is a connected subgraph of the state space. In particular, \u003cspan class=\"math inline\"\u003e|\\mathrm{Reach}(a)| = |\\mathcal{A}|\u003c/span\u003e for all \u003cspan class=\"math inline\"\u003ea\u003c/span\u003e—every chromatin state is reachable from every other, given appropriate enzymatic signals, though some paths require more steps than others.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"5.3\" id=\"feedback-loops-and-fixed-points\"\u003e\u003cspan class=\"header-section-number\"\u003e5.3\u003c/span\u003e Feedback Loops and Fixed Points\u003c/h2\u003e\n\u003cdiv id=\"def:rw-feedback\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 29\u003c/strong\u003e (Reader-Writer Feedback).  \u003cem\u003eA \u003cem\u003ereader-writer feedback loop\u003c/em\u003e is a composition \u003cspan class=\"math inline\"\u003er \u0026middot; w\u003c/span\u003e where the reader \u003cspan class=\"math inline\"\u003er\u003c/span\u003e recognizes the mark deposited by writer \u003cspan class=\"math inline\"\u003ew\u003c/span\u003e, and the output of \u003cspan class=\"math inline\"\u003er\u003c/span\u003e stimulates further \u003cspan class=\"math inline\"\u003ew\u003c/span\u003e activity. Formally: \u003cspan class=\"math display\"\u003e\\mathrm{output}(a, r) = \\mathrm{stimulate}(w) \\implies \\delta^*(a, (r \u0026middot; w)^n) \\to a_{\\mathrm{fix}} \\text{ as } n \\to \u0026infin;\u003c/span\u003e where \u003cspan class=\"math inline\"\u003ea_{\\mathrm{fix}}\u003c/span\u003e is a fixed point of the feedback loop.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 30\u003c/strong\u003e (PRC2 Self-Reinforcement).  \u003cem\u003ePRC2 contains the reader subunit EED (reads H3K27me3) and the writer subunit EZH2 (deposits H3K27me3). The feedback loop \u003cspan class=\"math inline\"\u003er_{\\mathrm{EED}} \u0026middot; w_{\\mathrm{EZH2}}\u003c/span\u003e causes H3K27me3 to spread along the chromosome from an initial nucleation site, reaching a fixed point determined by boundary elements (CTCF/cohesin) or opposing active marks.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:fixed-point\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 31\u003c/strong\u003e (Fixed Point Existence).  \u003cem\u003eEvery reader-writer feedback loop on the finite lattice \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e has a fixed point, by the Knaster-Tarski theorem applied to the monotone composition \u003cspan class=\"math inline\"\u003e\\delta(-, r \u0026middot; w) : \\mathcal{A} \\to \\mathcal{A}\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"6\" id=\"sec:methylation-monad\"\u003e\u003cspan class=\"header-section-number\"\u003e6\u003c/span\u003e Methylation as Monad\u003c/h1\u003e\n\u003cp\u003eWe now develop the categorical structure of DNA methylation, showing that it naturally forms a monad on the functor of gene expression.\u003c/p\u003e\n\u003ch2 data-number=\"6.1\" id=\"the-expression-functor\"\u003e\u003cspan class=\"header-section-number\"\u003e6.1\u003c/span\u003e The Expression Functor\u003c/h2\u003e\n\u003cdiv id=\"def:cat-gene\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 32\u003c/strong\u003e (Category of Genomic Loci).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}\u003c/span\u003e be the category whose objects are genomic loci \u003cspan class=\"math inline\"\u003e\\ell \\in \\mathcal{G}\u003c/span\u003e and whose morphisms are regulatory interactions (\u003cem\u003ee.g.\u003c/em\u003e, enhancer-promoter contacts, insulator boundaries). Let \u003cspan class=\"math inline\"\u003e\\mathbf{Expr}\u003c/span\u003e be the category whose objects are expression levels in \u003cspan class=\"math inline\"\u003e[0, \u0026infin;)\u003c/span\u003e and whose morphisms are monotone functions.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:expr-functor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 33\u003c/strong\u003e (Expression Functor).  \u003cem\u003eThe \u003cem\u003eexpression functor\u003c/em\u003e \u003cspan class=\"math inline\"\u003eE : \\mathbf{Locus} \\to \\mathbf{Expr}\u003c/span\u003e maps each locus to its transcriptional output and each regulatory morphism to its effect on expression: \u003cspan class=\"math display\"\u003eE(\\ell) = \\text{mRNA level at locus } \\ell \\qquad E(f : \\ell_1 \\to \\ell_2) = \\text{regulatory influence of } \\ell_1 \\text{ on } \\ell_2\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"6.2\" id=\"the-methylation-endofunctor\"\u003e\u003cspan class=\"header-section-number\"\u003e6.2\u003c/span\u003e The Methylation Endofunctor\u003c/h2\u003e\n\u003cdiv id=\"def:meth-endo\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 34\u003c/strong\u003e (Methylation Endofunctor).  \u003cem\u003eDefine \u003cspan class=\"math inline\"\u003eM : \\mathbf{Locus} \\to \\mathbf{Locus}\u003c/span\u003e as the endofunctor that “views” each locus through its methylation state: \u003cspan class=\"math display\"\u003eM(\\ell) = (\\ell, \\mu(\\ell))\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mu(\\ell) \\in [0,1]\u003c/span\u003e is the average methylation level across CpG sites at locus \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e. On morphisms, \u003cspan class=\"math inline\"\u003eM\u003c/span\u003e preserves the regulatory graph structure but weights edges by the methylation compatibility of source and target.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:meth-monad\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 35\u003c/strong\u003e (Methylation Monad).  \u003cem\u003eThe triple \u003cspan class=\"math inline\"\u003e(M, \\eta, \\mu_M)\u003c/span\u003e forms a monad on \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}\u003c/span\u003e, where:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe \u003cem\u003eunit\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\eta : \\mathrm{Id}_{\\mathbf{Locus}} \u0026rArr; M\u003c/span\u003e corresponds to \u003cem\u003ede novo\u003c/em\u003e methylation by DNMT3A/B: \u003cspan class=\"math display\"\u003e\\eta_\\ell : \\ell \u0026#8614; (\\ell, \\mu_{\\mathrm{new}}(\\ell))\u003c/span\u003e This embeds a “bare” locus into the methylation context.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe \u003cem\u003emultiplication\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\mu_M : M \\circ M \u0026rArr; M\u003c/span\u003e corresponds to the resolution of layered methylation states: \u003cspan class=\"math display\"\u003e\\mu_{M,\\ell} : ((\\ell, \\mu_1), \\mu_2) \u0026#8614; (\\ell, \\mu_1 \u0026middot; \\mu_2)\u003c/span\u003e When methylation is applied twice (\u003cem\u003ee.g.\u003c/em\u003e, DNMT3A followed by DNMT3B acting on partially methylated substrate), the effective methylation is the combined level.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cem\u003eThe monad laws hold: \u003cspan class=\"math display\"\u003e\\begin{align}\n    \\mu_M \\circ M\\eta \u0026amp;= \\mathrm{id}_M \\quad \\text{(left unit)} \\\\\n    \\mu_M \\circ \\eta M \u0026amp;= \\mathrm{id}_M \\quad \\text{(right unit)} \\\\\n    \\mu_M \\circ M\\mu_M \u0026amp;= \\mu_M \\circ \\mu_M M \\quad \\text{(associativity)}\n\\end{align}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e We verify the monad laws. For left unit: applying de novo methylation (\u003cspan class=\"math inline\"\u003e\\eta\u003c/span\u003e) to an already-methylated locus \u003cspan class=\"math inline\"\u003eM(\\ell) = (\\ell, \\mu)\u003c/span\u003e and then resolving (\u003cspan class=\"math inline\"\u003e\\mu_M\u003c/span\u003e) yields \u003cspan class=\"math inline\"\u003e(\\ell, \\mu \u0026middot; 1) = (\\ell, \\mu) = M(\\ell)\u003c/span\u003e, where the unit acts as identity because DNMT3 does not alter already-methylated CpGs (it has strong preference for unmethylated or hemimethylated substrate). Right unit is symmetric. Associativity: \u003cspan class=\"math inline\"\u003eM\\mu_M\u003c/span\u003e first resolves the inner layer, then the outer, while \u003cspan class=\"math inline\"\u003e\\mu_M M\u003c/span\u003e first resolves the outer and then the inner; in both cases the result is \u003cspan class=\"math inline\"\u003e(\\ell, \\mu_1 \u0026middot; \\mu_2 \u0026middot; \\mu_3)\u003c/span\u003e since multiplication in \u003cspan class=\"math inline\"\u003e[0,1]\u003c/span\u003e is associative. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"6.3\" id=\"kleisli-category-of-methylation\"\u003e\u003cspan class=\"header-section-number\"\u003e6.3\u003c/span\u003e Kleisli Category of Methylation\u003c/h2\u003e\n\u003cdiv id=\"def:kleisli\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 36\u003c/strong\u003e (Kleisli Category).  \u003cem\u003eThe \u003cem\u003eKleisli category\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}_M\u003c/span\u003e has the same objects as \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}\u003c/span\u003e, but morphisms \u003cspan class=\"math inline\"\u003e\\ell_1 \\to \\ell_2\u003c/span\u003e in \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}_M\u003c/span\u003e are morphisms \u003cspan class=\"math inline\"\u003e\\ell_1 \\to M(\\ell_2)\u003c/span\u003e in \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}\u003c/span\u003e. A Kleisli morphism represents a regulatory interaction that may also alter methylation state—for example, a transcription factor binding event that recruits TET enzymes to demethylate a target locus.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:tet-counit\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 37\u003c/strong\u003e (TET as Comonad Extraction).  \u003cem\u003eThe TET enzymes define a natural transformation \u003cspan class=\"math inline\"\u003e\\varepsilon : M \u0026rArr; \\mathrm{Id}_{\\mathbf{Locus}}\u003c/span\u003e that extracts a locus from its methylation context: \u003cspan class=\"math display\"\u003e\\varepsilon_\\ell : (\\ell, \\mu) \u0026#8614; \\ell\u003c/span\u003e This is the counit of the adjunction between “embed in methylation context” and “strip methylation context.” Biologically, TET-mediated demethylation restores a locus to its “bare” state, enabling transcription factor access.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:kleisli-compose\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 38\u003c/strong\u003e (Kleisli Composition as Regulatory Cascades).  \u003cem\u003eKleisli composition in \u003cspan class=\"math inline\"\u003e\\mathbf{Locus}_M\u003c/span\u003e models regulatory cascades where methylation changes propagate. Given Kleisli morphisms \u003cspan class=\"math inline\"\u003ef : \\ell_1 \\to M(\\ell_2)\u003c/span\u003e and \u003cspan class=\"math inline\"\u003eg : \\ell_2 \\to M(\\ell_3)\u003c/span\u003e, their Kleisli composition is: \u003cspan class=\"math display\"\u003eg \\circ_K f = \\mu_M \\circ Mg \\circ f : \\ell_1 \\to M(\\ell_3)\u003c/span\u003e Biologically, this captures scenarios where activating one locus (via demethylation) leads to expression of a transcription factor that in turn modifies the methylation state of a downstream target.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cp\u003eThe following commutative diagram captures the monad structure:\u003c/p\u003e\n\u003cfigure id=\"fig:meth-monad\" data-latex-placement=\"H\"\u003e\n\n\u003cfigcaption\u003eCommutative diagram for the methylation monad. The expression functor \u003cspan class=\"math inline\"\u003eE\u003c/span\u003e factors through the methylation context via the counit \u003cspan class=\"math inline\"\u003e\\varepsilon\u003c/span\u003e.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003ch2 data-number=\"6.4\" id=\"the-eilenberg-moore-algebra\"\u003e\u003cspan class=\"header-section-number\"\u003e6.4\u003c/span\u003e The Eilenberg-Moore Algebra\u003c/h2\u003e\n\u003cdiv id=\"def:em-algebra\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 39\u003c/strong\u003e (Methylation Algebra).  \u003cem\u003eAn \u003cem\u003eEilenberg-Moore algebra\u003c/em\u003e for the methylation monad \u003cspan class=\"math inline\"\u003e(M, \\eta, \\mu_M)\u003c/span\u003e is a pair \u003cspan class=\"math inline\"\u003e(\\ell, h)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e is a locus and \u003cspan class=\"math inline\"\u003eh : M(\\ell) \\to \\ell\u003c/span\u003e is a structure map satisfying: \u003cspan class=\"math display\"\u003e\\begin{align}\n    h \\circ \\eta_\\ell \u0026amp;= \\mathrm{id}_\\ell \\quad \u0026amp;\\text{(methylating then interpreting is identity)} \\\\\n    h \\circ M(h) \u0026amp;= h \\circ \\mu_{M,\\ell} \\quad \u0026amp;\\text{(interpreting layered methylation is coherent)}\n\\end{align}\u003c/span\u003e Biologically, an algebra is a locus equipped with a “methylation response function” \u003cspan class=\"math inline\"\u003eh\u003c/span\u003e that determines how the locus responds to its methylation state. CpG island promoters are algebras where \u003cspan class=\"math inline\"\u003eh\u003c/span\u003e implements the silencing response; gene body CpGs are algebras where \u003cspan class=\"math inline\"\u003eh\u003c/span\u003e implements the (paradoxically) positive correlation between gene-body methylation and expression.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"7\" id=\"sec:gc\"\u003e\u003cspan class=\"header-section-number\"\u003e7\u003c/span\u003e Chromatin Remodeling as Garbage Collection\u003c/h1\u003e\n\u003ch2 data-number=\"7.1\" id=\"nucleosome-positioning-as-memory-allocation\"\u003e\u003cspan class=\"header-section-number\"\u003e7.1\u003c/span\u003e Nucleosome Positioning as Memory Allocation\u003c/h2\u003e\n\u003cp\u003eIn eukaryotic cells, DNA is packaged by wrapping around nucleosomes at semi-regular intervals of approximately 200 bp (147 bp of wrapped DNA plus \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e50 bp linker). This packaging restricts access to the underlying sequence, much as memory allocation and page tables restrict access to physical memory in an operating system.\u003c/p\u003e\n\u003cdiv id=\"def:nuc-map\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 40\u003c/strong\u003e (Nucleosome Occupancy Map).  \u003cem\u003eA \u003cem\u003enucleosome occupancy map\u003c/em\u003e is a function \u003cspan class=\"math inline\"\u003e\\nu : \\mathcal{G} \\to [0,1]\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\nu(i)\u003c/span\u003e represents the probability that base pair \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e is wrapped around a nucleosome across the cell population. A \u003cem\u003enucleosome-free region\u003c/em\u003e (NFR) is a maximal interval \u003cspan class=\"math inline\"\u003e[a,b]\u003c/span\u003e with \u003cspan class=\"math inline\"\u003e\\nu(i) \u0026lt; \\theta\u003c/span\u003e for all \u003cspan class=\"math inline\"\u003ei \\in [a,b]\u003c/span\u003e, analogous to a free memory block.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:remodel-gc\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 41\u003c/strong\u003e (Chromatin Remodeling as GC Operations).  \u003cem\u003eThe four major families of ATP-dependent chromatin remodelers correspond to garbage-collection strategies:\u003c/em\u003e\u003c/p\u003e\n\u003cdiv class=\"center\"\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eComplex\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eGC Analogue\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cem\u003e\u003cstrong\u003eMechanism\u003c/strong\u003e\u003c/em\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eSWI/SNF (BAF/PBAF)\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003e\u003ccode\u003efree()\u003c/code\u003e\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eEvicts nucleosomes from regulatory regions, creating NFRs for TF binding. Acts as a direct deallocator of chromatin “blocks.”\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eISWI (SMARCA5)\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eCompacting GC\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eSlides and spaces nucleosomes into regular arrays, analogous to memory compaction that consolidates free space.\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eCHD (Mi-2/NuRD)\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eMark-sweep GC\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eCouples remodeling to histone deacetylation; “marks” acetylated nucleosomes for repositioning, then “sweeps” them into repressive arrays.\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eINO80/SWR1\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eCopy collector\u003c/em\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cem\u003eExchanges canonical H2A for variant H2A.Z at promoters, analogous to copying live objects to new space while leaving dead objects behind.\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"7.2\" id=\"gc-accessibility-correspondence\"\u003e\u003cspan class=\"header-section-number\"\u003e7.2\u003c/span\u003e GC-Accessibility Correspondence\u003c/h2\u003e\n\u003cdiv id=\"thm:remodel-invariant\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 42\u003c/strong\u003e (Remodeling Preserves Accessibility Invariants).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003e\\rho : \\mathcal{N} \\to \\mathcal{N}\u003c/span\u003e be a remodeling operation. Then for any locus \u003cspan class=\"math inline\"\u003e\\ell\u003c/span\u003e with state \u003cspan class=\"math inline\"\u003e(\\beta, p, n) \\in \\mathcal{A}\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\rho((\\beta, p, n)) = (\\beta, p, \\rho(n))\u003c/span\u003e That is, remodeling modifies only the nucleosome component of the accessibility state, leaving methylation and histone marks invariant. This is analogous to the principle that garbage collection does not alter the \u003cem\u003evalues\u003c/em\u003e stored in memory, only their \u003cem\u003elayout\u003c/em\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e Chromatin remodelers are ATPases that translocate along DNA, disrupting histone-DNA contacts. They do not possess methyltransferase, demethylase, acetyltransferase, or deacetylase activity (with the notable exception of NuRD, which contains both CHD and HDAC subunits—we treat NuRD as a composite operation \u003cspan class=\"math inline\"\u003e\\rho_{\\mathrm{CHD}} \\circ e_{\\mathrm{HDAC}}\u003c/span\u003e that first erases acetylation and then remodels). Pure remodelers thus commute with the methylation and permission components of \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:swi-snf\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 43\u003c/strong\u003e (SWI/SNF as Arena Allocator).  \u003cem\u003eThe BAF (SWI/SNF) complex operates as an arena-style allocator at enhancers and promoters. Given a signal (\u003cem\u003ee.g.\u003c/em\u003e, pioneer transcription factor binding), BAF creates a contiguous nucleosome-free region: \u003cspan class=\"math display\"\u003e\u003ccode\u003eBAF\u003c/code\u003e(\\ell, k) : \\nu|_{[\\ell-k, \\ell+k]} \u0026#8614; 0\u003c/span\u003e where \u003cspan class=\"math inline\"\u003ek \\approx 150\\text{--}300\u003c/span\u003e bp. This “arena” is then available for transcription factor binding without further allocation overhead, analogous to bump-pointer allocation within a pre-allocated arena.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:stop-world\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 44\u003c/strong\u003e (Periodic Remodeling as Stop-the-World GC).  \u003cem\u003eDuring DNA replication, the passage of the replication fork disrupts all nucleosomes in its path, creating a transient state of complete chromatin disassembly. This is analogous to a stop-the-world garbage collection pause: normal transcriptional “execution” halts while the chromatin landscape is rebuilt behind the fork by histone chaperones (CAF-1, ASF1, HIRA). The rebuilt chromatin must faithfully reproduce the pre-replication epigenetic state—a requirement formalized in \u003ca href=\"#sec:inheritance\" data-reference-type=\"ref+Label\" data-reference=\"sec:inheritance\"\u003e9\u003c/a\u003e as state serialization.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"7.3\" id=\"fragmentation-and-defragmentation\"\u003e\u003cspan class=\"header-section-number\"\u003e7.3\u003c/span\u003e Fragmentation and Defragmentation\u003c/h2\u003e\n\u003cdiv id=\"def:fragmentation\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 45\u003c/strong\u003e (Chromatin Fragmentation).  \u003cem\u003eThe \u003cem\u003efragmentation index\u003c/em\u003e of a genomic region \u003cspan class=\"math inline\"\u003eR = [a, b]\u003c/span\u003e is: \u003cspan class=\"math display\"\u003e\\mathrm{Frag}(R) = 1 - \\frac{\\max_{[c,d] \\subseteq R, \\nu|_{[c,d]} \u0026lt; \\theta} (d - c)}{b - a}\u003c/span\u003e A fragmentation index near 1 indicates that free space (NFRs) is scattered in small pieces among positioned nucleosomes, making it difficult for large protein complexes to bind. ISWI remodelers reduce fragmentation by sliding nucleosomes into evenly spaced arrays, consolidating free space—exactly the operation of a compacting garbage collector.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:defrag\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 46\u003c/strong\u003e (Remodeling Reduces Fragmentation).  \u003cem\u003eFor the ISWI remodeling operation \u003cspan class=\"math inline\"\u003e\\rho_{\\mathrm{ISWI}}\u003c/span\u003e acting on region \u003cspan class=\"math inline\"\u003eR\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\mathrm{Frag}(\\rho_{\\mathrm{ISWI}}(R)) \u0026le; \\mathrm{Frag}(R)\u003c/span\u003e with equality iff \u003cspan class=\"math inline\"\u003eR\u003c/span\u003e is already in a regularly spaced configuration. The minimum fragmentation state is a perfect phased array with linker length \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e50 bp.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"8\" id=\"sec:bivalent\"\u003e\u003cspan class=\"header-section-number\"\u003e8\u003c/span\u003e Bivalent Chromatin as Type Superposition\u003c/h1\u003e\n\u003ch2 data-number=\"8.1\" id=\"biological-phenomenon\"\u003e\u003cspan class=\"header-section-number\"\u003e8.1\u003c/span\u003e Biological Phenomenon\u003c/h2\u003e\n\u003cp\u003eA remarkable discovery in stem cell biology is the existence of \u003cem\u003ebivalent chromatin domains\u003c/em\u003e—genomic regions that simultaneously carry the activating mark H3K4me3 and the repressive mark H3K27me3 \u003cspan class=\"citation\" data-cites=\"bernstein2006\"\u003e\u003c/span\u003e. These domains are found at the promoters of developmental transcription factors in embryonic stem cells (ESCs) and are thought to maintain genes in a “poised” state: silenced but ready for rapid activation or stable repression upon lineage commitment.\u003c/p\u003e\n\u003cp\u003eBivalent domains are not an artifact of population averaging: sequential ChIP (re-ChIP) experiments have confirmed that both marks co-occur on the same nucleosome \u003cspan class=\"citation\" data-cites=\"voigt2013\"\u003e\u003c/span\u003e. In the H3.3-containing nucleosomes found at bivalent promoters, H3K4me3 and H3K27me3 are present on different H3 tails within the same octamer, creating an asymmetrically modified nucleosome.\u003c/p\u003e\n\u003ch2 data-number=\"8.2\" id=\"type-theoretic-formalization\"\u003e\u003cspan class=\"header-section-number\"\u003e8.2\u003c/span\u003e Type-Theoretic Formalization\u003c/h2\u003e\n\u003cdiv id=\"def:bivalent\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 47\u003c/strong\u003e (Bivalent Type).  \u003cem\u003eA \u003cem\u003ebivalent chromatin state\u003c/em\u003e is an element of the product type: \u003cspan class=\"math display\"\u003e\u003ccode\u003eBivalent\u003c/code\u003e= \u003ccode\u003eExecutable\u003c/code\u003e \u0026times; \u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e This product type is well-formed in our type system but appears contradictory: a locus is simultaneously marked for execution (H3K4me3) and denied read access (H3K27me3). We resolve this by interpreting \u003cspan class=\"math inline\"\u003e\u003ccode\u003eBivalent\u003c/code\u003e\u003c/span\u003e not as a specification of current behavior but as a \u003cem\u003esuperposition\u003c/em\u003e of potential future states.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:bivalent-resolve\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 48\u003c/strong\u003e (Bivalent Resolution).  \u003cem\u003eUpon lineage commitment, the bivalent product type resolves to a sum type via the natural transformation \u003cspan class=\"math inline\"\u003e\\rho : \u003ccode\u003eBivalent\u003c/code\u003e\\to \u003ccode\u003eExecutable\u003c/code\u003e + \u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\rho(\u003ccode\u003eExecutable\u003c/code\u003e, \u003ccode\u003eNoRead\u003c/code\u003e) = \\begin{cases}\n        \\iota_1(\u003ccode\u003eExecutable\u003c/code\u003e) \u0026amp; \\text{if lineage requires gene activation} \\\\\n        \\iota_2(\u003ccode\u003eNoRead\u003c/code\u003e) \u0026amp; \\text{if lineage requires gene silencing}\n    \\end{cases}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\iota_1, \\iota_2\u003c/span\u003e are the sum-type injections. This resolution is:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eIrreversible\u003c/strong\u003e: once resolved, returning to the bivalent state requires reprogramming (corresponding to induced pluripotency).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eContext-dependent\u003c/strong\u003e: the resolution direction depends on the cell’s signaling environment.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eEntropy-increasing\u003c/strong\u003e: the bivalent state has lower entropy (one state) than the sum type (two possible states weighted by lineage probability).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e (i) Irreversibility follows from the stability of resolved chromatin states: once H3K27me3 is removed and H3K27ac is deposited (activation), the positive feedback loop between transcription and active histone marks maintains the active state. Conversely, once H3K4me3 is removed and DNA methylation is established (permanent silencing), the DNMT1 maintenance pathway preserves the silent state across cell divisions. Returning to bivalency requires simultaneous re-establishment of both marks, which occurs naturally only during epigenetic reprogramming events (fertilization, iPSC generation).\u003c/p\u003e\n\u003cp\u003e(ii) The signaling environment determines which resolution pathway is followed. For example, retinoic acid signaling activates the KDM6A demethylase (removing H3K27me3) at Hox gene promoters, resolving the bivalent state to \u003cspan class=\"math inline\"\u003e\u003ccode\u003eExecutable\u003c/code\u003e\u003c/span\u003e. In contrast, differentiation signals that do not activate Hox genes allow PRC2 to spread H3K27me3, resolving to \u003cspan class=\"math inline\"\u003e\u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003e(iii) The entropic argument: the bivalent state \u003cspan class=\"math inline\"\u003e\u003ccode\u003eBivalent\u003c/code\u003e= \u003ccode\u003eExec\u003c/code\u003e \u0026times; \u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e is a single point in \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e, while \u003cspan class=\"math inline\"\u003e\u003ccode\u003eExec\u003c/code\u003e + \u003ccode\u003eNoRead\u003c/code\u003e\u003c/span\u003e has two inhabitants, each associated with a distinct lineage. The Shannon entropy \u003cspan class=\"math inline\"\u003eH = -\\sum p_i \\log p_i\u003c/span\u003e of the resolved sum type exceeds zero whenever both lineages have nonzero probability. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003cfigure id=\"fig:bivalent-resolve\" data-latex-placement=\"H\"\u003e\n\n\u003cfigcaption\u003eResolution of bivalent chromatin. The product type in ESCs resolves to one of two sum-type branches upon lineage commitment, followed by further stabilization.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003ch2 data-number=\"8.3\" id=\"bivalent-domains-as-quantum-like-superposition\"\u003e\u003cspan class=\"header-section-number\"\u003e8.3\u003c/span\u003e Bivalent Domains as Quantum-Like Superposition\u003c/h2\u003e\n\u003cdiv class=\"remark\"\u003e\n\u003cp\u003e\u003cstrong\u003eRemark 49\u003c/strong\u003e.  \u003cem\u003eThe analogy to quantum superposition is suggestive but not literal. In quantum mechanics, a superposition \u003cspan class=\"math inline\"\u003e|\\psi\\rangle = \\alpha|0\\rangle + \\beta|1\\rangle\u003c/span\u003e collapses upon measurement. Bivalent chromatin is not a superposition in the quantum-mechanical sense (the marks physically coexist on the same nucleosome, as verified by sequential ChIP), but it shares the computational feature of \u003cem\u003edeferred choice\u003c/em\u003e: the system maintains multiple potential futures and selects among them upon “observation” (differentiation signal). This is precisely a \u003cem\u003elazy product\u003c/em\u003e that is forced into a \u003cem\u003estrict sum\u003c/em\u003e by the environment.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:biv-functor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 50\u003c/strong\u003e (Bivalent Functor).  \u003cem\u003eThe \u003cem\u003ebivalent functor\u003c/em\u003e \u003cspan class=\"math inline\"\u003eB : \\mathbf{Stem} \\to \\mathbf{Committed}\u003c/span\u003e maps stem-cell chromatin states to committed-cell chromatin states: \u003cspan class=\"math display\"\u003eB(\u003ccode\u003eBivalent\u003c/code\u003e(\\ell)) = \\begin{cases}\n        \u003ccode\u003eActive\u003c/code\u003e(\\ell) \u0026amp; \\text{if } \\ell \\in \\mathrm{ActiveGenes}(\\mathrm{lineage}) \\\\\n        \u003ccode\u003eSilent\u003c/code\u003e(\\ell) \u0026amp; \\text{otherwise}\n    \\end{cases}\u003c/span\u003e This functor is not deterministic from the stem cell’s perspective—it requires the lineage specification as a parameter, making it a \u003cem\u003eparameterized\u003c/em\u003e functor \u003cspan class=\"math inline\"\u003eB(-, L) : \\mathbf{Stem} \u0026times; \\mathbf{Lineage} \\to \\mathbf{Committed}\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"lem:biv-count\" class=\"lemma\"\u003e\n\u003cp\u003e\u003cstrong\u003eLemma 51\u003c/strong\u003e (Bivalent Domain Count).  \u003cem\u003eIn mouse embryonic stem cells, approximately 2,500–3,000 gene promoters are bivalent, comprising roughly 12–15% of all RefSeq gene promoters. These are overwhelmingly enriched for transcription factors involved in lineage specification (homeobox, T-box, HLH, zinc finger families). The resolution of these \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e3,000 bivalent domains during differentiation into \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e200 distinct cell types implements a combinatorial cell-fate program, where the number of possible resolution patterns is \u003cspan class=\"math inline\"\u003e2^{3000}\u003c/span\u003e but the number of biologically realized patterns is \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e200.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"9\" id=\"sec:inheritance\"\u003e\u003cspan class=\"header-section-number\"\u003e9\u003c/span\u003e Epigenetic Inheritance as State Serialization\u003c/h1\u003e\n\u003ch2 data-number=\"9.1\" id=\"the-maintenance-problem\"\u003e\u003cspan class=\"header-section-number\"\u003e9.1\u003c/span\u003e The Maintenance Problem\u003c/h2\u003e\n\u003cp\u003eWhen a cell divides, its DNA is replicated, but the epigenetic marks on the parent DNA strands are not automatically copied to the daughter strands. This creates a \u003cem\u003estate serialization problem\u003c/em\u003e: the cell must faithfully reconstruct its epigenetic state on newly synthesized chromatin.\u003c/p\u003e\n\u003cdiv id=\"def:serialization\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 52\u003c/strong\u003e (Epigenetic Serialization).  \u003cem\u003eThe \u003cem\u003eepigenetic serialization\u003c/em\u003e of a cell with genome \u003cspan class=\"math inline\"\u003e\\mathcal{G}\u003c/span\u003e and state function \u003cspan class=\"math inline\"\u003es : \\mathcal{G} \\to \\mathcal{A}\u003c/span\u003e is the encoding: \u003cspan class=\"math display\"\u003e\\mathrm{Serialize}(s) = \\{(\\ell, s(\\ell)) \\mid \\ell \\in \\mathcal{G}\\}\u003c/span\u003e The \u003cem\u003edeserialization\u003c/em\u003e problem is to reconstruct \u003cspan class=\"math inline\"\u003es\u003c/span\u003e from partial information available on the daughter chromosomes after replication.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"9.2\" id=\"dnmt1-as-checkpoint-serializer\"\u003e\u003cspan class=\"header-section-number\"\u003e9.2\u003c/span\u003e DNMT1 as Checkpoint Serializer\u003c/h2\u003e\n\u003cdiv id=\"thm:dnmt1\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 53\u003c/strong\u003e (DNMT1 Maintenance Methylation).  \u003cem\u003eThe maintenance methyltransferase DNMT1 implements a faithful serialization protocol for the methylation component of \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e. Specifically, DNMT1 is recruited to the replication fork via its interaction with UHRF1 (which recognizes hemimethylated CpG sites) and copies the methylation pattern from the parent strand to the daughter strand: \u003cspan class=\"math display\"\u003e\\mathrm{DNMT1} : \\mathbb{B}^{\\mathcal{C}}_{\\mathrm{parent}} \\to \\mathbb{B}^{\\mathcal{C}}_{\\mathrm{daughter}}\u003c/span\u003e with fidelity \u003cspan class=\"math inline\"\u003e\\mathrm{Pr}[\\mu_{\\mathrm{daughter}}(c) = \\mu_{\\mathrm{parent}}(c)] \u0026ge; 0.95\u003c/span\u003e per CpG site per replication cycle \u003cspan class=\"citation\" data-cites=\"smith2013\"\u003e\u003c/span\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e The mechanism is as follows. Prior to replication, a CpG site is either fully methylated (both strands) or fully unmethylated. After replication, a methylated site becomes \u003cem\u003ehemimethylated\u003c/em\u003e: the parent strand retains its methyl group, but the daughter strand is unmethylated. UHRF1 specifically binds hemimethylated CpGs and recruits DNMT1, which then methylates the daughter-strand cytosine. The error rate of \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e5% per site per division is co
