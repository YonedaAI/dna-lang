\u003e\u003cem\u003eThe type system enforces: \u003cspan class=\"math display\"\u003e\\text{siRNA} \u0026lt;: \\text{miRNA}\u003c/span\u003e in the sense that siRNA-mediated cleavage is a \u003cem\u003estrict\u003c/em\u003e subcase of miRNA-mediated repression.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"3.2\" id=\"the-exception-hierarchy\"\u003e\u003cspan class=\"header-section-number\"\u003e3.2\u003c/span\u003e The Exception Hierarchy\u003c/h2\u003e\n\u003cp\u003eWe organize the RNAi-related exceptions into a type hierarchy:\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\\begin{tikzcd}[column sep=small]\n  \u0026amp; \\mathsf{RNAException} \\arrow[dl] \\arrow[dr] \u0026amp; \\\\\n  \\mathsf{SiRNAException} \\arrow[d] \u0026amp; \u0026amp; \\mathsf{MiRNAException} \\arrow[d] \\\\\n  \\mathsf{ViralDefense} \u0026amp; \u0026amp; \\mathsf{TranslationalRepression}\n\\end{tikzcd}\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eThis hierarchy ensures that handlers for general \u003cspan class=\"math inline\"\u003e\\mathsf{RNAException}\u003c/span\u003e can catch both siRNA- and miRNA-generated signals, while specialized handlers can discriminate.\u003c/p\u003e\n\u003ch1 data-number=\"4\" id=\"sec:lncrna\"\u003e\u003cspan class=\"header-section-number\"\u003e4\u003c/span\u003e lncRNA as Middleware and Scaffolds\u003c/h1\u003e\n\u003cp\u003eLong non-coding RNAs (lncRNAs) are transcripts exceeding 200 nucleotides that do not encode proteins. Their functions are extraordinarily diverse: they act as scaffolds for chromatin-modifying complexes (e.g., HOTAIR, Xist), as decoys sequestering transcription factors or miRNAs, as guides recruiting regulatory complexes to specific genomic loci, and as enhancer-derived transcripts (eRNAs) facilitating gene activation.\u003c/p\u003e\n\u003ch2 data-number=\"4.1\" id=\"the-middleware-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e4.1\u003c/span\u003e The Middleware Interpretation\u003c/h2\u003e\n\u003cp\u003eIn software architecture, \u003cem\u003emiddleware\u003c/em\u003e is software that sits between the operating system and applications, providing services such as message passing, authentication, transaction management, and resource brokering. LncRNAs play an analogous role in the cell.\u003c/p\u003e\n\u003cdiv id=\"def:lncrna-middleware\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 8\u003c/strong\u003e (lncRNA Middleware).  An \u003cem\u003elncRNA middleware\u003c/em\u003e is a tuple \u003cspan class=\"math inline\"\u003e\\mu = (l, B, \\phi, \\psi)\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003el\u003c/span\u003e is the lncRNA transcript (the middleware module),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eB = \\{b_1, \u0026hellip;, b_n\\}\u003c/span\u003e is a set of \u003cem\u003ebinding partners\u003c/em\u003e (proteins, other RNAs, or DNA loci),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\phi : l \\to 2^B\u003c/span\u003e is the \u003cem\u003ebinding function\u003c/em\u003e mapping structural domains of \u003cspan class=\"math inline\"\u003el\u003c/span\u003e to subsets of binding partners,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\psi : 2^B \\to \\mathsf{Effect}\u003c/span\u003e is the \u003cem\u003eeffector function\u003c/em\u003e mapping assembled complexes to downstream effects.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cp\u003eThe composition \u003cspan class=\"math inline\"\u003e\\psi \\circ \\phi\u003c/span\u003e maps lncRNA structural features directly to biological effects, with the lncRNA serving as the \u003cem\u003emiddleware\u003c/em\u003e that mediates between signal and response.\u003c/p\u003e\n\u003ch2 data-number=\"4.2\" id=\"the-scaffold-as-categorical-colimit\"\u003e\u003cspan class=\"header-section-number\"\u003e4.2\u003c/span\u003e The Scaffold as Categorical Colimit\u003c/h2\u003e\n\u003cp\u003eWhen a lncRNA assembles multiple proteins into a functional complex, it is computing a \u003cem\u003ecolimit\u003c/em\u003e in the category of molecular assemblies.\u003c/p\u003e\n\u003cdiv id=\"def:assembly-diagram\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 9\u003c/strong\u003e (Assembly Diagram).  Let \u003cspan class=\"math inline\"\u003e\\mathcal{C}\u003c/span\u003e be the category whose objects are molecular species (proteins, RNAs, DNA loci) and whose morphisms are binding interactions. An \u003cem\u003eassembly diagram\u003c/em\u003e for a lncRNA scaffold \u003cspan class=\"math inline\"\u003el\u003c/span\u003e is a functor \u003cspan class=\"math inline\"\u003eD : J \\to \\mathcal{C}\u003c/span\u003e from a small indexing category \u003cspan class=\"math inline\"\u003eJ\u003c/span\u003e (encoding the combinatorics of binding) to \u003cspan class=\"math inline\"\u003e\\mathcal{C}\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 10\u003c/strong\u003e (HOTAIR Scaffold).  The lncRNA HOTAIR binds PRC2 at its 5\u003cspan class=\"math inline\"\u003e\u0026#39;\u003c/span\u003e end and the LSD1/CoREST/REST complex at its 3\u003cspan class=\"math inline\"\u003e\u0026#39;\u003c/span\u003e end, bridging two chromatin modification activities. The assembly diagram is: \u003cspan class=\"math display\"\u003e\\begin{tikzcd}\n  \\text{PRC2} \u0026amp; \\text{HOTAIR} \\arrow[l, \u0026quot;\\phi_1\u0026quot;\u0026#39;] \\arrow[r, \u0026quot;\\phi_2\u0026quot;] \u0026amp;\n  \\text{LSD1/CoREST}\n\\end{tikzcd}\u003c/span\u003e The scaffold colimit is the assembled complex \u003cspan class=\"math inline\"\u003e\\text{PRC2--HOTAIR--LSD1/CoREST}\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"4.3\" id=\"functional-classification-of-lncrna-middleware\"\u003e\u003cspan class=\"header-section-number\"\u003e4.3\u003c/span\u003e Functional Classification of lncRNA Middleware\u003c/h2\u003e\n\u003cdiv id=\"tab:lncrna-roles\"\u003e\n\u003ctable\u003e\n\u003ccaption\u003elncRNA middleware roles and their software analogues.\u003c/caption\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cstrong\u003elncRNA Role\u003c/strong\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cstrong\u003eExample\u003c/strong\u003e\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e\u003cstrong\u003eSoftware Analogue\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eScaffold\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eHOTAIR\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eService bus / message broker\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eGuide\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eXist\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eRouter / request dispatcher\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eDecoy\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003ePTENP1\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eLoad balancer / circuit breaker\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eEnhancer\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eeRNAs\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eEvent-driven middleware\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eSponge\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003ecircRNAs\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eRate limiter\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"5\" id=\"sec:trna\"\u003e\u003cspan class=\"header-section-number\"\u003e5\u003c/span\u003e tRNA as Natural Transformation\u003c/h1\u003e\n\u003cp\u003eTransfer RNAs (tRNAs) are the molecular adaptors that decode the genetic code during translation. Each tRNA carries an amino acid and presents an anticodon complementary to a specific mRNA codon.\u003c/p\u003e\n\u003ch2 data-number=\"5.1\" id=\"the-natural-transformation-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e5.1\u003c/span\u003e The Natural Transformation Interpretation\u003c/h2\u003e\n\u003cdiv id=\"def:codon-functor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 11\u003c/strong\u003e (Codon Functor).  Let \u003cspan class=\"math inline\"\u003e\\mathcal{G}\u003c/span\u003e be the category of genetic sequences (objects are sequence positions, morphisms are reading frame shifts). The \u003cem\u003ecodon functor\u003c/em\u003e \u003cspan class=\"math inline\"\u003eF : \\mathcal{G} \\to \\mathbf{Set}\u003c/span\u003e maps each position to the codon triplet at that position: \u003cspan class=\"math display\"\u003eF(i) = (m_i, m_{i+1}, m_{i+2}) \\in \\Sigma^3\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:aa-functor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 12\u003c/strong\u003e (Amino Acid Functor).  The \u003cem\u003eamino acid functor\u003c/em\u003e \u003cspan class=\"math inline\"\u003eG : \\mathcal{G} \\to \\mathbf{Set}\u003c/span\u003e maps each position to the set of amino acids that could be incorporated at that position: \u003cspan class=\"math display\"\u003eG(i) = \\{a \\in \\mathcal{A} \\mid \\exists\\, \\text{tRNA}_{a,c} \\text{ with anticodon } c \\text{ matching } F(i)\\}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathcal{A}\u003c/span\u003e is the set of 20 standard amino acids.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:trna-nat\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 13\u003c/strong\u003e (tRNA as Natural Transformation).  \u003cem\u003eThe collection of tRNAs defines a natural transformation \u003cspan class=\"math inline\"\u003e\\eta : F \u0026rArr; G\u003c/span\u003e from the codon functor to the amino acid functor. Specifically, for each position \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\eta_i : F(i) \\to G(i)\u003c/span\u003e maps the codon at position \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e to the amino acid carried by the cognate tRNA. Naturality requires that for any reading-frame morphism \u003cspan class=\"math inline\"\u003ef : i \\to j\u003c/span\u003e in \u003cspan class=\"math inline\"\u003e\\mathcal{G}\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\begin{tikzcd}\n  F(i) \\arrow[r, \u0026quot;\\eta_i\u0026quot;] \\arrow[d, \u0026quot;F(f)\u0026quot;\u0026#39;] \u0026amp; G(i) \\arrow[d, \u0026quot;G(f)\u0026quot;] \\\\\n  F(j) \\arrow[r, \u0026quot;\\eta_j\u0026quot;\u0026#39;] \u0026amp; G(j)\n\\end{tikzcd}\u003c/span\u003e commutes.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e Naturality follows from the \u003cem\u003euniversality of the genetic code\u003c/em\u003e: the mapping from codons to amino acids is position-independent. That is, the same codon yields the same amino acid regardless of where it appears in the mRNA. Formally, if \u003cspan class=\"math inline\"\u003ef : i \\to j\u003c/span\u003e is a position shift and \u003cspan class=\"math inline\"\u003eF(f)\u003c/span\u003e carries the codon at position \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e to the codon at position \u003cspan class=\"math inline\"\u003ej\u003c/span\u003e, then: \u003cspan class=\"math display\"\u003eG(f)(\\eta_i(F(i))) = \\eta_j(F(f)(F(i)))\u003c/span\u003e because the tRNA that decodes a given codon does not depend on the codon’s position in the transcript. This is precisely the commutativity of the naturality square. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"5.2\" id=\"wobble-pairing-and-lax-naturality\"\u003e\u003cspan class=\"header-section-number\"\u003e5.2\u003c/span\u003e Wobble Pairing and Lax Naturality\u003c/h2\u003e\n\u003cp\u003eThe wobble base-pairing rules allow certain tRNAs to recognize multiple codons. This relaxes strict naturality to \u003cem\u003elax naturality\u003c/em\u003e:\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 14\u003c/strong\u003e (Wobble-Extended Natural Transformation).  The \u003cem\u003ewobble-extended\u003c/em\u003e tRNA mapping \u003cspan class=\"math inline\"\u003e\\tilde{\\eta}\u003c/span\u003e is a lax natural transformation where the naturality squares commute up to a specified 2-cell \u003cspan class=\"math inline\"\u003e\\alpha\u003c/span\u003e: \u003cspan class=\"math display\"\u003eG(f) \\circ \\tilde{\\eta}_i \\cong \\tilde{\\eta}_j \\circ F(f)\n  \\quad \\text{(up to wobble equivalence)}\u003c/span\u003e where wobble equivalence identifies codons that differ only in the third (wobble) position and are decoded by the same tRNA.\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"5.3\" id=\"codon-degeneracy-as-kernel\"\u003e\u003cspan class=\"header-section-number\"\u003e5.3\u003c/span\u003e Codon Degeneracy as Kernel\u003c/h2\u003e\n\u003cp\u003eThe degeneracy of the genetic code (multiple codons encoding the same amino acid) is precisely the \u003cem\u003ekernel\u003c/em\u003e of the natural transformation \u003cspan class=\"math inline\"\u003e\\eta\u003c/span\u003e: \u003cspan class=\"math display\"\u003e\\ker(\\eta) = \\{(c_1, c_2) \\in \\Sigma^3 \u0026times; \\Sigma^3 \\mid\n    \\eta(c_1) = \\eta(c_2)\\}\u003c/span\u003e This kernel defines an equivalence relation whose equivalence classes are the synonymous codon families (e.g., \u003cspan class=\"math inline\"\u003e\\{\u003c/span\u003eUCU, UCC, UCA, UCG\u003cspan class=\"math inline\"\u003e\\}\u003c/span\u003e for Serine).\u003c/p\u003e\n\u003ch1 data-number=\"6\" id=\"sec:rrna\"\u003e\u003cspan class=\"header-section-number\"\u003e6\u003c/span\u003e rRNA as Virtual Machine\u003c/h1\u003e\n\u003cp\u003eRibosomal RNA (rRNA) constitutes the structural and catalytic core of the ribosome, the molecular machine that translates mRNA into protein. In eukaryotes, the ribosome consists of a small (40S) and a large (60S) subunit, together forming the 80S ribosome. Remarkably, the peptidyl transferase activity—the catalytic heart of translation—resides in the 23S/28S rRNA, not in any ribosomal protein.\u003c/p\u003e\n\u003ch2 data-number=\"6.1\" id=\"the-virtual-machine-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e6.1\u003c/span\u003e The Virtual Machine Interpretation\u003c/h2\u003e\n\u003cp\u003eThe ribosome is the \u003cem\u003evirtual machine\u003c/em\u003e (VM) on which the genetic program executes. The rRNAs define the VM’s architecture:\u003c/p\u003e\n\u003cdiv id=\"def:ribosome-vm\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 15\u003c/strong\u003e (Ribosome VM).  The \u003cem\u003eribosome virtual machine\u003c/em\u003e is a tuple \u003cspan class=\"math inline\"\u003e\\mathcal{V} = (S, I, \\delta, s_0, F)\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eS = \\{\u003c/span\u003e\u003cspan class=\"sans-serif\"\u003eScanning\u003c/span\u003e, \u003cspan class=\"sans-serif\"\u003eInitiation\u003c/span\u003e, \u003cspan class=\"sans-serif\"\u003eElongation\u003c/span\u003e, \u003cspan class=\"sans-serif\"\u003eTermination\u003c/span\u003e\u003cspan class=\"math inline\"\u003e\\}\u003c/span\u003e is the set of machine states,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eI = \\Sigma^3\u003c/span\u003e is the instruction set (codons),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\delta : S \u0026times; I \\to S \u0026times; \\mathcal{A}^*\u003c/span\u003e is the transition function,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003es_0 = Scanning\u003c/span\u003e is the initial state,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eF = \\{Termination\\}\u003c/span\u003e is the set of accepting states.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 16\u003c/strong\u003e (rRNA as VM Microcode).  \u003cem\u003eThe rRNA components provide the following VM services:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003e16S/18S rRNA\u003c/strong\u003e: instruction fetch and decode (codon–anticodon recognition in the A site),\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003e23S/28S rRNA\u003c/strong\u003e: the ALU—peptidyl transferase center catalyzes peptide bond formation,\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003e5S/5.8S rRNA\u003c/strong\u003e: structural scaffolding of the large subunit (memory bus).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"6.2\" id=\"execution-semantics\"\u003e\u003cspan class=\"header-section-number\"\u003e6.2\u003c/span\u003e Execution Semantics\u003c/h2\u003e\n\u003cp\u003eTranslation can be described by the following operational semantics. Let \u003cspan class=\"math inline\"\u003e\\Gamma\u003c/span\u003e denote the execution context (mRNA, tRNA pool, ribosome state).\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\\frac{\n  \\Gamma \\vdash \\text{codon}(i) = c \\quad\n  \\Gamma \\vdash \\text{tRNA}(c) = (a, \\text{tRNA}_c) \\quad\n  c \\notin \\{\\text{UAA}, \\text{UAG}, \\text{UGA}\\}\n}{\n  \\Gamma \\vdash \\langle Elong, i, p \\rangle\n    \\longrightarrow \\langle Elong, i{+}3, p \u0026middot; a \\rangle\n}\n\\;[E-Elongation]\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\\frac{\n  \\Gamma \\vdash \\text{codon}(i) = c \\quad\n  c \\in \\{\\text{UAA}, \\text{UAG}, \\text{UGA}\\}\n}{\n  \\Gamma \\vdash \\langle Elong, i, p \\rangle\n    \\longrightarrow \\langle Term, i, p \\rangle\n}\n\\;[E-Termination]\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\\frac{\n  \\Gamma \\vdash \\text{codon}(i) = \\text{AUG}\n}{\n  \\Gamma \\vdash \\langle Scan, i, \\epsilon \\rangle\n    \\longrightarrow \\langle Elong, i{+}3, \\text{Met} \\rangle\n}\n\\;[E-Initiation]\u003c/span\u003e\u003c/p\u003e\n\u003ch1 data-number=\"7\" id=\"sec:rnacontrol\"\u003e\u003cspan class=\"header-section-number\"\u003e7\u003c/span\u003e The \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e Type\u003c/h1\u003e\n\u003cp\u003eWe now introduce the central type of our framework, parameterized by the process being controlled.\u003c/p\u003e\n\u003cdiv id=\"def:rnacontrol\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 17\u003c/strong\u003e (RNAControl Type).  The \u003cem\u003eRNAControl\u003c/em\u003e type, parameterized by a process type \u003cspan class=\"math inline\"\u003eP\u003c/span\u003e, is defined as the sum type: \u003cspan class=\"math display\"\u003e\\begin{align*}\n  \\mathsf{RNAControl}\\langle P\\rangle \\;::=\\;\n    \u0026amp;\\; \\mathsf{MiRNA}\\;\\{\\;\\mathit{seed} : \\Sigma^{6\\text{--}8},\\;\n      \\mathit{targets} : [P],\\;\n      \\mathit{threshold} : [0,1]\\;\\} \\\\\n    \\mid\\; \u0026amp;\\; \\mathsf{SiRNA}\\;\\{\\;\\mathit{guide} : \\Sigma^{21},\\;\n      \\mathit{passenger} : \\Sigma^{21},\\;\n      \\mathit{handler} : P \\to \\mathsf{Effect}\\;\\} \\\\\n    \\mid\\; \u0026amp;\\; \\mathsf{LncRNA}\\;\\{\\;\\mathit{sequence} : \\Sigma^*,\\;\n      \\mathit{partners} : [\\mathsf{Molecule}],\\;\n      \\mathit{scaffold} : [\\mathsf{Molecule}] \\to \\mathsf{Complex}\\;\\} \\\\\n    \\mid\\; \u0026amp;\\; \\mathsf{TRNA}\\;\\{\\;\\mathit{anticodon} : \\Sigma^3,\\;\n      \\mathit{aminoAcid} : \\mathcal{A},\\;\n      \\mathit{adapt} : \\Sigma^3 \\to \\mathcal{A}\\;\\} \\\\\n    \\mid\\; \u0026amp;\\; \\mathsf{RRNA}\\;\\{\\;\\mathit{subunit} : \\mathsf{SubunitType},\\;\n      \\mathit{execute} : P \\to \\mathsf{Protein}\\;\\} \\\\\n    \\mid\\; \u0026amp;\\; \\mathsf{PiRNA}\\;\\{\\;\\mathit{guide} : \\Sigma^{24\\text{--}31},\\;\n      \\mathit{target} : \\mathsf{Transposon},\\;\n      \\mathit{silence} : \\mathsf{Transposon} \\to \\mathsf{Effect}\\;\\}\n\\end{align*}\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 18\u003c/strong\u003e (Exhaustiveness).  \u003cem\u003eEvery known functional class of non-coding RNA in the eukaryotic cell maps to exactly one constructor of \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e (or to a composition thereof).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"remark\"\u003e\n\u003cp\u003e\u003cstrong\u003eRemark 19\u003c/strong\u003e.  The type parameter \u003cspan class=\"math inline\"\u003eP\u003c/span\u003e allows the same framework to describe ncRNA control at different levels of abstraction:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle\\mathsf{mRNA}\\rangle\u003c/span\u003e: post-transcriptional control of individual transcripts,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle\\mathsf{Gene}\\rangle\u003c/span\u003e: gene-level regulation,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle\\mathsf{Pathway}\\rangle\u003c/span\u003e: pathway-level control.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"7.1\" id=\"functor-instance\"\u003e\u003cspan class=\"header-section-number\"\u003e7.1\u003c/span\u003e Functor Instance\u003c/h2\u003e\n\u003cdiv id=\"prop:rnacontrol-functor\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 20\u003c/strong\u003e (\u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\u003c/span\u003e is a Functor).  \u003cem\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\u003c/span\u003e admits a functorial action: given a morphism \u003cspan class=\"math inline\"\u003ef : P \\to Q\u003c/span\u003e between process types, we obtain \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}(f) : \\mathsf{RNAControl}\\langle P\\rangle \\to \\mathsf{RNAControl}\\langle Q\\rangle\u003c/span\u003e defined by: \u003cspan class=\"math display\"\u003e\\begin{align*}\n  \\mathsf{RNAControl}(f)(\\mathsf{MiRNA}(s, ts, \\theta)) \u0026amp;=\n    \\mathsf{MiRNA}(s, \\mathrm{map}\\;f\\;ts, \\theta) \\\\\n  \\mathsf{RNAControl}(f)(\\mathsf{SiRNA}(g, p, h)) \u0026amp;=\n    \\mathsf{SiRNA}(g, p, h \\circ f^{-1}) \\\\\n  \u0026amp;\\;\\vdots\n\\end{align*}\u003c/span\u003e where the remaining cases follow by applying \u003cspan class=\"math inline\"\u003ef\u003c/span\u003e or \u003cspan class=\"math inline\"\u003ef^{-1}\u003c/span\u003e to each occurrence of \u003cspan class=\"math inline\"\u003eP\u003c/span\u003e in the constructor fields. The functor laws hold by construction.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"8\" id=\"sec:rnai-typed\"\u003e\u003cspan class=\"header-section-number\"\u003e8\u003c/span\u003e RNAi as a Typed Exception System\u003c/h1\u003e\n\u003cp\u003eWe now present the main theorem characterizing RNA interference as typed pattern matching.\u003c/p\u003e\n\u003cdiv id=\"def:seq-pattern\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 21\u003c/strong\u003e (Sequence Pattern).  A \u003cem\u003esequence pattern\u003c/em\u003e is a pair \u003cspan class=\"math inline\"\u003e\\pi = (g, \\delta)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003eg \\in \\Sigma^{21}\u003c/span\u003e is the guide sequence and \u003cspan class=\"math inline\"\u003e\\delta \\in \\mathbb{N}\u003c/span\u003e is the mismatch tolerance. A target \u003cspan class=\"math inline\"\u003et \\in \\Sigma^*\u003c/span\u003e \u003cem\u003ematches\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\pi\u003c/span\u003e at position \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e if: \u003cspan class=\"math display\"\u003e\\mathrm{hamming}(g, \\overline{t[i..i{+}20]}) \u0026le; \\delta\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\overline{(\u0026middot;)}\u003c/span\u003e denotes the reverse complement.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 22\u003c/strong\u003e (Typed Pattern Matching).  A \u003cem\u003etyped pattern-matching system\u003c/em\u003e is a tuple \u003cspan class=\"math inline\"\u003e(\\Pi, T, \\mathsf{match})\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\Pi\u003c/span\u003e is a set of patterns,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eT\u003c/span\u003e is a set of targets,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{match} : \\Pi \u0026times; T \\to \\{\\top, \\bot\\}\u003c/span\u003e is the matching function.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIt is \u003cem\u003etyped\u003c/em\u003e if patterns and targets carry type annotations and matching respects the type discipline—i.e., a pattern of type \u003cspan class=\"math inline\"\u003e\\tau\u003c/span\u003e can only match targets of type \u003cspan class=\"math inline\"\u003e\\tau\u003c/span\u003e or a subtype thereof.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:risc\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 23\u003c/strong\u003e (RISC Pattern-Matching Theorem).  \u003cem\u003eThe RISC complex implements a typed pattern-matching system \u003cspan class=\"math inline\"\u003e(\\Pi_{\\mathrm{RISC}}, T_{\\text{mRNA}}, \\mathsf{match}_{\\mathrm{RISC}})\u003c/span\u003e where:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe pattern set \u003cspan class=\"math inline\"\u003e\\Pi_{\\mathrm{RISC}}\u003c/span\u003e consists of all loaded guide strands, each carrying the type annotation of its source (siRNA vs. miRNA).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe target set \u003cspan class=\"math inline\"\u003eT_{\\text{mRNA}}\u003c/span\u003e is the cellular transcriptome.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe matching function \u003cspan class=\"math inline\"\u003e\\mathsf{match}_{\\mathrm{RISC}}\u003c/span\u003e satisfies:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eDeterminism\u003c/strong\u003e: For each guide–target pair, the match outcome is deterministic.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eType discrimination\u003c/strong\u003e: siRNA guides (\u003cspan class=\"math inline\"\u003e\\delta = 0\u003c/span\u003e) yield cleavage; miRNA guides (\u003cspan class=\"math inline\"\u003e\\delta \u0026gt; 0\u003c/span\u003e) yield repression.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eExhaustive scanning\u003c/strong\u003e: every mRNA in the transcriptome is tested against every loaded guide.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe system satisfies the \u003cem\u003eprogress\u003c/em\u003e and \u003cem\u003epreservation\u003c/em\u003e properties of a well-typed evaluation:\u003c/em\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eProgress\u003c/strong\u003e: If a guide is loaded and a target exists with complementarity \u003cspan class=\"math inline\"\u003e\u0026le; \\delta\u003c/span\u003e, cleavage/repression will occur.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003ePreservation\u003c/strong\u003e: The type of the silencing action (cleavage vs. repression) is preserved throughout the silencing process.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e We verify each property:\u003c/p\u003e\n\u003cp\u003e(i) Guide strands are loaded into RISC as single-stranded RNA with known provenance (Dicer processing of dsRNA for siRNA; Drosha/Dicer processing of pri-miRNA for miRNA). The provenance annotation serves as the type tag.\u003c/p\u003e\n\u003cp\u003e(ii) The transcriptome is accessible to cytoplasmic RISC.\u003c/p\u003e\n\u003cp\u003e(iii-a) Complementarity is a deterministic function of sequence.\u003c/p\u003e\n\u003cp\u003e(iii-b) AGO2, the catalytic component of RISC, requires extensive base-pairing (positions 2–21, with tolerance \u003cspan class=\"math inline\"\u003e\\delta\u003c/span\u003e) for endonucleolytic cleavage. When complementarity is partial (miRNA-type), the complex instead recruits deadenylation and translational repression factors. Thus the mismatch tolerance \u003cspan class=\"math inline\"\u003e\\delta\u003c/span\u003e determines the outcome type.\u003c/p\u003e\n\u003cp\u003e(iii-c) RISC scans by three-dimensional diffusion and sampling, giving all mRNAs a non-zero probability of encounter.\u003c/p\u003e\n\u003cp\u003eProgress follows from the thermodynamic favorability of guide–target hybridization: if complementarity is sufficient, the duplex forms spontaneously.\u003c/p\u003e\n\u003cp\u003ePreservation follows from the structural integrity of the RISC complex: once a guide is loaded, it remains stably associated with AGO, ensuring the same type of silencing action throughout the guide’s lifetime. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"9\" id=\"sec:scaffold-colimit\"\u003e\u003cspan class=\"header-section-number\"\u003e9\u003c/span\u003e The Scaffold Colimit Theorem\u003c/h1\u003e\n\u003cp\u003eWe now formalize the observation that lncRNA-mediated scaffold assembly satisfies the universal property of a colimit.\u003c/p\u003e\n\u003cdiv id=\"def:binding-cat\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 24\u003c/strong\u003e (Binding Category).  For a lncRNA scaffold \u003cspan class=\"math inline\"\u003el\u003c/span\u003e with binding partners \u003cspan class=\"math inline\"\u003eB = \\{b_1, \u0026hellip;,\nb_n\\}\u003c/span\u003e, define the \u003cem\u003ebinding category\u003c/em\u003e \u003cspan class=\"math inline\"\u003e\\mathcal{B}_l\u003c/span\u003e as follows:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003eObjects: the binding domains \u003cspan class=\"math inline\"\u003e\\{d_1, \u0026hellip;, d_k\\}\u003c/span\u003e of \u003cspan class=\"math inline\"\u003el\u003c/span\u003e together with the partners \u003cspan class=\"math inline\"\u003eB\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eMorphisms: \u003cspan class=\"math inline\"\u003ed_i \\to b_j\u003c/span\u003e if domain \u003cspan class=\"math inline\"\u003ed_i\u003c/span\u003e binds partner \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e; \u003cspan class=\"math inline\"\u003eb_j \\to b_{j\u0026#39;}\u003c/span\u003e if partners \u003cspan class=\"math inline\"\u003ej\u003c/span\u003e and \u003cspan class=\"math inline\"\u003ej\u0026#39;\u003c/span\u003e interact when co-scaffolded.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:assembly-functor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 25\u003c/strong\u003e (Assembly Functor).  The \u003cem\u003eassembly functor\u003c/em\u003e \u003cspan class=\"math inline\"\u003eA : \\mathcal{B}_l \\to \\mathcal{C}\u003c/span\u003e maps:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003eEach binding domain \u003cspan class=\"math inline\"\u003ed_i\u003c/span\u003e to the corresponding structural region of \u003cspan class=\"math inline\"\u003el\u003c/span\u003e in the category of molecular assemblies \u003cspan class=\"math inline\"\u003e\\mathcal{C}\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eEach partner \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e to the molecule \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e in \u003cspan class=\"math inline\"\u003e\\mathcal{C}\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eEach binding morphism to the binding interaction in \u003cspan class=\"math inline\"\u003e\\mathcal{C}\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv id=\"thm:scaffold-colimit\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 26\u003c/strong\u003e (Scaffold Colimit Theorem).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003el\u003c/span\u003e be a lncRNA scaffold with binding category \u003cspan class=\"math inline\"\u003e\\mathcal{B}_l\u003c/span\u003e and assembly functor \u003cspan class=\"math inline\"\u003eA : \\mathcal{B}_l \\to \\mathcal{C}\u003c/span\u003e. Then the assembled ribonucleoprotein complex \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e satisfies the universal property of the colimit: \u003cspan class=\"math display\"\u003e\\mathsf{RNP}_l \\cong \\mathrm{colim}(A)\u003c/span\u003e That is, for any molecular complex \u003cspan class=\"math inline\"\u003eX\u003c/span\u003e and family of binding maps \u003cspan class=\"math inline\"\u003e\\{f_i : A(b_i) \\to X\\}\u003c/span\u003e compatible with the diagram, there exists a unique map \u003cspan class=\"math inline\"\u003eu : \\mathsf{RNP}_l \\to X\u003c/span\u003e such that \u003cspan class=\"math inline\"\u003eu \\circ \\iota_i = f_i\u003c/span\u003e for all \u003cspan class=\"math inline\"\u003ei\u003c/span\u003e, where \u003cspan class=\"math inline\"\u003e\\iota_i : A(b_i) \\to \\mathsf{RNP}_l\u003c/span\u003e are the canonical inclusions. \u003cspan class=\"math display\"\u003e\\begin{tikzcd}\n  A(b_1) \\arrow[r, \u0026quot;\\iota_1\u0026quot;] \\arrow[dr, \u0026quot;f_1\u0026quot;\u0026#39;] \u0026amp;\n  \\mathsf{RNP}_l \\arrow[d, dashed, \u0026quot;{\\exists!\\, u}\u0026quot;] \u0026amp;\n  A(b_2) \\arrow[l, \u0026quot;\\iota_2\u0026quot;\u0026#39;] \\arrow[dl, \u0026quot;f_2\u0026quot;] \\\\\n  \u0026amp; X \u0026amp;\n\\end{tikzcd}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e We must show that \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e satisfies the two colimit conditions:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eExistence of cocone:\u003c/strong\u003e Each partner \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e binds to \u003cspan class=\"math inline\"\u003el\u003c/span\u003e at domain \u003cspan class=\"math inline\"\u003ed_j\u003c/span\u003e, yielding inclusion maps \u003cspan class=\"math inline\"\u003e\\iota_j : A(b_j) \\to \\mathsf{RNP}_l\u003c/span\u003e. These are compatible: for any morphism \u003cspan class=\"math inline\"\u003ed_i \\to b_j\u003c/span\u003e in \u003cspan class=\"math inline\"\u003e\\mathcal{B}_l\u003c/span\u003e, the diagram commutes because the binding of \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e to domain \u003cspan class=\"math inline\"\u003ed_i\u003c/span\u003e is the same whether we first include \u003cspan class=\"math inline\"\u003ed_i\u003c/span\u003e into \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e and then identify with \u003cspan class=\"math inline\"\u003eb_j\u003c/span\u003e’s binding site, or bind directly.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUniversality:\u003c/strong\u003e Suppose \u003cspan class=\"math inline\"\u003eX\u003c/span\u003e is any complex with compatible maps \u003cspan class=\"math inline\"\u003ef_j : A(b_j) \\to X\u003c/span\u003e. Define \u003cspan class=\"math inline\"\u003eu : \\mathsf{RNP}_l \\to X\u003c/span\u003e by mapping each component of \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e to \u003cspan class=\"math inline\"\u003eX\u003c/span\u003e via the corresponding \u003cspan class=\"math inline\"\u003ef_j\u003c/span\u003e. Compatibility of the \u003cspan class=\"math inline\"\u003ef_j\u003c/span\u003e ensures \u003cspan class=\"math inline\"\u003eu\u003c/span\u003e is well-defined on overlaps (shared interfaces between partners). Uniqueness follows from the fact that \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e is generated by the images of \u003cspan class=\"math inline\"\u003e\\iota_j\u003c/span\u003e, so \u003cspan class=\"math inline\"\u003eu\u003c/span\u003e is determined on all of \u003cspan class=\"math inline\"\u003e\\mathsf{RNP}_l\u003c/span\u003e by the \u003cspan class=\"math inline\"\u003ef_j\u003c/span\u003e. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"corollary\"\u003e\n\u003cp\u003e\u003cstrong\u003eCorollary 27\u003c/strong\u003e (Scaffold Modularity).  \u003cem\u003eThe colimit construction implies that the scaffolded complex is the \u003cem\u003eminimal\u003c/em\u003e complex containing all partners with all specified interactions. Adding or removing a binding domain from the lncRNA corresponds to modifying the indexing category \u003cspan class=\"math inline\"\u003e\\mathcal{B}_l\u003c/span\u003e, yielding a different colimit—formalizing the modularity of scaffold-mediated assembly.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"10\" id=\"sec:pirna\"\u003e\u003cspan class=\"header-section-number\"\u003e10\u003c/span\u003e piRNA as Security Monitor\u003c/h1\u003e\n\u003cp\u003ePIWI-interacting RNAs (piRNAs) are 24–31 nt non-coding RNAs that associate with PIWI-subfamily Argonaute proteins. They are primarily expressed in the germline, where they defend genome integrity by silencing transposable elements (TEs).\u003c/p\u003e\n\u003ch2 data-number=\"10.1\" id=\"the-security-monitor-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e10.1\u003c/span\u003e The Security Monitor Interpretation\u003c/h2\u003e\n\u003cp\u003eTransposable elements are, from the genome’s perspective, \u003cem\u003emalware\u003c/em\u003e: self-replicating sequences that insert themselves into the host genome, potentially disrupting gene function. The piRNA pathway is the cell’s \u003cem\u003eanti-malware system\u003c/em\u003e.\u003c/p\u003e\n\u003cdiv id=\"def:pirna-monitor\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 28\u003c/strong\u003e (piRNA Security Monitor).  A \u003cem\u003epiRNA security monitor\u003c/em\u003e is a tuple \u003cspan class=\"math inline\"\u003e\\mu = (P, L, \\mathsf{scan},\n\\mathsf{silence})\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eP\u003c/span\u003e is a library of piRNA guide sequences (the malware signature database),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eL\u003c/span\u003e is the set of known transposon families (the threat landscape),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{scan} : P \u0026times; \\Sigma^* \\to \\{\\top, \\bot\\}\u003c/span\u003e is the scanning function that detects transposon transcripts by complementarity,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\mathsf{silence} : \\Sigma^* \\to \\mathsf{Effect}\u003c/span\u003e triggers transcriptional and post-transcriptional silencing of detected threats.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 29\u003c/strong\u003e (Ping-Pong Amplification as Adaptive Immune Response).  \u003cem\u003eThe ping-pong amplification cycle, in which sense and antisense piRNAs reciprocally generate each other using transposon transcripts as templates, is formally analogous to an \u003cem\u003eadaptive immune response\u003c/em\u003e:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eInitial piRNAs from piRNA clusters serve as the \u003cem\u003einnate\u003c/em\u003e signature set.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eSlicing of transposon mRNA by antisense piRNAs generates new sense piRNAs—this is \u003cem\u003eadaptive\u003c/em\u003e expansion of the signature database.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eThe cycle amplifies the response specifically against \u003cem\u003eactive\u003c/em\u003e transposons, implementing a form of threat-proportional response.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"10.2\" id=\"formal-properties-of-the-pirna-monitor\"\u003e\u003cspan class=\"header-section-number\"\u003e10.2\u003c/span\u003e Formal Properties of the piRNA Monitor\u003c/h2\u003e\n\u003cdiv id=\"thm:pirna-complete\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 30\u003c/strong\u003e (Completeness of Germline Defense).  \u003cem\u003eUnder the assumptions that (a) piRNA clusters collectively contain representatives of all active transposon families and (b) the ping-pong cycle reaches steady state, the piRNA security monitor achieves \u003cem\u003ecoverage completeness\u003c/em\u003e: \u003cspan class=\"math display\"\u003e\\forall\\, t \\in L_{\\text{active}},\\; \\exists\\, p \\in P_{\u0026infin;}\n  \\text{ such that } \\mathsf{scan}(p, \\mathrm{seq}(t)) = \\top\u003c/span\u003e where \u003cspan class=\"math inline\"\u003eP_{\u0026infin;}\u003c/span\u003e is the steady-state piRNA library and \u003cspan class=\"math inline\"\u003eL_{\\text{active}}\u003c/span\u003e is the set of currently active transposon families.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e By assumption (a), every active transposon family has at least one representative sequence in a piRNA cluster. Transcription of this cluster produces primary piRNAs antisense to the transposon. These primary piRNAs, loaded into PIWI, cleave transposon mRNAs, generating sense piRNAs that are loaded into a second PIWI paralog. These sense piRNAs in turn cleave cluster-derived antisense transcripts, regenerating antisense piRNAs. By assumption (b), this cycle converges, and the steady-state library \u003cspan class=\"math inline\"\u003eP_{\u0026infin;}\u003c/span\u003e contains both sense and antisense piRNAs complementary to every active transposon, establishing coverage completeness. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"11\" id=\"sec:haskell\"\u003e\u003cspan class=\"header-section-number\"\u003e11\u003c/span\u003e Haskell Implementation\u003c/h1\u003e\n\u003cp\u003eWe provide a complete Haskell implementation of the framework described above. The implementation consists of the following modules:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003ccode\u003eRNAControl.hs\u003c/code\u003e: The core parametric type \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e with all six constructors.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ccode\u003eMicroRNA.hs\u003c/code\u003e: miRNA seed matching, target prediction, and repression scoring.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ccode\u003eSiRNA.hs\u003c/code\u003e: RNA interference pathway including RISC loading, guide strand selection, and target degradation.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ccode\u003eLncRNA.hs\u003c/code\u003e: Scaffold assembly and complex formation.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ccode\u003eMain.hs\u003c/code\u003e: Demonstrations of miRNA targeting, siRNA/RNAi silencing, tRNA adaptation, and lncRNA scaffolding.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 data-number=\"11.1\" id=\"core-type-definition\"\u003e\u003cspan class=\"header-section-number\"\u003e11.1\u003c/span\u003e Core Type Definition\u003c/h2\u003e\n\u003cp\u003eThe Haskell encoding of \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e mirrors the mathematical definition:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edata RNAControl p\n  = MiRNA  { miSeed :: String, miTargets :: [p],\n             miThreshold :: Double }\n  | SiRNA  { siGuide :: String, siPassenger :: String,\n             siMismatchTol :: Int }\n  | LncRNA { lncSequence :: String,\n             lncPartners :: [String],\n             lncRole :: LncRNARole }\n  | TRNA   { trnaAnticodon :: String,\n             trnaAminoAcid :: Char }\n  | RRNA   { rrnaSubunit :: SubunitType }\n  | PiRNA  { piGuide :: String, piTarget :: String }\n  deriving (Show, Eq)\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe type parameter \u003ccode\u003ep\u003c/code\u003e allows the same type to describe control over different process types, as discussed in Section \u003ca href=\"#sec:rnacontrol\" data-reference-type=\"ref\" data-reference=\"sec:rnacontrol\"\u003e7\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 data-number=\"11.2\" id=\"mirna-seed-matching\"\u003e\u003cspan class=\"header-section-number\"\u003e11.2\u003c/span\u003e miRNA Seed Matching\u003c/h2\u003e\n\u003cp\u003eThe seed-matching algorithm implements Definition \u003ca href=\"#def:seed-score\" data-reference-type=\"ref\" data-reference=\"def:seed-score\"\u003e2\u003c/a\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eseedMatch :: String -\u0026gt; String -\u0026gt; Double\nseedMatch seed target\n  | length target \u0026lt; length seed = 0.0\n  | otherwise = maximum scores\n  where\n    k = length seed\n    windows = [ take k (drop i target)\n              | i \u0026lt;- [0 .. length target - k] ]\n    scores = map (scoreSeed seed) windows\n\nscoreSeed :: String -\u0026gt; String -\u0026gt; Double\nscoreSeed s t =\n  let pairs = zip s t\n      wcScore (a, b)\n        | isComplement a b = 1.0\n        | isWobble a b     = 0.5\n        | otherwise        = 0.0\n  in sum (map wcScore pairs) /\n     fromIntegral (length pairs)\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 data-number=\"11.3\" id=\"risc-pattern-matching\"\u003e\u003cspan class=\"header-section-number\"\u003e11.3\u003c/span\u003e RISC Pattern Matching\u003c/h2\u003e\n\u003cp\u003eThe RISC handler implements Definition \u003ca href=\"#def:risc-handler\" data-reference-type=\"ref\" data-reference=\"def:risc-handler\"\u003e6\u003c/a\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edata RISCResult = Cleave | Repress | Pass\n  deriving (Show, Eq)\n\nriscMatch :: String -\u0026gt; Int -\u0026gt; String -\u0026gt; RISCResult\nriscMatch guide tolerance target =\n  let rc = reverseComplement guide\n      mismatches = hammingDistance rc target\n  in if mismatches \u0026lt;= tolerance\n     then if tolerance == 0\n          then Cleave\n          else Repress\n     else Pass\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 data-number=\"11.4\" id=\"scaffold-assembly\"\u003e\u003cspan class=\"header-section-number\"\u003e11.4\u003c/span\u003e Scaffold Assembly\u003c/h2\u003e\n\u003cp\u003eThe scaffold colimit (Theorem \u003ca href=\"#thm:scaffold-colimit\" data-reference-type=\"ref\" data-reference=\"thm:scaffold-colimit\"\u003e26\u003c/a\u003e) is implemented via the \u003ccode\u003eassembleComplex\u003c/code\u003e function:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edata Complex = Complex\n  { complexName     :: String\n  , complexMembers  :: [String]\n  , complexScaffold :: String\n  } deriving (Show, Eq)\n\nassembleComplex :: String -\u0026gt; [String] -\u0026gt; Complex\nassembleComplex scaffold partners =\n  Complex { complexName =\n              scaffold ++ \u0026quot;-complex\u0026quot;\n          , complexMembers = partners\n          , complexScaffold = scaffold\n          }\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 data-number=\"11.5\" id=\"trna-adaptation\"\u003e\u003cspan class=\"header-section-number\"\u003e11.5\u003c/span\u003e tRNA Adaptation\u003c/h2\u003e\n\u003cp\u003eThe natural transformation \u003cspan class=\"math inline\"\u003e\\eta\u003c/span\u003e (Theorem \u003ca href=\"#thm:trna-nat\" data-reference-type=\"ref\" data-reference=\"thm:trna-nat\"\u003e13\u003c/a\u003e) is encoded as a pure function:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eadaptCodon :: String -\u0026gt; Maybe Char\nadaptCodon codon = lookup codon codonTable\n\ncodonTable :: [(String, Char)]\ncodonTable =\n  [ (\u0026quot;AUG\u0026quot;, \u0026#39;M\u0026#39;), (\u0026quot;UUU\u0026quot;, \u0026#39;F\u0026#39;), (\u0026quot;UUC\u0026quot;, \u0026#39;F\u0026#39;)\n  , (\u0026quot;UUA\u0026quot;, \u0026#39;L\u0026#39;), (\u0026quot;UUG\u0026quot;, \u0026#39;L\u0026#39;), ...\n  ]\u003c/code\u003e\u003c/pre\u003e\n\u003ch1 data-number=\"12\" id=\"sec:extended\"\u003e\u003cspan class=\"header-section-number\"\u003e12\u003c/span\u003e Extended Type-Theoretic Analysis\u003c/h1\u003e\n\u003ch2 data-number=\"12.1\" id=\"the-ncrna-control-monad\"\u003e\u003cspan class=\"header-section-number\"\u003e12.1\u003c/span\u003e The ncRNA Control Monad\u003c/h2\u003e\n\u003cp\u003eThe various ncRNA control mechanisms can be composed monadically. Consider the following observation: an mRNA transcript may be subject to multiple layers of ncRNA control simultaneously—miRNA repression, possible RNAi degradation, and lncRNA-mediated sequestration.\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 31\u003c/strong\u003e (ncRNA Control Monad).  Define the monad \u003cspan class=\"math inline\"\u003e\\mathcal{M} : \\mathbf{Set}\\to \\mathbf{Set}\u003c/span\u003e by: \u003cspan class=\"math display\"\u003e\\mathcal{M}(X) = \\prod_{r \\in \\mathsf{RNAControl}} (r \\to X + \\mathbf{1})\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathbf{1}\u003c/span\u003e represents the “silenced” outcome. The unit \u003cspan class=\"math inline\"\u003e\\eta : X \\to \\mathcal{M}(X)\u003c/span\u003e embeds uncontrolled expression, and the multiplication \u003cspan class=\"math inline\"\u003e\\mu : \\mathcal{M}(\\mathcal{M}(X)) \\to \\mathcal{M}(X)\u003c/span\u003e flattens nested control layers.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 32\u003c/strong\u003e (Monad Laws).  \u003cem\u003e\u003cspan class=\"math inline\"\u003e\\mathcal{M}\u003c/span\u003e satisfies the monad laws:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eLeft unit: \u003cspan class=\"math inline\"\u003e\\mu \\circ \\eta_{\\mathcal{M}} = \\mathrm{id}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eRight unit: \u003cspan class=\"math inline\"\u003e\\mu \\circ \\mathcal{M}(\\eta) = \\mathrm{id}\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003eAssociativity: \u003cspan class=\"math inline\"\u003e\\mu \\circ \\mu_{\\mathcal{M}} =\n    \\mu \\circ \\mathcal{M}(\\mu)\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"12.2\" id=\"interaction-between-ncrna-classes\"\u003e\u003cspan class=\"header-section-number\"\u003e12.2\u003c/span\u003e Interaction Between ncRNA Classes\u003c/h2\u003e\n\u003cp\u003eThe different ncRNA classes do not act in isolation; they form a complex interaction network:\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 33\u003c/strong\u003e (ceRNA Hypothesis, Formalized).  The \u003cem\u003ecompeting endogenous RNA\u003c/em\u003e (ceRNA) hypothesis posits that transcripts sharing miRNA response elements (MREs) can regulate each other by competing for a shared pool of miRNAs. Formally, let \u003cspan class=\"math inline\"\u003em_1, m_2\u003c/span\u003e be two transcripts with shared MREs for miRNA \u003cspan class=\"math inline\"\u003e\\mu\u003c/span\u003e. Then: \u003cspan class=\"math display\"\u003e\\text{Abundance}(m_1) \\uparrow \\;\\implies\\;\n  \\text{Free}(\\mu) \\downarrow \\;\\implies\\;\n  \\text{Repression}(m_2) \\downarrow\u003c/span\u003e This implements a form of \u003cem\u003einter-process communication\u003c/em\u003e mediated by the shared miRNA signal.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 34\u003c/strong\u003e (lncRNA–miRNA Sponge Effect).  \u003cem\u003eA lncRNA acting as a miRNA sponge (e.g., circRNAs with dense MRE arrays) implements a \u003cem\u003erate limiter\u003c/em\u003e in the middleware stack: \u003cspan class=\"math display\"\u003e\\text{Effective silencing rate} =\n  \\frac{[\\mu]_{\\text{free}}}{[\\mu]_{\\text{total}}} \u0026middot; k_{\\text{max}}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e[\\mu]_{\\text{free}}\u003c/span\u003e is the concentration of miRNA not sequestered by the sponge.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"12.3\" id=\"type-safety-of-the-ncrna-control-layer\"\u003e\u003cspan class=\"header-section-number\"\u003e12.3\u003c/span\u003e Type Safety of the ncRNA Control Layer\u003c/h2\u003e\n\u003cdiv id=\"thm:type-safety\" class=\"theorem\"\u003e\n\u003cp\u003e\u003cstrong\u003eTheorem 35\u003c/strong\u003e (Type Safety).  \u003cem\u003eThe ncRNA control system, modeled as \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e, satisfies type safety in the following sense:\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eProgress\u003c/strong\u003e: Every ncRNA control element either actively modifies its target process or is in a well-defined inactive state (not loaded, sequestered, or degraded).\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003ePreservation\u003c/strong\u003e: The type of control (guard, exception, middleware, transformation, VM instruction, security scan) is preserved throughout the ncRNA’s functional lifetime.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proof\"\u003e\n\u003cp\u003e\u003cem\u003eProof.\u003c/em\u003e Progress: Each constructor of \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e carries the necessary information to execute its control function. An MiRNA carries its seed and threshold; if a matching target exists and the score exceeds the threshold, repression occurs (progress). If no target matches, the miRNA remains in RISC in a scannable state (well-defined inactive state). Similar arguments apply to each constructor.\u003c/p\u003e\n\u003cp\u003ePreservation: The ncRNA’s type is determined at biogenesis (Dicer processing for siRNA/miRNA, transcription for lncRNA, tRNA gene expression for tRNA, etc.) and is structurally encoded in its sequence and modifications. Post-biogenesis, no process converts one ncRNA class into another (an miRNA does not become an siRNA). Thus the control type is preserved. ◻\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"13\" id=\"sec:composition\"\u003e\u003cspan class=\"header-section-number\"\u003e13\u003c/span\u003e Compositional Semantics of ncRNA Networks\u003c/h1\u003e\n\u003ch2 data-number=\"13.1\" id=\"the-ncrna-operad\"\u003e\u003cspan class=\"header-section-number\"\u003e13.1\u003c/span\u003e The ncRNA Operad\u003c/h2\u003e\n\u003cp\u003eThe various modes of ncRNA control can be organized into an operad structure, capturing how multiple ncRNA inputs compose to produce a single regulatory output.\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 36\u003c/strong\u003e (ncRNA Operad).  Define the operad \u003cspan class=\"math inline\"\u003e\\mathcal{O}_{\\text{ncRNA}}\u003c/span\u003e with:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003eOperations \u003cspan class=\"math inline\"\u003e\\mathcal{O}(n)\u003c/span\u003e: the set of ncRNA regulatory functions with \u003cspan class=\"math inline\"\u003en\u003c/span\u003e inputs (target transcripts) and one output (regulatory effect).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eComposition: given \u003cspan class=\"math inline\"\u003ef \\in \\mathcal{O}(n)\u003c/span\u003e and \u003cspan class=\"math inline\"\u003eg_i \\in \\mathcal{O}(k_i)\u003c/span\u003e for \u003cspan class=\"math inline\"\u003e1 \u0026le; i \u0026le; n\u003c/span\u003e, the composite \u003cspan class=\"math inline\"\u003ef \\circ (g_1, \u0026hellip;, g_n) \\in \\mathcal{O}(k_1 + \u0026middot;s + k_n)\u003c/span\u003e represents hierarchical regulation.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eUnit: the identity regulation (no effect).\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"13.2\" id=\"regulatory-cascades-as-kleisli-composition\"\u003e\u003cspan class=\"header-section-number\"\u003e13.2\u003c/span\u003e Regulatory Cascades as Kleisli Composition\u003c/h2\u003e\n\u003cp\u003eWhen ncRNA control effects compose sequentially (e.g., a lncRNA modulates miRNA availability, which in turn affects mRNA translation), the appropriate compositional structure is Kleisli composition in the ncRNA control monad:\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 37\u003c/strong\u003e (Regulatory Cascade).  A \u003cem\u003eregulatory cascade\u003c/em\u003e is a sequence of Kleisli arrows: \u003cspan class=\"math display\"\u003ef_1 : A \\to \\mathcal{M}(B), \\quad\n  f_2 : B \\to \\mathcal{M}(C), \\quad \u0026hellip;, \\quad\n  f_n : Y \\to \\mathcal{M}(Z)\u003c/span\u003e with composite: \u003cspan class=\"math display\"\u003ef_n \\circ_{\\mathcal{M}} \u0026middot;s \\circ_{\\mathcal{M}} f_1\n  : A \\to \\mathcal{M}(Z)\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"example\"\u003e\n\u003cp\u003e\u003cstrong\u003eExample 38\u003c/strong\u003e (ceRNA Cascade).  Consider the cascade: lncRNA PTENP1 (sponge) \u003cspan class=\"math inline\"\u003e\\to\u003c/span\u003e miR-21 (freed) \u003cspan class=\"math inline\"\u003e\\to\u003c/span\u003e PTEN mRNA (derepressed) \u003cspan class=\"math inline\"\u003e\\to\u003c/span\u003e PI3K/AKT pathway (modulated). This four-step cascade is a Kleisli composite: \u003cspan class=\"math display\"\u003e\\text{PTENP1-sponge} \\circ_{\\mathcal{M}} \\text{miR-21-guard}\n  \\circ_{\\mathcal{M}} \\text{PTEN-translation}\n  : \\text{lncRNA-level} \\to \\mathcal{M}(\\text{pathway-level})\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch1 data-number=\"14\" id=\"sec:discussion\"\u003e\u003cspan class=\"header-section-number\"\u003e14\u003c/span\u003e Discussion and Conclusion\u003c/h1\u003e\n\u003ch2 data-number=\"14.1\" id=\"summary-of-results\"\u003e\u003cspan class=\"header-section-number\"\u003e14.1\u003c/span\u003e Summary of Results\u003c/h2\u003e\n\u003cp\u003eWe have developed a comprehensive type-theoretic framework for non-coding RNA function, showing that:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eThe six major classes of ncRNAs correspond precisely to six fundamental programming-language control-flow primitives: guards, exceptions, middleware, natural transformations, virtual machines, and security monitors.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThese roles are unified under the parametric type \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe RISC complex implements typed pattern matching (Theorem \u003ca href=\"#thm:risc\" data-reference-type=\"ref\" data-reference=\"thm:risc\"\u003e23\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003elncRNA scaffold assembly satisfies the universal property of the categorical colimit (Theorem \u003ca href=\"#thm:scaffold-colimit\" data-reference-type=\"ref\" data-reference=\"thm:scaffold-colimit\"\u003e26\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003etRNA decoding is a natural transformation between the codon and amino acid functors (Theorem \u003ca href=\"#thm:trna-nat\" data-reference-type=\"ref\" data-reference=\"thm:trna-nat\"\u003e13\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe ncRNA control layer satisfies type safety (Theorem \u003ca href=\"#thm:type-safety\" data-reference-type=\"ref\" data-reference=\"thm:type-safety\"\u003e35\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 data-number=\"14.2\" id=\"biological-implications\"\u003e\u003cspan class=\"header-section-number\"\u003e14.2\u003c/span\u003e Biological Implications\u003c/h2\u003e\n\u003cp\u003eOur framework suggests that the cell has evolved a \u003cem\u003etyped control plane\u003c/em\u003e separate from the data plane (protein-coding mRNAs). This separation of concerns mirrors a fundamental software engineering principle and may explain the explosive growth of the non-coding transcriptome in complex organisms: as biological “programs” grow larger, proportionally more control flow is required.\u003c/p\u003e\n\u003cp\u003eThe observation that \u003cspan class=\"math inline\"\u003e\u0026gt;98\\%\u003c/span\u003e of the transcriptome is non-coding parallels the observation in large software systems that control logic (configuration, middleware, monitoring, error handling) often exceeds the core business logic in volume.\u003c/p\u003e\n\u003ch2 data-number=\"14.3\" id=\"predictions\"\u003e\u003cspan class=\"header-section-number\"\u003e14.3\u003c/span\u003e Predictions\u003c/h2\u003e\n\u003cp\u003eOur framework makes several testable predictions:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eOrganisms with more complex developmental programs should have proportionally larger ncRNA repertoires (more control flow for larger programs).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003encRNA regulatory networks should exhibit compositionality: the effect of multiple ncRNAs should be predictable from their individual effects and their interaction type (guard composition, exception hierarchy, middleware chaining).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe piRNA system should show adaptive dynamics consistent with our security monitor formalization—specifically, threat-proportional response amplification.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 data-number=\"14.4\" id=\"limitations\"\u003e\u003cspan class=\"header-section-number\"\u003e14.4\u003c/span\u003e Limitations\u003c/h2\u003e\n\u003cp\u003eOur framework intentionally abstracts away quantitative kinetics in favor of type-theoretic precision. A full quantitative treatment would require combining our type theory with a stochastic process calculus. Additionally, many ncRNA functions remain undiscovered; our six-constructor type may require extension as new functional classes emerge.\u003c/p\u003e\n\u003ch2 data-number=\"14.5\" id=\"future-work\"\u003e\u003cspan class=\"header-section-number\"\u003e14.5\u003c/span\u003e Future Work\u003c/h2\u003e\n\u003cp\u003eSeveral directions merit exploration:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003eExtending the framework to circular RNAs (circRNAs) and their unique back-splicing–derived topology.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eDeveloping a dependent type theory where ncRNA types depend on cellular state (tissue type, developmental stage).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eConnecting to the broader DNA-Lang framework, where ncRNAs serve as the control-flow layer for the genetic programming language.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eFormalizing epitranscriptomic modifications (m\u003cspan class=\"math inline\"\u003e^6\u003c/span\u003eA, pseudouridine) as type annotations on ncRNAs.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 data-number=\"14.6\" id=\"conclusion\"\u003e\u003cspan class=\"header-section-number\"\u003e14.6\u003c/span\u003e Conclusion\u003c/h2\u003e\n\u003cp\u003eThe non-coding RNA transcriptome is not genomic noise; it is the cell’s control plane. By recognizing miRNAs as guards, siRNAs as exception handlers, lncRNAs as middleware, tRNAs as natural transformations, rRNAs as virtual machines, and piRNAs as security monitors, we gain both formal precision and conceptual clarity. The parametric type \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e provides a unifying abstraction, and the accompanying theorems establish rigorous connections between molecular biology and type theory. The complete Haskell implementation demonstrates that these abstractions are not merely metaphorical but computationally precise.\u003c/p\u003e\n\u003cdiv class=\"thebibliography\"\u003e\n\u003cp\u003e\u003cspan\u003e99\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eENCODE Project Consortium. An integrated encyclopedia of DNA elements in the human genome. \u003cem\u003eNature\u003c/em\u003e, 489(7414):57–74, 2012.\u003c/p\u003e\n\u003cp\u003eD. P. Bartel. MicroRNAs: target recognition and regulatory functions. \u003cem\u003eCell\u003c/em\u003e, 136(2):215–233, 2009.\u003c/p\u003e\n\u003cp\u003eA. Fire, S. Xu, M. K. Montgomery, S. A. Kostas, S. E. Driver, and C. C. Mello. Potent and specific genetic interference by double-stranded RNA in \u003cem\u003eCaenorhabditis elegans\u003c/em\u003e. \u003cem\u003eNature\u003c/em\u003e, 391(6669):806–811, 1998.\u003c/p\u003e\n\u003cp\u003eJ. L. Rinn and H. Y. Chang. Genome regulation by long noncoding RNAs. \u003cem\u003eAnnual Review of Biochemistry\u003c/em\u003e, 81:145–166, 2012.\u003c/p\u003e\n\u003cp\u003eT. R. Cech and J. A. Steitz. The noncoding RNA revolution—trashing old rules to forge new ones. \u003cem\u003eCell\u003c/em\u003e, 157(1):77–94, 2014.\u003c/p\u003e\n\u003cp\u003eA. Regev and E. Shapiro. Cellular abstractions: cells as computation. \u003cem\u003eNature\u003c/em\u003e, 419(6905):343, 2001.\u003c/p\u003e\n\u003cp\u003eL. Cardelli. Abstract machines of systems biology. \u003cem\u003eTransactions on Computational Systems Biology III\u003c/em\u003e, pages 145–168, 2005.\u003c/p\u003e\n\u003cp\u003eW. Fontana and L. W. Buss. “The arrival of the fittest”: toward a theory of biological organization. \u003cem\u003eBulletin of Mathematical Biology\u003c/em\u003e, 56(1):1–64, 1994.\u003c/p\u003e\n\u003cp\u003eA. A. Aravin, G. J. Hannon, and J. Brennecke. The Piwi-piRNA pathway provides an adaptive defense in the transposon arms race. \u003cem\u003eScience\u003c/em\u003e, 318(5851):761–764, 2007.\u003c/p\u003e\n\u003cp\u003eL. Salmena, L. Poliseno, Y. Tay, L. Kats, and P. P. Pandolfi. A ceRNA hypothesis: the Rosetta Stone of a hidden RNA language? \u003cem\u003eCell\u003c/em\u003e, 146(3):353–358, 2011.\u003c/p\u003e\n\u003cp\u003eM.-C. Tsai, O. Manor, Y. Wan, N. Mosammaparast, J. K. Wang, F. Lan, Y. Shi, E. Segal, and H. Y. Chang. Long noncoding RNA as modular scaffold of histone modification complexes. \u003cem\u003eScience\u003c/em\u003e, 329(5992):689–693, 2010.\u003c/p\u003e\n\u003cp\u003eS. Mac Lane. \u003cem\u003eCategories for the Working Mathematician\u003c/em\u003e. Springer, 1971.\u003c/p\u003e\n\u003cp\u003eP. Wadler. Propositions as types. \u003cem\u003eCommunications of the ACM\u003c/em\u003e, 58(12):75–84, 2015.\u003c/p\u003e\n\u003cp\u003eB. C. Pierce. \u003cem\u003eTypes and Programming Languages\u003c/em\u003e. MIT Press, 2002.\u003c/p\u003e\n\u003cp\u003eK. Nishikura. Functions and regulation of RNA editing by ADAR deaminases. \u003cem\u003eAnnual Review of Biochemistry\u003c/em\u003e, 79:321–349, 2010.\u003c/p\u003e\n\u003cp\u003eN. Yoneda. On the homology theory of modules. \u003cem\u003eJournal of the Faculty of Science, University of Tokyo\u003c/em\u003e, 7:193–227, 1954.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n// Build sidebar TOC from h2/h3 in content\n(function(){\n  var nav=document.getElementById('toc-nav');\n  var headings=document.querySelectorAll('.main-content h2, .main-content h3');\n  if(!headings.length)return;\n  var items=[];\n  for(var i=0;i\u003cheadings.length;i++){\n    var h=headings[i];\n    if(!h.id){\n      h.id=h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');\n    }\n    items.push({tag:h.tagName,id:h.id,text:h.textContent.trim()});\n  }\n  var ul=document.createElement('ul');\n  var currentLi=null;\n  var subUl=null
