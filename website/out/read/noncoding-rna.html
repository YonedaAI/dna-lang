    &lt;h1 style=&quot;margin-top:0&quot;&gt;Non-Coding RNAs as Signals and Middleware — DNA-Lang, Part III&lt;/h1&gt;
    &lt;div class=&quot;paper-meta-row&quot;&gt;
      &lt;span&gt;Matthew Long&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;span&gt;YonedaAI Research Collective&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;span&gt;Chicago, IL&lt;/span&gt;
      &lt;span&gt;&amp;middot;&lt;/span&gt;
      &lt;a href=&quot;../papers/noncoding-rna.pdf&quot;&gt;PDF&lt;/a&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Keywords:&lt;/strong&gt; non-coding RNA, type theory, miRNA, siRNA, lncRNA, tRNA, rRNA, piRNA, category theory, natural transformation, colimit, middleware, guard clause, exception handling, RNA interference, RISC, post-transcriptional regulation&lt;/p&gt;
&lt;h1 data-number=&quot;1&quot; id=&quot;sec:intro&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1&lt;/span&gt; Introduction&lt;/h1&gt;
&lt;p&gt;The Central Dogma of molecular biology, in its most simplistic reading, posits a linear flow &lt;span class=&quot;math inline&quot;&gt;\text{DNA} \to \text{RNA} \to \text{Protein}&lt;/span&gt;. This reading assigns to RNA the role of a passive intermediate—a mere “messenger.” The genomic era has shattered this view. Deep sequencing reveals that while only &lt;span class=&quot;math inline&quot;&gt;\sim&lt;/span&gt;1.5% of the human genome encodes proteins, &lt;em&gt;over 80%&lt;/em&gt; is transcribed into RNA at some point in some cell type &lt;span class=&quot;citation&quot; data-cites=&quot;encode2012&quot;&gt;&lt;/span&gt;. The vast majority of the transcriptome—conservatively 98%—is &lt;em&gt;non-coding&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;This non-coding RNA (ncRNA) revolution poses a conceptual challenge: if these transcripts are not mere noise, what computational role do they play? We argue that the answer comes naturally from programming language theory. Non-coding RNAs are not data; they are &lt;em&gt;control flow&lt;/em&gt;. Specifically:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;miRNAs&lt;/strong&gt; are &lt;em&gt;guard clauses&lt;/em&gt;: short (&lt;span class=&quot;math inline&quot;&gt;\sim&lt;/span&gt;22 nt) sequences that post-transcriptionally test whether a target mRNA should be translated, repressing it if the guard evaluates to &lt;code&gt;true&lt;/code&gt; (i.e., if complementarity is sufficient).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;siRNAs&lt;/strong&gt; and the &lt;strong&gt;RNA interference&lt;/strong&gt; (RNAi) pathway implement &lt;em&gt;exception handling&lt;/em&gt;: the RISC complex is a pattern-matching exception handler that degrades mRNAs whose sequences match the loaded guide strand.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;lncRNAs&lt;/strong&gt; are &lt;em&gt;middleware scaffolds&lt;/em&gt;: they bring together protein complexes into higher-order regulatory assemblies, formalizable as categorical colimits.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;tRNAs&lt;/strong&gt; are &lt;em&gt;natural transformations&lt;/em&gt;: adaptors that mediate between the codon functor (reading mRNA) and the amino acid functor (building protein), satisfying naturality conditions.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;rRNAs&lt;/strong&gt; define the &lt;em&gt;virtual machine&lt;/em&gt;: the ribosome is the execution engine whose structure and catalytic center are RNA-based.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;piRNAs&lt;/strong&gt; are &lt;em&gt;security monitors&lt;/em&gt;: they silence transposable elements in the germline, acting as an anti-malware system.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;We unify these roles under a single parametric type &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt;, where &lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt; is the controlled process, and develop the associated formal theory.&lt;/p&gt;
&lt;h2 data-number=&quot;1.1&quot; id=&quot;related-work&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1.1&lt;/span&gt; Related Work&lt;/h2&gt;
&lt;p&gt;The analogy between molecular biology and computation has a long history, from von Neumann’s self-reproducing automata through Turing machine models of gene regulation. Regev and Shapiro &lt;span class=&quot;citation&quot; data-cites=&quot;regev2001&quot;&gt;&lt;/span&gt; modeled cellular processes in the &lt;span class=&quot;math inline&quot;&gt;\pi&lt;/span&gt;-calculus. Cardelli &lt;span class=&quot;citation&quot; data-cites=&quot;cardelli2005&quot;&gt;&lt;/span&gt; introduced abstract machines for molecular systems. Fontana and Buss &lt;span class=&quot;citation&quot; data-cites=&quot;fontana1994&quot;&gt;&lt;/span&gt; explored &lt;span class=&quot;math inline&quot;&gt;\lambda&lt;/span&gt;-calculus as a chemistry. Our contribution is the first systematic type-theoretic treatment of the full ncRNA landscape, emphasizing the role of non-coding transcripts as typed control-flow primitives rather than as data.&lt;/p&gt;
&lt;h2 data-number=&quot;1.2&quot; id=&quot;contributions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1.2&lt;/span&gt; Contributions&lt;/h2&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;A type-theoretic formalization of six major ncRNA classes as programming-language control-flow primitives.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The parametric type &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; unifying ncRNA control roles.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The &lt;em&gt;RISC Pattern-Matching Theorem&lt;/em&gt; (Theorem &lt;a href=&quot;#thm:risc&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:risc&quot;&gt;23&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The &lt;em&gt;Scaffold Colimit Theorem&lt;/em&gt; (Theorem &lt;a href=&quot;#thm:scaffold-colimit&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:scaffold-colimit&quot;&gt;26&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The &lt;em&gt;tRNA Natural Transformation Theorem&lt;/em&gt; (Theorem &lt;a href=&quot;#thm:trna-nat&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:trna-nat&quot;&gt;13&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;A complete, compilable Haskell implementation.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;1.3&quot; id=&quot;paper-organization&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;1.3&lt;/span&gt; Paper Organization&lt;/h2&gt;
&lt;p&gt;Sections &lt;a href=&quot;#sec:mirna&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:mirna&quot;&gt;2&lt;/a&gt;–&lt;a href=&quot;#sec:rrna&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:rrna&quot;&gt;6&lt;/a&gt; develop the formalization for each ncRNA class. Section &lt;a href=&quot;#sec:rnacontrol&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:rnacontrol&quot;&gt;7&lt;/a&gt; introduces the unifying type. Sections &lt;a href=&quot;#sec:rnai-typed&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:rnai-typed&quot;&gt;8&lt;/a&gt;–&lt;a href=&quot;#sec:pirna&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:pirna&quot;&gt;10&lt;/a&gt; present the main theorems. Section &lt;a href=&quot;#sec:haskell&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:haskell&quot;&gt;11&lt;/a&gt; describes the implementation. Section &lt;a href=&quot;#sec:discussion&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:discussion&quot;&gt;14&lt;/a&gt; concludes.&lt;/p&gt;
&lt;h1 data-number=&quot;2&quot; id=&quot;sec:mirna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2&lt;/span&gt; miRNA as Guard Clauses&lt;/h1&gt;
&lt;p&gt;MicroRNAs (miRNAs) are &lt;span class=&quot;math inline&quot;&gt;\sim&lt;/span&gt;22-nucleotide single-stranded RNA molecules that regulate gene expression post-transcriptionally. They are processed from longer precursors (pri-miRNA &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; pre-miRNA &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; mature miRNA) and loaded into Argonaute (AGO) proteins to form the miRNA-induced silencing complex (miRISC). The loaded miRNA then guides miRISC to complementary sites in the 3&lt;span class=&quot;math inline&quot;&gt;&amp;#39;&lt;/span&gt; UTR of target mRNAs, resulting in translational repression or mRNA destabilization.&lt;/p&gt;
&lt;h2 data-number=&quot;2.1&quot; id=&quot;the-guard-clause-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.1&lt;/span&gt; The Guard Clause Interpretation&lt;/h2&gt;
&lt;p&gt;In programming, a &lt;em&gt;guard clause&lt;/em&gt; is a conditional test that, when true, causes early termination or redirection of execution:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;translate :: mRNA -&amp;gt; Maybe Protein
translate msg
  | miRNAGuard seed msg = Nothing   -- repressed
  | otherwise           = Just (ribosome msg)&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The key insight is that the miRNA seed region (positions 2–8 of the guide strand) functions exactly as a &lt;em&gt;pattern&lt;/em&gt; in a guard clause.&lt;/p&gt;
&lt;div id=&quot;def:mirna-guard&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 1&lt;/strong&gt; (miRNA Guard).  Let &lt;span class=&quot;math inline&quot;&gt;\Sigma = \{A, U, G, C\}&lt;/span&gt; be the RNA alphabet. A &lt;em&gt;miRNA guard&lt;/em&gt; is a triple &lt;span class=&quot;math inline&quot;&gt;g = (s, \theta, \sigma)&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;s \in \Sigma^{6\text{--}8}&lt;/span&gt; is the &lt;em&gt;seed sequence&lt;/em&gt; (the pattern),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\theta \in [0,1]&lt;/span&gt; is the &lt;em&gt;repression threshold&lt;/em&gt; (minimum complementarity score),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\sigma : \Sigma^* &amp;times; \Sigma^* \to [0,1]&lt;/span&gt; is the &lt;em&gt;seed-match scoring function&lt;/em&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;The guard &lt;em&gt;fires&lt;/em&gt; on a target &lt;span class=&quot;math inline&quot;&gt;t \in \Sigma^*&lt;/span&gt; if and only if &lt;span class=&quot;math inline&quot;&gt;\sigma(s, t) &amp;ge; \theta&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;def:seed-score&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 2&lt;/strong&gt; (Seed Match Score).  Given seed &lt;span class=&quot;math inline&quot;&gt;s = s_1 s_2 &amp;middot;s s_k&lt;/span&gt; and a target subsequence &lt;span class=&quot;math inline&quot;&gt;t = t_1 t_2 &amp;middot;s t_k&lt;/span&gt;, define the &lt;em&gt;Watson–Crick complementarity indicator&lt;/em&gt;: &lt;span class=&quot;math display&quot;&gt;\mathrm{wc}(a, b) =
  \begin{cases}
    1 &amp;amp; \text{if } (a,b) \in \{(A,U),(U,A),(G,C),(C,G)\} \\
    0.5 &amp;amp; \text{if } (a,b) \in \{(G,U),(U,G)\} \quad\text{(wobble)} \\
    0 &amp;amp; \text{otherwise}
  \end{cases}&lt;/span&gt; Then: &lt;span class=&quot;math display&quot;&gt;\sigma(s, t) = \frac{1}{k}\sum_{i=1}^{k} \mathrm{wc}(s_i, t_i)&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;prop:guard-compose&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 3&lt;/strong&gt; (Guard Compositionality).  &lt;em&gt;Let &lt;span class=&quot;math inline&quot;&gt;g_1 = (s_1, \theta_1, \sigma)&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;g_2 = (s_2, \theta_2, \sigma)&lt;/span&gt; be miRNA guards targeting the same mRNA &lt;span class=&quot;math inline&quot;&gt;m&lt;/span&gt;. Define the &lt;em&gt;cooperative guard&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;g_1 \wedge g_2&lt;/span&gt; by: &lt;span class=&quot;math display&quot;&gt;(g_1 \wedge g_2)(m) = g_1(m) \lor g_2(m)&lt;/span&gt; Then the effective repression of &lt;span class=&quot;math inline&quot;&gt;m&lt;/span&gt; under multiple miRNAs is captured by the disjunction of individual guards. If miRNAs act cooperatively, the effective threshold is lowered: &lt;span class=&quot;math display&quot;&gt;\theta_{\text{eff}} = \min(\theta_1, \theta_2) &amp;middot;
  (1 - \alpha &amp;middot; \mathbb{1}[\text{sites within 40\,nt}])&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\alpha \in [0, 0.3]&lt;/span&gt; is the cooperativity factor.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;2.2&quot; id=&quot;target-multiplicity-and-the-many-to-many-relation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;2.2&lt;/span&gt; Target Multiplicity and the Many-to-Many Relation&lt;/h2&gt;
&lt;p&gt;A single miRNA can target hundreds of distinct mRNAs, and a single mRNA can be targeted by many miRNAs. This yields a bipartite graph &lt;span class=&quot;math inline&quot;&gt;G = (M, T, E)&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;M&lt;/span&gt; is the set of miRNAs, &lt;span class=&quot;math inline&quot;&gt;T&lt;/span&gt; the set of target mRNAs, and &lt;span class=&quot;math inline&quot;&gt;E \subseteq M &amp;times; T&lt;/span&gt; the targeting relation.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 4&lt;/strong&gt; (miRNA Regulatory Network).  The &lt;em&gt;miRNA regulatory network&lt;/em&gt; is the profunctor &lt;span class=&quot;math inline&quot;&gt;\mathcal{R} : M^{\mathrm{op}} &amp;times; T \to \mathbf{Set}&lt;/span&gt; defined by: &lt;span class=&quot;math display&quot;&gt;\mathcal{R}(m, t) = \{(i, \sigma_i) \mid
    \text{site } i \text{ in 3&amp;#39;\,UTR of } t \text{ matches seed of } m
    \text{ with score } \sigma_i &amp;ge; \theta_m\}&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;This profunctor captures not just &lt;em&gt;whether&lt;/em&gt; targeting occurs but &lt;em&gt;where&lt;/em&gt; and &lt;em&gt;how strongly&lt;/em&gt;.&lt;/p&gt;
&lt;h1 data-number=&quot;3&quot; id=&quot;sec:sirna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3&lt;/span&gt; siRNA and RNA Interference as Exception Handling&lt;/h1&gt;
&lt;p&gt;Small interfering RNAs (siRNAs) are &lt;span class=&quot;math inline&quot;&gt;\sim&lt;/span&gt;20–25 nt double-stranded RNA molecules that trigger the RNA interference (RNAi) pathway. Unlike miRNAs, which typically achieve partial complementarity and translational repression, siRNAs achieve &lt;em&gt;perfect&lt;/em&gt; or &lt;em&gt;near-perfect&lt;/em&gt; complementarity with their targets, leading to endonucleolytic cleavage and degradation.&lt;/p&gt;
&lt;h2 data-number=&quot;3.1&quot; id=&quot;the-exception-handling-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.1&lt;/span&gt; The Exception-Handling Interpretation&lt;/h2&gt;
&lt;p&gt;The RNAi pathway closely parallels a typed exception-handling system:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Exception generation&lt;/strong&gt;: Double-stranded RNA (dsRNA) signals an anomaly (e.g., viral replication, transposon activity). This is the &lt;code&gt;throw&lt;/code&gt; statement.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Exception processing&lt;/strong&gt;: The enzyme Dicer cleaves dsRNA into &lt;span class=&quot;math inline&quot;&gt;\sim&lt;/span&gt;21 nt siRNA duplexes—breaking the exception into typed fragments.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Handler registration&lt;/strong&gt;: One strand (the &lt;em&gt;guide strand&lt;/em&gt;) is loaded into the RISC complex, registering the exception handler.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Pattern matching&lt;/strong&gt;: RISC scans the transcriptome, testing each mRNA against the guide strand by sequence complementarity—this is pattern matching.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Exception propagation&lt;/strong&gt;: Upon a match, AGO2 cleaves the target mRNA, propagating the “exception” (silencing) to all copies.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div id=&quot;def:rnai-exception&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 5&lt;/strong&gt; (RNAi Exception Type).  An &lt;em&gt;RNAi exception&lt;/em&gt; is a tuple &lt;span class=&quot;math inline&quot;&gt;\varepsilon = (d, c, g, h)&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;d \in \Sigma^*&lt;/span&gt; is the trigger dsRNA (the thrown exception),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;c : \Sigma^* \to [\Sigma^{21}]&lt;/span&gt; is the Dicer cleavage function (exception decomposition),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;g \in \Sigma^{21}&lt;/span&gt; is the selected guide strand,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;h : \Sigma^{21} &amp;times; \Sigma^* \to \{\mathsf{Cleave},
    \mathsf{Pass}\}&lt;/span&gt; is the RISC handler function.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div id=&quot;def:risc-handler&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 6&lt;/strong&gt; (RISC Handler).  The RISC handler &lt;span class=&quot;math inline&quot;&gt;h&lt;/span&gt; is defined by: &lt;span class=&quot;math display&quot;&gt;h(g, m) =
  \begin{cases}
    \mathsf{Cleave} &amp;amp; \text{if } \mathrm{hamming}(g, \mathrm{rc}(m_i)) &amp;le; \delta
      \text{ for some site } i \\
    \mathsf{Pass} &amp;amp; \text{otherwise}
  \end{cases}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathrm{rc}&lt;/span&gt; denotes the reverse complement and &lt;span class=&quot;math inline&quot;&gt;\delta&lt;/span&gt; is the mismatch tolerance (typically 0 for siRNAs, &lt;span class=&quot;math inline&quot;&gt;&amp;le; 4&lt;/span&gt; for miRNAs).&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 7&lt;/strong&gt; (Specificity–Sensitivity Tradeoff).  &lt;em&gt;Let &lt;span class=&quot;math inline&quot;&gt;\delta&lt;/span&gt; be the mismatch tolerance of the RISC handler.&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\delta = 0&lt;/span&gt; (perfect match) yields maximum specificity but limited sensitivity. This is the siRNA regime.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\delta &amp;le; 4&lt;/span&gt; (partial match) yields lower specificity but broader regulatory reach. This is the miRNA regime.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;em&gt;The type system enforces: &lt;span class=&quot;math display&quot;&gt;\text{siRNA} &amp;lt;: \text{miRNA}&lt;/span&gt; in the sense that siRNA-mediated cleavage is a &lt;em&gt;strict&lt;/em&gt; subcase of miRNA-mediated repression.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;3.2&quot; id=&quot;the-exception-hierarchy&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;3.2&lt;/span&gt; The Exception Hierarchy&lt;/h2&gt;
&lt;p&gt;We organize the RNAi-related exceptions into a type hierarchy:&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}[column sep=small]
  &amp;amp; \mathsf{RNAException} \arrow[dl] \arrow[dr] &amp;amp; \\
  \mathsf{SiRNAException} \arrow[d] &amp;amp; &amp;amp; \mathsf{MiRNAException} \arrow[d] \\
  \mathsf{ViralDefense} &amp;amp; &amp;amp; \mathsf{TranslationalRepression}
\end{tikzcd}&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;This hierarchy ensures that handlers for general &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAException}&lt;/span&gt; can catch both siRNA- and miRNA-generated signals, while specialized handlers can discriminate.&lt;/p&gt;
&lt;h1 data-number=&quot;4&quot; id=&quot;sec:lncrna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4&lt;/span&gt; lncRNA as Middleware and Scaffolds&lt;/h1&gt;
&lt;p&gt;Long non-coding RNAs (lncRNAs) are transcripts exceeding 200 nucleotides that do not encode proteins. Their functions are extraordinarily diverse: they act as scaffolds for chromatin-modifying complexes (e.g., HOTAIR, Xist), as decoys sequestering transcription factors or miRNAs, as guides recruiting regulatory complexes to specific genomic loci, and as enhancer-derived transcripts (eRNAs) facilitating gene activation.&lt;/p&gt;
&lt;h2 data-number=&quot;4.1&quot; id=&quot;the-middleware-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.1&lt;/span&gt; The Middleware Interpretation&lt;/h2&gt;
&lt;p&gt;In software architecture, &lt;em&gt;middleware&lt;/em&gt; is software that sits between the operating system and applications, providing services such as message passing, authentication, transaction management, and resource brokering. LncRNAs play an analogous role in the cell.&lt;/p&gt;
&lt;div id=&quot;def:lncrna-middleware&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 8&lt;/strong&gt; (lncRNA Middleware).  An &lt;em&gt;lncRNA middleware&lt;/em&gt; is a tuple &lt;span class=&quot;math inline&quot;&gt;\mu = (l, B, \phi, \psi)&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; is the lncRNA transcript (the middleware module),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;B = \{b_1, &amp;hellip;, b_n\}&lt;/span&gt; is a set of &lt;em&gt;binding partners&lt;/em&gt; (proteins, other RNAs, or DNA loci),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\phi : l \to 2^B&lt;/span&gt; is the &lt;em&gt;binding function&lt;/em&gt; mapping structural domains of &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; to subsets of binding partners,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\psi : 2^B \to \mathsf{Effect}&lt;/span&gt; is the &lt;em&gt;effector function&lt;/em&gt; mapping assembled complexes to downstream effects.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;p&gt;The composition &lt;span class=&quot;math inline&quot;&gt;\psi \circ \phi&lt;/span&gt; maps lncRNA structural features directly to biological effects, with the lncRNA serving as the &lt;em&gt;middleware&lt;/em&gt; that mediates between signal and response.&lt;/p&gt;
&lt;h2 data-number=&quot;4.2&quot; id=&quot;the-scaffold-as-categorical-colimit&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.2&lt;/span&gt; The Scaffold as Categorical Colimit&lt;/h2&gt;
&lt;p&gt;When a lncRNA assembles multiple proteins into a functional complex, it is computing a &lt;em&gt;colimit&lt;/em&gt; in the category of molecular assemblies.&lt;/p&gt;
&lt;div id=&quot;def:assembly-diagram&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 9&lt;/strong&gt; (Assembly Diagram).  Let &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt; be the category whose objects are molecular species (proteins, RNAs, DNA loci) and whose morphisms are binding interactions. An &lt;em&gt;assembly diagram&lt;/em&gt; for a lncRNA scaffold &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; is a functor &lt;span class=&quot;math inline&quot;&gt;D : J \to \mathcal{C}&lt;/span&gt; from a small indexing category &lt;span class=&quot;math inline&quot;&gt;J&lt;/span&gt; (encoding the combinatorics of binding) to &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 10&lt;/strong&gt; (HOTAIR Scaffold).  The lncRNA HOTAIR binds PRC2 at its 5&lt;span class=&quot;math inline&quot;&gt;&amp;#39;&lt;/span&gt; end and the LSD1/CoREST/REST complex at its 3&lt;span class=&quot;math inline&quot;&gt;&amp;#39;&lt;/span&gt; end, bridging two chromatin modification activities. The assembly diagram is: &lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}
  \text{PRC2} &amp;amp; \text{HOTAIR} \arrow[l, &amp;quot;\phi_1&amp;quot;&amp;#39;] \arrow[r, &amp;quot;\phi_2&amp;quot;] &amp;amp;
  \text{LSD1/CoREST}
\end{tikzcd}&lt;/span&gt; The scaffold colimit is the assembled complex &lt;span class=&quot;math inline&quot;&gt;\text{PRC2--HOTAIR--LSD1/CoREST}&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;4.3&quot; id=&quot;functional-classification-of-lncrna-middleware&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;4.3&lt;/span&gt; Functional Classification of lncRNA Middleware&lt;/h2&gt;
&lt;div id=&quot;tab:lncrna-roles&quot;&gt;
&lt;table&gt;
&lt;caption&gt;lncRNA middleware roles and their software analogues.&lt;/caption&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;lncRNA Role&lt;/strong&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/th&gt;
&lt;th style=&quot;text-align: left;&quot;&gt;&lt;strong&gt;Software Analogue&lt;/strong&gt;&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;Scaffold&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;HOTAIR&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;Service bus / message broker&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;Guide&lt;/td&gt;
&lt;td style=&quot;text-align: left;&quot;&gt;Xist&lt;/td&gt;
