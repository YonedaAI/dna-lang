&lt;h1 data-number=&quot;5&quot; id=&quot;sec:trna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5&lt;/span&gt; tRNA as Natural Transformation&lt;/h1&gt;
&lt;p&gt;Transfer RNAs (tRNAs) are the molecular adaptors that decode the genetic code during translation. Each tRNA carries an amino acid and presents an anticodon complementary to a specific mRNA codon.&lt;/p&gt;
&lt;h2 data-number=&quot;5.1&quot; id=&quot;the-natural-transformation-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.1&lt;/span&gt; The Natural Transformation Interpretation&lt;/h2&gt;
&lt;div id=&quot;def:codon-functor&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 11&lt;/strong&gt; (Codon Functor).  Let &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}&lt;/span&gt; be the category of genetic sequences (objects are sequence positions, morphisms are reading frame shifts). The &lt;em&gt;codon functor&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;F : \mathcal{G} \to \mathbf{Set}&lt;/span&gt; maps each position to the codon triplet at that position: &lt;span class=&quot;math display&quot;&gt;F(i) = (m_i, m_{i+1}, m_{i+2}) \in \Sigma^3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;def:aa-functor&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 12&lt;/strong&gt; (Amino Acid Functor).  The &lt;em&gt;amino acid functor&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;G : \mathcal{G} \to \mathbf{Set}&lt;/span&gt; maps each position to the set of amino acids that could be incorporated at that position: &lt;span class=&quot;math display&quot;&gt;G(i) = \{a \in \mathcal{A} \mid \exists\, \text{tRNA}_{a,c} \text{ with anticodon } c \text{ matching } F(i)\}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathcal{A}&lt;/span&gt; is the set of 20 standard amino acids.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:trna-nat&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 13&lt;/strong&gt; (tRNA as Natural Transformation).  &lt;em&gt;The collection of tRNAs defines a natural transformation &lt;span class=&quot;math inline&quot;&gt;\eta : F &amp;rArr; G&lt;/span&gt; from the codon functor to the amino acid functor. Specifically, for each position &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt;: &lt;span class=&quot;math display&quot;&gt;\eta_i : F(i) \to G(i)&lt;/span&gt; maps the codon at position &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; to the amino acid carried by the cognate tRNA. Naturality requires that for any reading-frame morphism &lt;span class=&quot;math inline&quot;&gt;f : i \to j&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;\mathcal{G}&lt;/span&gt;: &lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}
  F(i) \arrow[r, &amp;quot;\eta_i&amp;quot;] \arrow[d, &amp;quot;F(f)&amp;quot;&amp;#39;] &amp;amp; G(i) \arrow[d, &amp;quot;G(f)&amp;quot;] \\
  F(j) \arrow[r, &amp;quot;\eta_j&amp;quot;&amp;#39;] &amp;amp; G(j)
\end{tikzcd}&lt;/span&gt; commutes.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; Naturality follows from the &lt;em&gt;universality of the genetic code&lt;/em&gt;: the mapping from codons to amino acids is position-independent. That is, the same codon yields the same amino acid regardless of where it appears in the mRNA. Formally, if &lt;span class=&quot;math inline&quot;&gt;f : i \to j&lt;/span&gt; is a position shift and &lt;span class=&quot;math inline&quot;&gt;F(f)&lt;/span&gt; carries the codon at position &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; to the codon at position &lt;span class=&quot;math inline&quot;&gt;j&lt;/span&gt;, then: &lt;span class=&quot;math display&quot;&gt;G(f)(\eta_i(F(i))) = \eta_j(F(f)(F(i)))&lt;/span&gt; because the tRNA that decodes a given codon does not depend on the codon’s position in the transcript. This is precisely the commutativity of the naturality square. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;5.2&quot; id=&quot;wobble-pairing-and-lax-naturality&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.2&lt;/span&gt; Wobble Pairing and Lax Naturality&lt;/h2&gt;
&lt;p&gt;The wobble base-pairing rules allow certain tRNAs to recognize multiple codons. This relaxes strict naturality to &lt;em&gt;lax naturality&lt;/em&gt;:&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 14&lt;/strong&gt; (Wobble-Extended Natural Transformation).  The &lt;em&gt;wobble-extended&lt;/em&gt; tRNA mapping &lt;span class=&quot;math inline&quot;&gt;\tilde{\eta}&lt;/span&gt; is a lax natural transformation where the naturality squares commute up to a specified 2-cell &lt;span class=&quot;math inline&quot;&gt;\alpha&lt;/span&gt;: &lt;span class=&quot;math display&quot;&gt;G(f) \circ \tilde{\eta}_i \cong \tilde{\eta}_j \circ F(f)
  \quad \text{(up to wobble equivalence)}&lt;/span&gt; where wobble equivalence identifies codons that differ only in the third (wobble) position and are decoded by the same tRNA.&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;5.3&quot; id=&quot;codon-degeneracy-as-kernel&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;5.3&lt;/span&gt; Codon Degeneracy as Kernel&lt;/h2&gt;
&lt;p&gt;The degeneracy of the genetic code (multiple codons encoding the same amino acid) is precisely the &lt;em&gt;kernel&lt;/em&gt; of the natural transformation &lt;span class=&quot;math inline&quot;&gt;\eta&lt;/span&gt;: &lt;span class=&quot;math display&quot;&gt;\ker(\eta) = \{(c_1, c_2) \in \Sigma^3 &amp;times; \Sigma^3 \mid
    \eta(c_1) = \eta(c_2)\}&lt;/span&gt; This kernel defines an equivalence relation whose equivalence classes are the synonymous codon families (e.g., &lt;span class=&quot;math inline&quot;&gt;\{&lt;/span&gt;UCU, UCC, UCA, UCG&lt;span class=&quot;math inline&quot;&gt;\}&lt;/span&gt; for Serine).&lt;/p&gt;
&lt;h1 data-number=&quot;6&quot; id=&quot;sec:rrna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6&lt;/span&gt; rRNA as Virtual Machine&lt;/h1&gt;
&lt;p&gt;Ribosomal RNA (rRNA) constitutes the structural and catalytic core of the ribosome, the molecular machine that translates mRNA into protein. In eukaryotes, the ribosome consists of a small (40S) and a large (60S) subunit, together forming the 80S ribosome. Remarkably, the peptidyl transferase activity—the catalytic heart of translation—resides in the 23S/28S rRNA, not in any ribosomal protein.&lt;/p&gt;
&lt;h2 data-number=&quot;6.1&quot; id=&quot;the-virtual-machine-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.1&lt;/span&gt; The Virtual Machine Interpretation&lt;/h2&gt;
&lt;p&gt;The ribosome is the &lt;em&gt;virtual machine&lt;/em&gt; (VM) on which the genetic program executes. The rRNAs define the VM’s architecture:&lt;/p&gt;
&lt;div id=&quot;def:ribosome-vm&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 15&lt;/strong&gt; (Ribosome VM).  The &lt;em&gt;ribosome virtual machine&lt;/em&gt; is a tuple &lt;span class=&quot;math inline&quot;&gt;\mathcal{V} = (S, I, \delta, s_0, F)&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;S = \{&lt;/span&gt;&lt;span class=&quot;sans-serif&quot;&gt;Scanning&lt;/span&gt;, &lt;span class=&quot;sans-serif&quot;&gt;Initiation&lt;/span&gt;, &lt;span class=&quot;sans-serif&quot;&gt;Elongation&lt;/span&gt;, &lt;span class=&quot;sans-serif&quot;&gt;Termination&lt;/span&gt;&lt;span class=&quot;math inline&quot;&gt;\}&lt;/span&gt; is the set of machine states,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;I = \Sigma^3&lt;/span&gt; is the instruction set (codons),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\delta : S &amp;times; I \to S &amp;times; \mathcal{A}^*&lt;/span&gt; is the transition function,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;s_0 = Scanning&lt;/span&gt; is the initial state,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;F = \{Termination\}&lt;/span&gt; is the set of accepting states.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 16&lt;/strong&gt; (rRNA as VM Microcode).  &lt;em&gt;The rRNA components provide the following VM services:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;16S/18S rRNA&lt;/strong&gt;: instruction fetch and decode (codon–anticodon recognition in the A site),&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;23S/28S rRNA&lt;/strong&gt;: the ALU—peptidyl transferase center catalyzes peptide bond formation,&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;5S/5.8S rRNA&lt;/strong&gt;: structural scaffolding of the large subunit (memory bus).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;6.2&quot; id=&quot;execution-semantics&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;6.2&lt;/span&gt; Execution Semantics&lt;/h2&gt;
&lt;p&gt;Translation can be described by the following operational semantics. Let &lt;span class=&quot;math inline&quot;&gt;\Gamma&lt;/span&gt; denote the execution context (mRNA, tRNA pool, ribosome state).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\frac{
  \Gamma \vdash \text{codon}(i) = c \quad
  \Gamma \vdash \text{tRNA}(c) = (a, \text{tRNA}_c) \quad
  c \notin \{\text{UAA}, \text{UAG}, \text{UGA}\}
}{
  \Gamma \vdash \langle Elong, i, p \rangle
    \longrightarrow \langle Elong, i{+}3, p &amp;middot; a \rangle
}
\;[E-Elongation]&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\frac{
  \Gamma \vdash \text{codon}(i) = c \quad
  c \in \{\text{UAA}, \text{UAG}, \text{UGA}\}
}{
  \Gamma \vdash \langle Elong, i, p \rangle
    \longrightarrow \langle Term, i, p \rangle
}
\;[E-Termination]&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;math display&quot;&gt;\frac{
  \Gamma \vdash \text{codon}(i) = \text{AUG}
}{
  \Gamma \vdash \langle Scan, i, \epsilon \rangle
    \longrightarrow \langle Elong, i{+}3, \text{Met} \rangle
}
\;[E-Initiation]&lt;/span&gt;&lt;/p&gt;
&lt;h1 data-number=&quot;7&quot; id=&quot;sec:rnacontrol&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7&lt;/span&gt; The &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; Type&lt;/h1&gt;
&lt;p&gt;We now introduce the central type of our framework, parameterized by the process being controlled.&lt;/p&gt;
&lt;div id=&quot;def:rnacontrol&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 17&lt;/strong&gt; (RNAControl Type).  The &lt;em&gt;RNAControl&lt;/em&gt; type, parameterized by a process type &lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt;, is defined as the sum type: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
  \mathsf{RNAControl}\langle P\rangle \;::=\;
    &amp;amp;\; \mathsf{MiRNA}\;\{\;\mathit{seed} : \Sigma^{6\text{--}8},\;
      \mathit{targets} : [P],\;
      \mathit{threshold} : [0,1]\;\} \\
    \mid\; &amp;amp;\; \mathsf{SiRNA}\;\{\;\mathit{guide} : \Sigma^{21},\;
      \mathit{passenger} : \Sigma^{21},\;
      \mathit{handler} : P \to \mathsf{Effect}\;\} \\
    \mid\; &amp;amp;\; \mathsf{LncRNA}\;\{\;\mathit{sequence} : \Sigma^*,\;
      \mathit{partners} : [\mathsf{Molecule}],\;
      \mathit{scaffold} : [\mathsf{Molecule}] \to \mathsf{Complex}\;\} \\
    \mid\; &amp;amp;\; \mathsf{TRNA}\;\{\;\mathit{anticodon} : \Sigma^3,\;
      \mathit{aminoAcid} : \mathcal{A},\;
      \mathit{adapt} : \Sigma^3 \to \mathcal{A}\;\} \\
    \mid\; &amp;amp;\; \mathsf{RRNA}\;\{\;\mathit{subunit} : \mathsf{SubunitType},\;
      \mathit{execute} : P \to \mathsf{Protein}\;\} \\
    \mid\; &amp;amp;\; \mathsf{PiRNA}\;\{\;\mathit{guide} : \Sigma^{24\text{--}31},\;
      \mathit{target} : \mathsf{Transposon},\;
      \mathit{silence} : \mathsf{Transposon} \to \mathsf{Effect}\;\}
\end{align*}&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 18&lt;/strong&gt; (Exhaustiveness).  &lt;em&gt;Every known functional class of non-coding RNA in the eukaryotic cell maps to exactly one constructor of &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; (or to a composition thereof).&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;remark&quot;&gt;
&lt;p&gt;&lt;strong&gt;Remark 19&lt;/strong&gt;.  The type parameter &lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt; allows the same framework to describe ncRNA control at different levels of abstraction:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle\mathsf{mRNA}\rangle&lt;/span&gt;: post-transcriptional control of individual transcripts,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle\mathsf{Gene}\rangle&lt;/span&gt;: gene-level regulation,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle\mathsf{Pathway}\rangle&lt;/span&gt;: pathway-level control.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;7.1&quot; id=&quot;functor-instance&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;7.1&lt;/span&gt; Functor Instance&lt;/h2&gt;
&lt;div id=&quot;prop:rnacontrol-functor&quot; class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 20&lt;/strong&gt; (&lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}&lt;/span&gt; is a Functor).  &lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}&lt;/span&gt; admits a functorial action: given a morphism &lt;span class=&quot;math inline&quot;&gt;f : P \to Q&lt;/span&gt; between process types, we obtain &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}(f) : \mathsf{RNAControl}\langle P\rangle \to \mathsf{RNAControl}\langle Q\rangle&lt;/span&gt; defined by: &lt;span class=&quot;math display&quot;&gt;\begin{align*}
  \mathsf{RNAControl}(f)(\mathsf{MiRNA}(s, ts, \theta)) &amp;amp;=
    \mathsf{MiRNA}(s, \mathrm{map}\;f\;ts, \theta) \\
  \mathsf{RNAControl}(f)(\mathsf{SiRNA}(g, p, h)) &amp;amp;=
    \mathsf{SiRNA}(g, p, h \circ f^{-1}) \\
  &amp;amp;\;\vdots
\end{align*}&lt;/span&gt; where the remaining cases follow by applying &lt;span class=&quot;math inline&quot;&gt;f&lt;/span&gt; or &lt;span class=&quot;math inline&quot;&gt;f^{-1}&lt;/span&gt; to each occurrence of &lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt; in the constructor fields. The functor laws hold by construction.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;8&quot; id=&quot;sec:rnai-typed&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;8&lt;/span&gt; RNAi as a Typed Exception System&lt;/h1&gt;
&lt;p&gt;We now present the main theorem characterizing RNA interference as typed pattern matching.&lt;/p&gt;
&lt;div id=&quot;def:seq-pattern&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 21&lt;/strong&gt; (Sequence Pattern).  A &lt;em&gt;sequence pattern&lt;/em&gt; is a pair &lt;span class=&quot;math inline&quot;&gt;\pi = (g, \delta)&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;g \in \Sigma^{21}&lt;/span&gt; is the guide sequence and &lt;span class=&quot;math inline&quot;&gt;\delta \in \mathbb{N}&lt;/span&gt; is the mismatch tolerance. A target &lt;span class=&quot;math inline&quot;&gt;t \in \Sigma^*&lt;/span&gt; &lt;em&gt;matches&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;\pi&lt;/span&gt; at position &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt; if: &lt;span class=&quot;math display&quot;&gt;\mathrm{hamming}(g, \overline{t[i..i{+}20]}) &amp;le; \delta&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\overline{(&amp;middot;)}&lt;/span&gt; denotes the reverse complement.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 22&lt;/strong&gt; (Typed Pattern Matching).  A &lt;em&gt;typed pattern-matching system&lt;/em&gt; is a tuple &lt;span class=&quot;math inline&quot;&gt;(\Pi, T, \mathsf{match})&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\Pi&lt;/span&gt; is a set of patterns,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;T&lt;/span&gt; is a set of targets,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{match} : \Pi &amp;times; T \to \{\top, \bot\}&lt;/span&gt; is the matching function.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;It is &lt;em&gt;typed&lt;/em&gt; if patterns and targets carry type annotations and matching respects the type discipline—i.e., a pattern of type &lt;span class=&quot;math inline&quot;&gt;\tau&lt;/span&gt; can only match targets of type &lt;span class=&quot;math inline&quot;&gt;\tau&lt;/span&gt; or a subtype thereof.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:risc&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 23&lt;/strong&gt; (RISC Pattern-Matching Theorem).  &lt;em&gt;The RISC complex implements a typed pattern-matching system &lt;span class=&quot;math inline&quot;&gt;(\Pi_{\mathrm{RISC}}, T_{\text{mRNA}}, \mathsf{match}_{\mathrm{RISC}})&lt;/span&gt; where:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The pattern set &lt;span class=&quot;math inline&quot;&gt;\Pi_{\mathrm{RISC}}&lt;/span&gt; consists of all loaded guide strands, each carrying the type annotation of its source (siRNA vs. miRNA).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The target set &lt;span class=&quot;math inline&quot;&gt;T_{\text{mRNA}}&lt;/span&gt; is the cellular transcriptome.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The matching function &lt;span class=&quot;math inline&quot;&gt;\mathsf{match}_{\mathrm{RISC}}&lt;/span&gt; satisfies:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Determinism&lt;/strong&gt;: For each guide–target pair, the match outcome is deterministic.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Type discrimination&lt;/strong&gt;: siRNA guides (&lt;span class=&quot;math inline&quot;&gt;\delta = 0&lt;/span&gt;) yield cleavage; miRNA guides (&lt;span class=&quot;math inline&quot;&gt;\delta &amp;gt; 0&lt;/span&gt;) yield repression.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Exhaustive scanning&lt;/strong&gt;: every mRNA in the transcriptome is tested against every loaded guide.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The system satisfies the &lt;em&gt;progress&lt;/em&gt; and &lt;em&gt;preservation&lt;/em&gt; properties of a well-typed evaluation:&lt;/em&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Progress&lt;/strong&gt;: If a guide is loaded and a target exists with complementarity &lt;span class=&quot;math inline&quot;&gt;&amp;le; \delta&lt;/span&gt;, cleavage/repression will occur.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Preservation&lt;/strong&gt;: The type of the silencing action (cleavage vs. repression) is preserved throughout the silencing process.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; We verify each property:&lt;/p&gt;
&lt;p&gt;(i) Guide strands are loaded into RISC as single-stranded RNA with known provenance (Dicer processing of dsRNA for siRNA; Drosha/Dicer processing of pri-miRNA for miRNA). The provenance annotation serves as the type tag.&lt;/p&gt;
&lt;p&gt;(ii) The transcriptome is accessible to cytoplasmic RISC.&lt;/p&gt;
&lt;p&gt;(iii-a) Complementarity is a deterministic function of sequence.&lt;/p&gt;
&lt;p&gt;(iii-b) AGO2, the catalytic component of RISC, requires extensive base-pairing (positions 2–21, with tolerance &lt;span class=&quot;math inline&quot;&gt;\delta&lt;/span&gt;) for endonucleolytic cleavage. When complementarity is partial (miRNA-type), the complex instead recruits deadenylation and translational repression factors. Thus the mismatch tolerance &lt;span class=&quot;math inline&quot;&gt;\delta&lt;/span&gt; determines the outcome type.&lt;/p&gt;
&lt;p&gt;(iii-c) RISC scans by three-dimensional diffusion and sampling, giving all mRNAs a non-zero probability of encounter.&lt;/p&gt;
&lt;p&gt;Progress follows from the thermodynamic favorability of guide–target hybridization: if complementarity is sufficient, the duplex forms spontaneously.&lt;/p&gt;
&lt;p&gt;Preservation follows from the structural integrity of the RISC complex: once a guide is loaded, it remains stably associated with AGO, ensuring the same type of silencing action throughout the guide’s lifetime. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;9&quot; id=&quot;sec:scaffold-colimit&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;9&lt;/span&gt; The Scaffold Colimit Theorem&lt;/h1&gt;
&lt;p&gt;We now formalize the observation that lncRNA-mediated scaffold assembly satisfies the universal property of a colimit.&lt;/p&gt;
&lt;div id=&quot;def:binding-cat&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 24&lt;/strong&gt; (Binding Category).  For a lncRNA scaffold &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; with binding partners &lt;span class=&quot;math inline&quot;&gt;B = \{b_1, &amp;hellip;,
b_n\}&lt;/span&gt;, define the &lt;em&gt;binding category&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;\mathcal{B}_l&lt;/span&gt; as follows:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Objects: the binding domains &lt;span class=&quot;math inline&quot;&gt;\{d_1, &amp;hellip;, d_k\}&lt;/span&gt; of &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; together with the partners &lt;span class=&quot;math inline&quot;&gt;B&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Morphisms: &lt;span class=&quot;math inline&quot;&gt;d_i \to b_j&lt;/span&gt; if domain &lt;span class=&quot;math inline&quot;&gt;d_i&lt;/span&gt; binds partner &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt;; &lt;span class=&quot;math inline&quot;&gt;b_j \to b_{j&amp;#39;}&lt;/span&gt; if partners &lt;span class=&quot;math inline&quot;&gt;j&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;j&amp;#39;&lt;/span&gt; interact when co-scaffolded.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div id=&quot;def:assembly-functor&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 25&lt;/strong&gt; (Assembly Functor).  The &lt;em&gt;assembly functor&lt;/em&gt; &lt;span class=&quot;math inline&quot;&gt;A : \mathcal{B}_l \to \mathcal{C}&lt;/span&gt; maps:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Each binding domain &lt;span class=&quot;math inline&quot;&gt;d_i&lt;/span&gt; to the corresponding structural region of &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; in the category of molecular assemblies &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Each partner &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt; to the molecule &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Each binding morphism to the binding interaction in &lt;span class=&quot;math inline&quot;&gt;\mathcal{C}&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div id=&quot;thm:scaffold-colimit&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 26&lt;/strong&gt; (Scaffold Colimit Theorem).  &lt;em&gt;Let &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; be a lncRNA scaffold with binding category &lt;span class=&quot;math inline&quot;&gt;\mathcal{B}_l&lt;/span&gt; and assembly functor &lt;span class=&quot;math inline&quot;&gt;A : \mathcal{B}_l \to \mathcal{C}&lt;/span&gt;. Then the assembled ribonucleoprotein complex &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; satisfies the universal property of the colimit: &lt;span class=&quot;math display&quot;&gt;\mathsf{RNP}_l \cong \mathrm{colim}(A)&lt;/span&gt; That is, for any molecular complex &lt;span class=&quot;math inline&quot;&gt;X&lt;/span&gt; and family of binding maps &lt;span class=&quot;math inline&quot;&gt;\{f_i : A(b_i) \to X\}&lt;/span&gt; compatible with the diagram, there exists a unique map &lt;span class=&quot;math inline&quot;&gt;u : \mathsf{RNP}_l \to X&lt;/span&gt; such that &lt;span class=&quot;math inline&quot;&gt;u \circ \iota_i = f_i&lt;/span&gt; for all &lt;span class=&quot;math inline&quot;&gt;i&lt;/span&gt;, where &lt;span class=&quot;math inline&quot;&gt;\iota_i : A(b_i) \to \mathsf{RNP}_l&lt;/span&gt; are the canonical inclusions. &lt;span class=&quot;math display&quot;&gt;\begin{tikzcd}
  A(b_1) \arrow[r, &amp;quot;\iota_1&amp;quot;] \arrow[dr, &amp;quot;f_1&amp;quot;&amp;#39;] &amp;amp;
  \mathsf{RNP}_l \arrow[d, dashed, &amp;quot;{\exists!\, u}&amp;quot;] &amp;amp;
  A(b_2) \arrow[l, &amp;quot;\iota_2&amp;quot;&amp;#39;] \arrow[dl, &amp;quot;f_2&amp;quot;] \\
  &amp;amp; X &amp;amp;
\end{tikzcd}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; We must show that &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; satisfies the two colimit conditions:&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Existence of cocone:&lt;/strong&gt; Each partner &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt; binds to &lt;span class=&quot;math inline&quot;&gt;l&lt;/span&gt; at domain &lt;span class=&quot;math inline&quot;&gt;d_j&lt;/span&gt;, yielding inclusion maps &lt;span class=&quot;math inline&quot;&gt;\iota_j : A(b_j) \to \mathsf{RNP}_l&lt;/span&gt;. These are compatible: for any morphism &lt;span class=&quot;math inline&quot;&gt;d_i \to b_j&lt;/span&gt; in &lt;span class=&quot;math inline&quot;&gt;\mathcal{B}_l&lt;/span&gt;, the diagram commutes because the binding of &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt; to domain &lt;span class=&quot;math inline&quot;&gt;d_i&lt;/span&gt; is the same whether we first include &lt;span class=&quot;math inline&quot;&gt;d_i&lt;/span&gt; into &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; and then identify with &lt;span class=&quot;math inline&quot;&gt;b_j&lt;/span&gt;’s binding site, or bind directly.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Universality:&lt;/strong&gt; Suppose &lt;span class=&quot;math inline&quot;&gt;X&lt;/span&gt; is any complex with compatible maps &lt;span class=&quot;math inline&quot;&gt;f_j : A(b_j) \to X&lt;/span&gt;. Define &lt;span class=&quot;math inline&quot;&gt;u : \mathsf{RNP}_l \to X&lt;/span&gt; by mapping each component of &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; to &lt;span class=&quot;math inline&quot;&gt;X&lt;/span&gt; via the corresponding &lt;span class=&quot;math inline&quot;&gt;f_j&lt;/span&gt;. Compatibility of the &lt;span class=&quot;math inline&quot;&gt;f_j&lt;/span&gt; ensures &lt;span class=&quot;math inline&quot;&gt;u&lt;/span&gt; is well-defined on overlaps (shared interfaces between partners). Uniqueness follows from the fact that &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; is generated by the images of &lt;span class=&quot;math inline&quot;&gt;\iota_j&lt;/span&gt;, so &lt;span class=&quot;math inline&quot;&gt;u&lt;/span&gt; is determined on all of &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNP}_l&lt;/span&gt; by the &lt;span class=&quot;math inline&quot;&gt;f_j&lt;/span&gt;. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;corollary&quot;&gt;
&lt;p&gt;&lt;strong&gt;Corollary 27&lt;/strong&gt; (Scaffold Modularity).  &lt;em&gt;The colimit construction implies that the scaffolded complex is the &lt;em&gt;minimal&lt;/em&gt; complex containing all partners with all specified interactions. Adding or removing a binding domain from the lncRNA corresponds to modifying the indexing category &lt;span class=&quot;math inline&quot;&gt;\mathcal{B}_l&lt;/span&gt;, yielding a different colimit—formalizing the modularity of scaffold-mediated assembly.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;10&quot; id=&quot;sec:pirna&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10&lt;/span&gt; piRNA as Security Monitor&lt;/h1&gt;
&lt;p&gt;PIWI-interacting RNAs (piRNAs) are 24–31 nt non-coding RNAs that associate with PIWI-subfamily Argonaute proteins. They are primarily expressed in the germline, where they defend genome integrity by silencing transposable elements (TEs).&lt;/p&gt;
&lt;h2 data-number=&quot;10.1&quot; id=&quot;the-security-monitor-interpretation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.1&lt;/span&gt; The Security Monitor Interpretation&lt;/h2&gt;
&lt;p&gt;Transposable elements are, from the genome’s perspective, &lt;em&gt;malware&lt;/em&gt;: self-replicating sequences that insert themselves into the host genome, potentially disrupting gene function. The piRNA pathway is the cell’s &lt;em&gt;anti-malware system&lt;/em&gt;.&lt;/p&gt;
&lt;div id=&quot;def:pirna-monitor&quot; class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 28&lt;/strong&gt; (piRNA Security Monitor).  A &lt;em&gt;piRNA security monitor&lt;/em&gt; is a tuple &lt;span class=&quot;math inline&quot;&gt;\mu = (P, L, \mathsf{scan},
\mathsf{silence})&lt;/span&gt; where:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;P&lt;/span&gt; is a library of piRNA guide sequences (the malware signature database),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;L&lt;/span&gt; is the set of known transposon families (the threat landscape),&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{scan} : P &amp;times; \Sigma^* \to \{\top, \bot\}&lt;/span&gt; is the scanning function that detects transposon transcripts by complementarity,&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;span class=&quot;math inline&quot;&gt;\mathsf{silence} : \Sigma^* \to \mathsf{Effect}&lt;/span&gt; triggers transcriptional and post-transcriptional silencing of detected threats.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 29&lt;/strong&gt; (Ping-Pong Amplification as Adaptive Immune Response).  &lt;em&gt;The ping-pong amplification cycle, in which sense and antisense piRNAs reciprocally generate each other using transposon transcripts as templates, is formally analogous to an &lt;em&gt;adaptive immune response&lt;/em&gt;:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Initial piRNAs from piRNA clusters serve as the &lt;em&gt;innate&lt;/em&gt; signature set.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Slicing of transposon mRNA by antisense piRNAs generates new sense piRNAs—this is &lt;em&gt;adaptive&lt;/em&gt; expansion of the signature database.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;The cycle amplifies the response specifically against &lt;em&gt;active&lt;/em&gt; transposons, implementing a form of threat-proportional response.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;10.2&quot; id=&quot;formal-properties-of-the-pirna-monitor&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;10.2&lt;/span&gt; Formal Properties of the piRNA Monitor&lt;/h2&gt;
&lt;div id=&quot;thm:pirna-complete&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 30&lt;/strong&gt; (Completeness of Germline Defense).  &lt;em&gt;Under the assumptions that (a) piRNA clusters collectively contain representatives of all active transposon families and (b) the ping-pong cycle reaches steady state, the piRNA security monitor achieves &lt;em&gt;coverage completeness&lt;/em&gt;: &lt;span class=&quot;math display&quot;&gt;\forall\, t \in L_{\text{active}},\; \exists\, p \in P_{&amp;infin;}
  \text{ such that } \mathsf{scan}(p, \mathrm{seq}(t)) = \top&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;P_{&amp;infin;}&lt;/span&gt; is the steady-state piRNA library and &lt;span class=&quot;math inline&quot;&gt;L_{\text{active}}&lt;/span&gt; is the set of currently active transposon families.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; By assumption (a), every active transposon family has at least one representative sequence in a piRNA cluster. Transcription of this cluster produces primary piRNAs antisense to the transposon. These primary piRNAs, loaded into PIWI, cleave transposon mRNAs, generating sense piRNAs that are loaded into a second PIWI paralog. These sense piRNAs in turn cleave cluster-derived antisense transcripts, regenerating antisense piRNAs. By assumption (b), this cycle converges, and the steady-state library &lt;span class=&quot;math inline&quot;&gt;P_{&amp;infin;}&lt;/span&gt; contains both sense and antisense piRNAs complementary to every active transposon, establishing coverage completeness. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;11&quot; id=&quot;sec:haskell&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11&lt;/span&gt; Haskell Implementation&lt;/h1&gt;
&lt;p&gt;We provide a complete Haskell implementation of the framework described above. The implementation consists of the following modules:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;RNAControl.hs&lt;/code&gt;: The core parametric type &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; with all six constructors.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;MicroRNA.hs&lt;/code&gt;: miRNA seed matching, target prediction, and repression scoring.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;SiRNA.hs&lt;/code&gt;: RNA interference pathway including RISC loading, guide strand selection, and target degradation.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;LncRNA.hs&lt;/code&gt;: Scaffold assembly and complex formation.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;code&gt;Main.hs&lt;/code&gt;: Demonstrations of miRNA targeting, siRNA/RNAi silencing, tRNA adaptation, and lncRNA scaffolding.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;11.1&quot; id=&quot;core-type-definition&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.1&lt;/span&gt; Core Type Definition&lt;/h2&gt;
&lt;p&gt;The Haskell encoding of &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; mirrors the mathematical definition:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;data RNAControl p
  = MiRNA  { miSeed :: String, miTargets :: [p],
             miThreshold :: Double }
  | SiRNA  { siGuide :: String, siPassenger :: String,
             siMismatchTol :: Int }
  | LncRNA { lncSequence :: String,
             lncPartners :: [String],
             lncRole :: LncRNARole }
  | TRNA   { trnaAnticodon :: String,
             trnaAminoAcid :: Char }
  | RRNA   { rrnaSubunit :: SubunitType }
  | PiRNA  { piGuide :: String, piTarget :: String }
  deriving (Show, Eq)&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The type parameter &lt;code&gt;p&lt;/code&gt; allows the same type to describe control over different process types, as discussed in Section &lt;a href=&quot;#sec:rnacontrol&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;sec:rnacontrol&quot;&gt;7&lt;/a&gt;.&lt;/p&gt;
&lt;h2 data-number=&quot;11.2&quot; id=&quot;mirna-seed-matching&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.2&lt;/span&gt; miRNA Seed Matching&lt;/h2&gt;
&lt;p&gt;The seed-matching algorithm implements Definition &lt;a href=&quot;#def:seed-score&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;def:seed-score&quot;&gt;2&lt;/a&gt;:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;seedMatch :: String -&amp;gt; String -&amp;gt; Double
seedMatch seed target
  | length target &amp;lt; length seed = 0.0
  | otherwise = maximum scores
  where
    k = length seed
    windows = [ take k (drop i target)
              | i &amp;lt;- [0 .. length target - k] ]
    scores = map (scoreSeed seed) windows

scoreSeed :: String -&amp;gt; String -&amp;gt; Double
scoreSeed s t =
  let pairs = zip s t
      wcScore (a, b)
        | isComplement a b = 1.0
        | isWobble a b     = 0.5
        | otherwise        = 0.0
  in sum (map wcScore pairs) /
     fromIntegral (length pairs)&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;11.3&quot; id=&quot;risc-pattern-matching&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.3&lt;/span&gt; RISC Pattern Matching&lt;/h2&gt;
&lt;p&gt;The RISC handler implements Definition &lt;a href=&quot;#def:risc-handler&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;def:risc-handler&quot;&gt;6&lt;/a&gt;:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;data RISCResult = Cleave | Repress | Pass
  deriving (Show, Eq)

riscMatch :: String -&amp;gt; Int -&amp;gt; String -&amp;gt; RISCResult
riscMatch guide tolerance target =
  let rc = reverseComplement guide
      mismatches = hammingDistance rc target
  in if mismatches &amp;lt;= tolerance
     then if tolerance == 0
          then Cleave
          else Repress
     else Pass&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;11.4&quot; id=&quot;scaffold-assembly&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.4&lt;/span&gt; Scaffold Assembly&lt;/h2&gt;
&lt;p&gt;The scaffold colimit (Theorem &lt;a href=&quot;#thm:scaffold-colimit&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:scaffold-colimit&quot;&gt;26&lt;/a&gt;) is implemented via the &lt;code&gt;assembleComplex&lt;/code&gt; function:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;data Complex = Complex
  { complexName     :: String
  , complexMembers  :: [String]
  , complexScaffold :: String
  } deriving (Show, Eq)

assembleComplex :: String -&amp;gt; [String] -&amp;gt; Complex
assembleComplex scaffold partners =
  Complex { complexName =
              scaffold ++ &amp;quot;-complex&amp;quot;
          , complexMembers = partners
          , complexScaffold = scaffold
          }&lt;/code&gt;&lt;/pre&gt;
&lt;h2 data-number=&quot;11.5&quot; id=&quot;trna-adaptation&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;11.5&lt;/span&gt; tRNA Adaptation&lt;/h2&gt;
&lt;p&gt;The natural transformation &lt;span class=&quot;math inline&quot;&gt;\eta&lt;/span&gt; (Theorem &lt;a href=&quot;#thm:trna-nat&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:trna-nat&quot;&gt;13&lt;/a&gt;) is encoded as a pure function:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;adaptCodon :: String -&amp;gt; Maybe Char
adaptCodon codon = lookup codon codonTable

codonTable :: [(String, Char)]
codonTable =
  [ (&amp;quot;AUG&amp;quot;, &amp;#39;M&amp;#39;), (&amp;quot;UUU&amp;quot;, &amp;#39;F&amp;#39;), (&amp;quot;UUC&amp;quot;, &amp;#39;F&amp;#39;)
  , (&amp;quot;UUA&amp;quot;, &amp;#39;L&amp;#39;), (&amp;quot;UUG&amp;quot;, &amp;#39;L&amp;#39;), ...
  ]&lt;/code&gt;&lt;/pre&gt;
&lt;h1 data-number=&quot;12&quot; id=&quot;sec:extended&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12&lt;/span&gt; Extended Type-Theoretic Analysis&lt;/h1&gt;
&lt;h2 data-number=&quot;12.1&quot; id=&quot;the-ncrna-control-monad&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.1&lt;/span&gt; The ncRNA Control Monad&lt;/h2&gt;
&lt;p&gt;The various ncRNA control mechanisms can be composed monadically. Consider the following observation: an mRNA transcript may be subject to multiple layers of ncRNA control simultaneously—miRNA repression, possible RNAi degradation, and lncRNA-mediated sequestration.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 31&lt;/strong&gt; (ncRNA Control Monad).  Define the monad &lt;span class=&quot;math inline&quot;&gt;\mathcal{M} : \mathbf{Set}\to \mathbf{Set}&lt;/span&gt; by: &lt;span class=&quot;math display&quot;&gt;\mathcal{M}(X) = \prod_{r \in \mathsf{RNAControl}} (r \to X + \mathbf{1})&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;\mathbf{1}&lt;/span&gt; represents the “silenced” outcome. The unit &lt;span class=&quot;math inline&quot;&gt;\eta : X \to \mathcal{M}(X)&lt;/span&gt; embeds uncontrolled expression, and the multiplication &lt;span class=&quot;math inline&quot;&gt;\mu : \mathcal{M}(\mathcal{M}(X)) \to \mathcal{M}(X)&lt;/span&gt; flattens nested control layers.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 32&lt;/strong&gt; (Monad Laws).  &lt;em&gt;&lt;span class=&quot;math inline&quot;&gt;\mathcal{M}&lt;/span&gt; satisfies the monad laws:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Left unit: &lt;span class=&quot;math inline&quot;&gt;\mu \circ \eta_{\mathcal{M}} = \mathrm{id}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Right unit: &lt;span class=&quot;math inline&quot;&gt;\mu \circ \mathcal{M}(\eta) = \mathrm{id}&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;Associativity: &lt;span class=&quot;math inline&quot;&gt;\mu \circ \mu_{\mathcal{M}} =
    \mu \circ \mathcal{M}(\mu)&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;12.2&quot; id=&quot;interaction-between-ncrna-classes&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.2&lt;/span&gt; Interaction Between ncRNA Classes&lt;/h2&gt;
&lt;p&gt;The different ncRNA classes do not act in isolation; they form a complex interaction network:&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 33&lt;/strong&gt; (ceRNA Hypothesis, Formalized).  The &lt;em&gt;competing endogenous RNA&lt;/em&gt; (ceRNA) hypothesis posits that transcripts sharing miRNA response elements (MREs) can regulate each other by competing for a shared pool of miRNAs. Formally, let &lt;span class=&quot;math inline&quot;&gt;m_1, m_2&lt;/span&gt; be two transcripts with shared MREs for miRNA &lt;span class=&quot;math inline&quot;&gt;\mu&lt;/span&gt;. Then: &lt;span class=&quot;math display&quot;&gt;\text{Abundance}(m_1) \uparrow \;\implies\;
  \text{Free}(\mu) \downarrow \;\implies\;
  \text{Repression}(m_2) \downarrow&lt;/span&gt; This implements a form of &lt;em&gt;inter-process communication&lt;/em&gt; mediated by the shared miRNA signal.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;proposition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Proposition 34&lt;/strong&gt; (lncRNA–miRNA Sponge Effect).  &lt;em&gt;A lncRNA acting as a miRNA sponge (e.g., circRNAs with dense MRE arrays) implements a &lt;em&gt;rate limiter&lt;/em&gt; in the middleware stack: &lt;span class=&quot;math display&quot;&gt;\text{Effective silencing rate} =
  \frac{[\mu]_{\text{free}}}{[\mu]_{\text{total}}} &amp;middot; k_{\text{max}}&lt;/span&gt; where &lt;span class=&quot;math inline&quot;&gt;[\mu]_{\text{free}}&lt;/span&gt; is the concentration of miRNA not sequestered by the sponge.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;12.3&quot; id=&quot;type-safety-of-the-ncrna-control-layer&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;12.3&lt;/span&gt; Type Safety of the ncRNA Control Layer&lt;/h2&gt;
&lt;div id=&quot;thm:type-safety&quot; class=&quot;theorem&quot;&gt;
&lt;p&gt;&lt;strong&gt;Theorem 35&lt;/strong&gt; (Type Safety).  &lt;em&gt;The ncRNA control system, modeled as &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt;, satisfies type safety in the following sense:&lt;/em&gt;&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Progress&lt;/strong&gt;: Every ncRNA control element either actively modifies its target process or is in a well-defined inactive state (not loaded, sequestered, or degraded).&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;em&gt;&lt;strong&gt;Preservation&lt;/strong&gt;: The type of control (guard, exception, middleware, transformation, VM instruction, security scan) is preserved throughout the ncRNA’s functional lifetime.&lt;/em&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;proof&quot;&gt;
&lt;p&gt;&lt;em&gt;Proof.&lt;/em&gt; Progress: Each constructor of &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; carries the necessary information to execute its control function. An MiRNA carries its seed and threshold; if a matching target exists and the score exceeds the threshold, repression occurs (progress). If no target matches, the miRNA remains in RISC in a scannable state (well-defined inactive state). Similar arguments apply to each constructor.&lt;/p&gt;
&lt;p&gt;Preservation: The ncRNA’s type is determined at biogenesis (Dicer processing for siRNA/miRNA, transcription for lncRNA, tRNA gene expression for tRNA, etc.) and is structurally encoded in its sequence and modifications. Post-biogenesis, no process converts one ncRNA class into another (an miRNA does not become an siRNA). Thus the control type is preserved. ◻&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;13&quot; id=&quot;sec:composition&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13&lt;/span&gt; Compositional Semantics of ncRNA Networks&lt;/h1&gt;
&lt;h2 data-number=&quot;13.1&quot; id=&quot;the-ncrna-operad&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.1&lt;/span&gt; The ncRNA Operad&lt;/h2&gt;
&lt;p&gt;The various modes of ncRNA control can be organized into an operad structure, capturing how multiple ncRNA inputs compose to produce a single regulatory output.&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 36&lt;/strong&gt; (ncRNA Operad).  Define the operad &lt;span class=&quot;math inline&quot;&gt;\mathcal{O}_{\text{ncRNA}}&lt;/span&gt; with:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Operations &lt;span class=&quot;math inline&quot;&gt;\mathcal{O}(n)&lt;/span&gt;: the set of ncRNA regulatory functions with &lt;span class=&quot;math inline&quot;&gt;n&lt;/span&gt; inputs (target transcripts) and one output (regulatory effect).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Composition: given &lt;span class=&quot;math inline&quot;&gt;f \in \mathcal{O}(n)&lt;/span&gt; and &lt;span class=&quot;math inline&quot;&gt;g_i \in \mathcal{O}(k_i)&lt;/span&gt; for &lt;span class=&quot;math inline&quot;&gt;1 &amp;le; i &amp;le; n&lt;/span&gt;, the composite &lt;span class=&quot;math inline&quot;&gt;f \circ (g_1, &amp;hellip;, g_n) \in \mathcal{O}(k_1 + &amp;middot;s + k_n)&lt;/span&gt; represents hierarchical regulation.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Unit: the identity regulation (no effect).&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;h2 data-number=&quot;13.2&quot; id=&quot;regulatory-cascades-as-kleisli-composition&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;13.2&lt;/span&gt; Regulatory Cascades as Kleisli Composition&lt;/h2&gt;
&lt;p&gt;When ncRNA control effects compose sequentially (e.g., a lncRNA modulates miRNA availability, which in turn affects mRNA translation), the appropriate compositional structure is Kleisli composition in the ncRNA control monad:&lt;/p&gt;
&lt;div class=&quot;definition&quot;&gt;
&lt;p&gt;&lt;strong&gt;Definition 37&lt;/strong&gt; (Regulatory Cascade).  A &lt;em&gt;regulatory cascade&lt;/em&gt; is a sequence of Kleisli arrows: &lt;span class=&quot;math display&quot;&gt;f_1 : A \to \mathcal{M}(B), \quad
  f_2 : B \to \mathcal{M}(C), \quad &amp;hellip;, \quad
  f_n : Y \to \mathcal{M}(Z)&lt;/span&gt; with composite: &lt;span class=&quot;math display&quot;&gt;f_n \circ_{\mathcal{M}} &amp;middot;s \circ_{\mathcal{M}} f_1
  : A \to \mathcal{M}(Z)&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;example&quot;&gt;
&lt;p&gt;&lt;strong&gt;Example 38&lt;/strong&gt; (ceRNA Cascade).  Consider the cascade: lncRNA PTENP1 (sponge) &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; miR-21 (freed) &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; PTEN mRNA (derepressed) &lt;span class=&quot;math inline&quot;&gt;\to&lt;/span&gt; PI3K/AKT pathway (modulated). This four-step cascade is a Kleisli composite: &lt;span class=&quot;math display&quot;&gt;\text{PTENP1-sponge} \circ_{\mathcal{M}} \text{miR-21-guard}
  \circ_{\mathcal{M}} \text{PTEN-translation}
  : \text{lncRNA-level} \to \mathcal{M}(\text{pathway-level})&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h1 data-number=&quot;14&quot; id=&quot;sec:discussion&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14&lt;/span&gt; Discussion and Conclusion&lt;/h1&gt;
&lt;h2 data-number=&quot;14.1&quot; id=&quot;summary-of-results&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.1&lt;/span&gt; Summary of Results&lt;/h2&gt;
&lt;p&gt;We have developed a comprehensive type-theoretic framework for non-coding RNA function, showing that:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;The six major classes of ncRNAs correspond precisely to six fundamental programming-language control-flow primitives: guards, exceptions, middleware, natural transformations, virtual machines, and security monitors.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;These roles are unified under the parametric type &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The RISC complex implements typed pattern matching (Theorem &lt;a href=&quot;#thm:risc&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:risc&quot;&gt;23&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;lncRNA scaffold assembly satisfies the universal property of the categorical colimit (Theorem &lt;a href=&quot;#thm:scaffold-colimit&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:scaffold-colimit&quot;&gt;26&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;tRNA decoding is a natural transformation between the codon and amino acid functors (Theorem &lt;a href=&quot;#thm:trna-nat&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:trna-nat&quot;&gt;13&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The ncRNA control layer satisfies type safety (Theorem &lt;a href=&quot;#thm:type-safety&quot; data-reference-type=&quot;ref&quot; data-reference=&quot;thm:type-safety&quot;&gt;35&lt;/a&gt;).&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;14.2&quot; id=&quot;biological-implications&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.2&lt;/span&gt; Biological Implications&lt;/h2&gt;
&lt;p&gt;Our framework suggests that the cell has evolved a &lt;em&gt;typed control plane&lt;/em&gt; separate from the data plane (protein-coding mRNAs). This separation of concerns mirrors a fundamental software engineering principle and may explain the explosive growth of the non-coding transcriptome in complex organisms: as biological “programs” grow larger, proportionally more control flow is required.&lt;/p&gt;
&lt;p&gt;The observation that &lt;span class=&quot;math inline&quot;&gt;&amp;gt;98\%&lt;/span&gt; of the transcriptome is non-coding parallels the observation in large software systems that control logic (configuration, middleware, monitoring, error handling) often exceeds the core business logic in volume.&lt;/p&gt;
&lt;h2 data-number=&quot;14.3&quot; id=&quot;predictions&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.3&lt;/span&gt; Predictions&lt;/h2&gt;
&lt;p&gt;Our framework makes several testable predictions:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Organisms with more complex developmental programs should have proportionally larger ncRNA repertoires (more control flow for larger programs).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;ncRNA regulatory networks should exhibit compositionality: the effect of multiple ncRNAs should be predictable from their individual effects and their interaction type (guard composition, exception hierarchy, middleware chaining).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;The piRNA system should show adaptive dynamics consistent with our security monitor formalization—specifically, threat-proportional response amplification.&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;h2 data-number=&quot;14.4&quot; id=&quot;limitations&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.4&lt;/span&gt; Limitations&lt;/h2&gt;
&lt;p&gt;Our framework intentionally abstracts away quantitative kinetics in favor of type-theoretic precision. A full quantitative treatment would require combining our type theory with a stochastic process calculus. Additionally, many ncRNA functions remain undiscovered; our six-constructor type may require extension as new functional classes emerge.&lt;/p&gt;
&lt;h2 data-number=&quot;14.5&quot; id=&quot;future-work&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.5&lt;/span&gt; Future Work&lt;/h2&gt;
&lt;p&gt;Several directions merit exploration:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Extending the framework to circular RNAs (circRNAs) and their unique back-splicing–derived topology.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Developing a dependent type theory where ncRNA types depend on cellular state (tissue type, developmental stage).&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Connecting to the broader DNA-Lang framework, where ncRNAs serve as the control-flow layer for the genetic programming language.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Formalizing epitranscriptomic modifications (m&lt;span class=&quot;math inline&quot;&gt;^6&lt;/span&gt;A, pseudouridine) as type annotations on ncRNAs.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 data-number=&quot;14.6&quot; id=&quot;conclusion&quot;&gt;&lt;span class=&quot;header-section-number&quot;&gt;14.6&lt;/span&gt; Conclusion&lt;/h2&gt;
&lt;p&gt;The non-coding RNA transcriptome is not genomic noise; it is the cell’s control plane. By recognizing miRNAs as guards, siRNAs as exception handlers, lncRNAs as middleware, tRNAs as natural transformations, rRNAs as virtual machines, and piRNAs as security monitors, we gain both formal precision and conceptual clarity. The parametric type &lt;span class=&quot;math inline&quot;&gt;\mathsf{RNAControl}\langle P\rangle&lt;/span&gt; provides a unifying abstraction, and the accompanying theorems establish rigorous connections between molecular biology and type theory. The complete Haskell implementation demonstrates that these abstractions are not merely metaphorical but computationally precise.&lt;/p&gt;

m:.5rem;background:linear-gradient(135deg,var(--text),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}\n.paper-subtitle{font-size:1rem;color:var(--text-dim);margin-bottom:1rem}\n.paper-meta-row{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--text-dim)}\n.paper-meta-row a{font-size:.82rem}\n\nh1,h2,h3,h4,h5,h6{color:var(--text);letter-spacing:-.01em;margin-top:2.5rem;margin-bottom:.8rem}\nh2{font-size:1.5rem;font-weight:700;padding-bottom:.5rem;border-bottom:1px solid var(--border)}\nh3{font-size:1.2rem;font-weight:600}\nh4{font-size:1.05rem;font-weight:600;color:var(--accent2)}\n\np{margin-bottom:1rem}\nul,ol{margin-bottom:1rem;padding-left:1.5rem}\nli{margin-bottom:.3rem}\n\ncode{font-family:var(--font-mono);font-size:.88em;background:var(--code-bg);color:var(--accent2);padding:.15em .4em;border-radius:4px}\npre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:1.2rem 1.5rem;overflow-x:auto;margin:1.5rem 0;line-height:1.5}\npre code{background:none;padding:0;font-size:.85rem;color:var(--text)}\n\n.sourceCode{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:1.2rem 1.5rem;overflow-x:auto;margin:1.5rem 0}\n.sourceCode pre{background:none;border:none;padding:0;margin:0}\n.sourceCode code{font-size:.85rem;color:var(--text)}\n\nblockquote{border-left:3px solid var(--accent);padding:.8rem 1.2rem;margin:1.5rem 0;background:var(--accent-dim);border-radius:0 8px 8px 0;color:var(--text-dim);font-style:italic}\n\ntable{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.88rem}\nth{text-align:left;padding:.6rem .8rem;background:var(--surface2);color:var(--accent2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}\ntd{padding:.6rem .8rem;border-bottom:1px solid var(--border);color:var(--text-dim)}\ntr:hover td{background:rgba(0,184,148,0.03);color:var(--text)}\n\n.theorem,.definition,.proposition,.lemma,.corollary,.invariant,.remark{\n  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n  border-radius:0 8px 8px 0;padding:1.2rem 1.5rem;margin:1.5rem 0\n}\n.theorem-title,.def-title{font-weight:700;color:var(--accent2);margin-bottom:.5rem;font-size:.9rem}\n\nfigure{margin:1.5rem 0;text-align:center}\nfigcaption{font-size:.82rem;color:var(--text-dim);margin-top:.5rem;font-style:italic}\nimg{max-width:100%;height:auto;border-radius:8px}\n\n.menu-toggle{display:none;position:fixed;top:1rem;left:1rem;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;color:var(--text);cursor:pointer;font-size:1.2rem}\n\n@media(max-width:900px){\n  .sidebar{transform:translateX(-100%)}\n  .sidebar.open{transform:translateX(0)}\n  .main-content{margin-left:0;padding:2rem 1.2rem}\n  .menu-toggle{display:block}\n}\n\n#TOC{display:none}\n.header-section-number{color:var(--accent);margin-right:.4rem;font-weight:600}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cbutton class=\"menu-toggle\" onclick=\"document.querySelector('.sidebar').classList.toggle('open')\"\u003e\u0026#9776;\u003c/button\u003e\n\u003cdiv class=\"page-wrapper\"\u003e\n\u003caside class=\"sidebar\" id=\"sidebar\"\u003e\n  \u003cdiv class=\"sidebar-header\"\u003e\n    \u003ca href=\"/\"\u003e\u0026larr; All Papers\u003c/a\u003e\n    \u003cdiv class=\"sidebar-title\"\u003eNon-Coding RNAs as Signals and Middleware — DNA-Lang, Part III\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cnav class=\"toc-nav\" id=\"toc-nav\"\u003e\u003c/nav\u003e\n  \u003cdiv style=\"margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)\"\u003e\n    \u003ca href=\"../papers/noncoding-rna.pdf\" style=\"font-size:.8rem;color:var(--accent2);display:flex;align-items:center;gap:.4rem\"\u003ePDF Version \u0026darr;\u003c/a\u003e\n  \u003c/div\u003e\n\u003c/aside\u003e\n\u003cmain class=\"main-content\" id=\"content\"\u003e\n  \u003cdiv class=\"paper-header\"\u003e\n    \u003cspan class=\"paper-part\"\u003ePart III\u003c/span\u003e\n    \u003ch1 style=\"margin-top:0\"\u003eNon-Coding RNAs as Signals and Middleware — DNA-Lang, Part III\u003c/h1\u003e\n    \u003cdiv class=\"paper-meta-row\"\u003e\n      \u003cspan\u003eMatthew Long\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003cspan\u003eYonedaAI Research Collective\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003cspan\u003eChicago, IL\u003c/span\u003e\n      \u003cspan\u003e\u0026middot;\u003c/span\u003e\n      \u003ca href=\"../papers/noncoding-rna.pdf\"\u003ePDF\u003c/a\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eKeywords:\u003c/strong\u003e non-coding RNA, type theory, miRNA, siRNA, lncRNA, tRNA, rRNA, piRNA, category theory, natural transformation, colimit, middleware, guard clause, exception handling, RNA interference, RISC, post-transcriptional regulation\u003c/p\u003e\n\u003ch1 data-number=\"1\" id=\"sec:intro\"\u003e\u003cspan class=\"header-section-number\"\u003e1\u003c/span\u003e Introduction\u003c/h1\u003e\n\u003cp\u003eThe Central Dogma of molecular biology, in its most simplistic reading, posits a linear flow \u003cspan class=\"math inline\"\u003e\\text{DNA} \\to \\text{RNA} \\to \\text{Protein}\u003c/span\u003e. This reading assigns to RNA the role of a passive intermediate—a mere “messenger.” The genomic era has shattered this view. Deep sequencing reveals that while only \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e1.5% of the human genome encodes proteins, \u003cem\u003eover 80%\u003c/em\u003e is transcribed into RNA at some point in some cell type \u003cspan class=\"citation\" data-cites=\"encode2012\"\u003e\u003c/span\u003e. The vast majority of the transcriptome—conservatively 98%—is \u003cem\u003enon-coding\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eThis non-coding RNA (ncRNA) revolution poses a conceptual challenge: if these transcripts are not mere noise, what computational role do they play? We argue that the answer comes naturally from programming language theory. Non-coding RNAs are not data; they are \u003cem\u003econtrol flow\u003c/em\u003e. Specifically:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003emiRNAs\u003c/strong\u003e are \u003cem\u003eguard clauses\u003c/em\u003e: short (\u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e22 nt) sequences that post-transcriptionally test whether a target mRNA should be translated, repressing it if the guard evaluates to \u003ccode\u003etrue\u003c/code\u003e (i.e., if complementarity is sufficient).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003esiRNAs\u003c/strong\u003e and the \u003cstrong\u003eRNA interference\u003c/strong\u003e (RNAi) pathway implement \u003cem\u003eexception handling\u003c/em\u003e: the RISC complex is a pattern-matching exception handler that degrades mRNAs whose sequences match the loaded guide strand.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003elncRNAs\u003c/strong\u003e are \u003cem\u003emiddleware scaffolds\u003c/em\u003e: they bring together protein complexes into higher-order regulatory assemblies, formalizable as categorical colimits.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003etRNAs\u003c/strong\u003e are \u003cem\u003enatural transformations\u003c/em\u003e: adaptors that mediate between the codon functor (reading mRNA) and the amino acid functor (building protein), satisfying naturality conditions.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003erRNAs\u003c/strong\u003e define the \u003cem\u003evirtual machine\u003c/em\u003e: the ribosome is the execution engine whose structure and catalytic center are RNA-based.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003epiRNAs\u003c/strong\u003e are \u003cem\u003esecurity monitors\u003c/em\u003e: they silence transposable elements in the germline, acting as an anti-malware system.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eWe unify these roles under a single parametric type \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e, where \u003cspan class=\"math inline\"\u003eP\u003c/span\u003e is the controlled process, and develop the associated formal theory.\u003c/p\u003e\n\u003ch2 data-number=\"1.1\" id=\"related-work\"\u003e\u003cspan class=\"header-section-number\"\u003e1.1\u003c/span\u003e Related Work\u003c/h2\u003e\n\u003cp\u003eThe analogy between molecular biology and computation has a long history, from von Neumann’s self-reproducing automata through Turing machine models of gene regulation. Regev and Shapiro \u003cspan class=\"citation\" data-cites=\"regev2001\"\u003e\u003c/span\u003e modeled cellular processes in the \u003cspan class=\"math inline\"\u003e\\pi\u003c/span\u003e-calculus. Cardelli \u003cspan class=\"citation\" data-cites=\"cardelli2005\"\u003e\u003c/span\u003e introduced abstract machines for molecular systems. Fontana and Buss \u003cspan class=\"citation\" data-cites=\"fontana1994\"\u003e\u003c/span\u003e explored \u003cspan class=\"math inline\"\u003e\\lambda\u003c/span\u003e-calculus as a chemistry. Our contribution is the first systematic type-theoretic treatment of the full ncRNA landscape, emphasizing the role of non-coding transcripts as typed control-flow primitives rather than as data.\u003c/p\u003e\n\u003ch2 data-number=\"1.2\" id=\"contributions\"\u003e\u003cspan class=\"header-section-number\"\u003e1.2\u003c/span\u003e Contributions\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eA type-theoretic formalization of six major ncRNA classes as programming-language control-flow primitives.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe parametric type \u003cspan class=\"math inline\"\u003e\\mathsf{RNAControl}\\langle P\\rangle\u003c/span\u003e unifying ncRNA control roles.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe \u003cem\u003eRISC Pattern-Matching Theorem\u003c/em\u003e (Theorem \u003ca href=\"#thm:risc\" data-reference-type=\"ref\" data-reference=\"thm:risc\"\u003e23\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe \u003cem\u003eScaffold Colimit Theorem\u003c/em\u003e (Theorem \u003ca href=\"#thm:scaffold-colimit\" data-reference-type=\"ref\" data-reference=\"thm:scaffold-colimit\"\u003e26\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe \u003cem\u003etRNA Natural Transformation Theorem\u003c/em\u003e (Theorem \u003ca href=\"#thm:trna-nat\" data-reference-type=\"ref\" data-reference=\"thm:trna-nat\"\u003e13\u003c/a\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eA complete, compilable Haskell implementation.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 data-number=\"1.3\" id=\"paper-organization\"\u003e\u003cspan class=\"header-section-number\"\u003e1.3\u003c/span\u003e Paper Organization\u003c/h2\u003e\n\u003cp\u003eSections \u003ca href=\"#sec:mirna\" data-reference-type=\"ref\" data-reference=\"sec:mirna\"\u003e2\u003c/a\u003e–\u003ca href=\"#sec:rrna\" data-reference-type=\"ref\" data-reference=\"sec:rrna\"\u003e6\u003c/a\u003e develop the formalization for each ncRNA class. Section \u003ca href=\"#sec:rnacontrol\" data-reference-type=\"ref\" data-reference=\"sec:rnacontrol\"\u003e7\u003c/a\u003e introduces the unifying type. Sections \u003ca href=\"#sec:rnai-typed\" data-reference-type=\"ref\" data-reference=\"sec:rnai-typed\"\u003e8\u003c/a\u003e–\u003ca href=\"#sec:pirna\" data-reference-type=\"ref\" data-reference=\"sec:pirna\"\u003e10\u003c/a\u003e present the main theorems. Section \u003ca href=\"#sec:haskell\" data-reference-type=\"ref\" data-reference=\"sec:haskell\"\u003e11\u003c/a\u003e describes the implementation. Section \u003ca href=\"#sec:discussion\" data-reference-type=\"ref\" data-reference=\"sec:discussion\"\u003e14\u003c/a\u003e concludes.\u003c/p\u003e\n\u003ch1 data-number=\"2\" id=\"sec:mirna\"\u003e\u003cspan class=\"header-section-number\"\u003e2\u003c/span\u003e miRNA as Guard Clauses\u003c/h1\u003e\n\u003cp\u003eMicroRNAs (miRNAs) are \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e22-nucleotide single-stranded RNA molecules that regulate gene expression post-transcriptionally. They are processed from longer precursors (pri-miRNA \u003cspan class=\"math inline\"\u003e\\to\u003c/span\u003e pre-miRNA \u003cspan class=\"math inline\"\u003e\\to\u003c/span\u003e mature miRNA) and loaded into Argonaute (AGO) proteins to form the miRNA-induced silencing complex (miRISC). The loaded miRNA then guides miRISC to complementary sites in the 3\u003cspan class=\"math inline\"\u003e\u0026#39;\u003c/span\u003e UTR of target mRNAs, resulting in translational repression or mRNA destabilization.\u003c/p\u003e\n\u003ch2 data-number=\"2.1\" id=\"the-guard-clause-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e2.1\u003c/span\u003e The Guard Clause Interpretation\u003c/h2\u003e\n\u003cp\u003eIn programming, a \u003cem\u003eguard clause\u003c/em\u003e is a conditional test that, when true, causes early termination or redirection of execution:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003etranslate :: mRNA -\u0026gt; Maybe Protein\ntranslate msg\n  | miRNAGuard seed msg = Nothing   -- repressed\n  | otherwise           = Just (ribosome msg)\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe key insight is that the miRNA seed region (positions 2–8 of the guide strand) functions exactly as a \u003cem\u003epattern\u003c/em\u003e in a guard clause.\u003c/p\u003e\n\u003cdiv id=\"def:mirna-guard\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 1\u003c/strong\u003e (miRNA Guard).  Let \u003cspan class=\"math inline\"\u003e\\Sigma = \\{A, U, G, C\\}\u003c/span\u003e be the RNA alphabet. A \u003cem\u003emiRNA guard\u003c/em\u003e is a triple \u003cspan class=\"math inline\"\u003eg = (s, \\theta, \\sigma)\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003es \\in \\Sigma^{6\\text{--}8}\u003c/span\u003e is the \u003cem\u003eseed sequence\u003c/em\u003e (the pattern),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\theta \\in [0,1]\u003c/span\u003e is the \u003cem\u003erepression threshold\u003c/em\u003e (minimum complementarity score),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003e\\sigma : \\Sigma^* \u0026times; \\Sigma^* \\to [0,1]\u003c/span\u003e is the \u003cem\u003eseed-match scoring function\u003c/em\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe guard \u003cem\u003efires\u003c/em\u003e on a target \u003cspan class=\"math inline\"\u003et \\in \\Sigma^*\u003c/span\u003e if and only if \u003cspan class=\"math inline\"\u003e\\sigma(s, t) \u0026ge; \\theta\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:seed-score\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 2\u003c/strong\u003e (Seed Match Score).  Given seed \u003cspan class=\"math inline\"\u003es = s_1 s_2 \u0026middot;s s_k\u003c/span\u003e and a target subsequence \u003cspan class=\"math inline\"\u003et = t_1 t_2 \u0026middot;s t_k\u003c/span\u003e, define the \u003cem\u003eWatson–Crick complementarity indicator\u003c/em\u003e: \u003cspan class=\"math display\"\u003e\\mathrm{wc}(a, b) =\n  \\begin{cases}\n    1 \u0026amp; \\text{if } (a,b) \\in \\{(A,U),(U,A),(G,C),(C,G)\\} \\\\\n    0.5 \u0026amp; \\text{if } (a,b) \\in \\{(G,U),(U,G)\\} \\quad\\text{(wobble)} \\\\\n    0 \u0026amp; \\text{otherwise}\n  \\end{cases}\u003c/span\u003e Then: \u003cspan class=\"math display\"\u003e\\sigma(s, t) = \\frac{1}{k}\\sum_{i=1}^{k} \\mathrm{wc}(s_i, t_i)\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv id=\"prop:guard-compose\" class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 3\u003c/strong\u003e (Guard Compositionality).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003eg_1 = (s_1, \\theta_1, \\sigma)\u003c/span\u003e and \u003cspan class=\"math inline\"\u003eg_2 = (s_2, \\theta_2, \\sigma)\u003c/span\u003e be miRNA guards targeting the same mRNA \u003cspan class=\"math inline\"\u003em\u003c/span\u003e. Define the \u003cem\u003ecooperative guard\u003c/em\u003e \u003cspan class=\"math inline\"\u003eg_1 \\wedge g_2\u003c/span\u003e by: \u003cspan class=\"math display\"\u003e(g_1 \\wedge g_2)(m) = g_1(m) \\lor g_2(m)\u003c/span\u003e Then the effective repression of \u003cspan class=\"math inline\"\u003em\u003c/span\u003e under multiple miRNAs is captured by the disjunction of individual guards. If miRNAs act cooperatively, the effective threshold is lowered: \u003cspan class=\"math display\"\u003e\\theta_{\\text{eff}} = \\min(\\theta_1, \\theta_2) \u0026middot;\n  (1 - \\alpha \u0026middot; \\mathbb{1}[\\text{sites within 40\\,nt}])\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\alpha \\in [0, 0.3]\u003c/span\u003e is the cooperativity factor.\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch2 data-number=\"2.2\" id=\"target-multiplicity-and-the-many-to-many-relation\"\u003e\u003cspan class=\"header-section-number\"\u003e2.2\u003c/span\u003e Target Multiplicity and the Many-to-Many Relation\u003c/h2\u003e\n\u003cp\u003eA single miRNA can target hundreds of distinct mRNAs, and a single mRNA can be targeted by many miRNAs. This yields a bipartite graph \u003cspan class=\"math inline\"\u003eG = (M, T, E)\u003c/span\u003e where \u003cspan class=\"math inline\"\u003eM\u003c/span\u003e is the set of miRNAs, \u003cspan class=\"math inline\"\u003eT\u003c/span\u003e the set of target mRNAs, and \u003cspan class=\"math inline\"\u003eE \\subseteq M \u0026times; T\u003c/span\u003e the targeting relation.\u003c/p\u003e\n\u003cdiv class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 4\u003c/strong\u003e (miRNA Regulatory Network).  The \u003cem\u003emiRNA regulatory network\u003c/em\u003e is the profunctor \u003cspan class=\"math inline\"\u003e\\mathcal{R} : M^{\\mathrm{op}} \u0026times; T \\to \\mathbf{Set}\u003c/span\u003e defined by: \u003cspan class=\"math display\"\u003e\\mathcal{R}(m, t) = \\{(i, \\sigma_i) \\mid\n    \\text{site } i \\text{ in 3\u0026#39;\\,UTR of } t \\text{ matches seed of } m\n    \\text{ with score } \\sigma_i \u0026ge; \\theta_m\\}\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cp\u003eThis profunctor captures not just \u003cem\u003ewhether\u003c/em\u003e targeting occurs but \u003cem\u003ewhere\u003c/em\u003e and \u003cem\u003ehow strongly\u003c/em\u003e.\u003c/p\u003e\n\u003ch1 data-number=\"3\" id=\"sec:sirna\"\u003e\u003cspan class=\"header-section-number\"\u003e3\u003c/span\u003e siRNA and RNA Interference as Exception Handling\u003c/h1\u003e\n\u003cp\u003eSmall interfering RNAs (siRNAs) are \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e20–25 nt double-stranded RNA molecules that trigger the RNA interference (RNAi) pathway. Unlike miRNAs, which typically achieve partial complementarity and translational repression, siRNAs achieve \u003cem\u003eperfect\u003c/em\u003e or \u003cem\u003enear-perfect\u003c/em\u003e complementarity with their targets, leading to endonucleolytic cleavage and degradation.\u003c/p\u003e\n\u003ch2 data-number=\"3.1\" id=\"the-exception-handling-interpretation\"\u003e\u003cspan class=\"header-section-number\"\u003e3.1\u003c/span\u003e The Exception-Handling Interpretation\u003c/h2\u003e\n\u003cp\u003eThe RNAi pathway closely parallels a typed exception-handling system:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eException generation\u003c/strong\u003e: Double-stranded RNA (dsRNA) signals an anomaly (e.g., viral replication, transposon activity). This is the \u003ccode\u003ethrow\u003c/code\u003e statement.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eException processing\u003c/strong\u003e: The enzyme Dicer cleaves dsRNA into \u003cspan class=\"math inline\"\u003e\\sim\u003c/span\u003e21 nt siRNA duplexes—breaking the exception into typed fragments.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHandler registration\u003c/strong\u003e: One strand (the \u003cem\u003eguide strand\u003c/em\u003e) is loaded into the RISC complex, registering the exception handler.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePattern matching\u003c/strong\u003e: RISC scans the transcriptome, testing each mRNA against the guide strand by sequence complementarity—this is pattern matching.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eException propagation\u003c/strong\u003e: Upon a match, AGO2 cleaves the target mRNA, propagating the “exception” (silencing) to all copies.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cdiv id=\"def:rnai-exception\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 5\u003c/strong\u003e (RNAi Exception Type).  An \u003cem\u003eRNAi exception\u003c/em\u003e is a tuple \u003cspan class=\"math inline\"\u003e\\varepsilon = (d, c, g, h)\u003c/span\u003e where:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003ed \\in \\Sigma^*\u003c/span\u003e is the trigger dsRNA (the thrown exception),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003ec : \\Sigma^* \\to [\\Sigma^{21}]\u003c/span\u003e is the Dicer cleavage function (exception decomposition),\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eg \\in \\Sigma^{21}\u003c/span\u003e is the selected guide strand,\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cspan class=\"math inline\"\u003eh : \\Sigma^{21} \u0026times; \\Sigma^* \\to \\{\\mathsf{Cleave},\n    \\mathsf{Pass}\\}\u003c/span\u003e is the RISC handler function.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv id=\"def:risc-handler\" class=\"definition\"\u003e\n\u003cp\u003e\u003cstrong\u003eDefinition 6\u003c/strong\u003e (RISC Handler).  The RISC handler \u003cspan class=\"math inline\"\u003eh\u003c/span\u003e is defined by: \u003cspan class=\"math display\"\u003eh(g, m) =\n  \\begin{cases}\n    \\mathsf{Cleave} \u0026amp; \\text{if } \\mathrm{hamming}(g, \\mathrm{rc}(m_i)) \u0026le; \\delta\n      \\text{ for some site } i \\\\\n    \\mathsf{Pass} \u0026amp; \\text{otherwise}\n  \\end{cases}\u003c/span\u003e where \u003cspan class=\"math inline\"\u003e\\mathrm{rc}\u003c/span\u003e denotes the reverse complement and \u003cspan class=\"math inline\"\u003e\\delta\u003c/span\u003e is the mismatch tolerance (typically 0 for siRNAs, \u003cspan class=\"math inline\"\u003e\u0026le; 4\u003c/span\u003e for miRNAs).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"proposition\"\u003e\n\u003cp\u003e\u003cstrong\u003eProposition 7\u003c/strong\u003e (Specificity–Sensitivity Tradeoff).  \u003cem\u003eLet \u003cspan class=\"math inline\"\u003e\\delta\u003c/span\u003e be the mismatch tolerance of the RISC handler.\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\delta = 0\u003c/span\u003e (perfect match) yields maximum specificity but limited sensitivity. This is the siRNA regime.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cem\u003e\u003cspan class=\"math inline\"\u003e\\delta \u0026le; 4\u003c/span\u003e (partial match) yields lower specificity but broader regulatory reach. This is the miRNA regime.\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp
